const FACE_DEFS = {
  east:  { normal: [ 1, 0, 0], corners: (f, t) => [[t[0], f[1], f[2]], [t[0], t[1], f[2]], [t[0], t[1], t[2]], [t[0], f[1], t[2]]] },
  west:  { normal: [-1, 0, 0], corners: (f, t) => [[f[0], f[1], t[2]], [f[0], t[1], t[2]], [f[0], t[1], f[2]], [f[0], f[1], f[2]]] },
  up:    { normal: [ 0, 1, 0], corners: (f, t) => [[f[0], t[1], t[2]], [t[0], t[1], t[2]], [t[0], t[1], f[2]], [f[0], t[1], f[2]]] },
  down:  { normal: [ 0,-1, 0], corners: (f, t) => [[f[0], f[1], f[2]], [t[0], f[1], f[2]], [t[0], f[1], t[2]], [f[0], f[1], t[2]]] },
  south: { normal: [ 0, 0, 1], corners: (f, t) => [[t[0], f[1], t[2]], [t[0], t[1], t[2]], [f[0], t[1], t[2]], [f[0], f[1], t[2]]] },
  north: { normal: [ 0, 0,-1], corners: (f, t) => [[f[0], f[1], f[2]], [f[0], t[1], f[2]], [t[0], t[1], f[2]], [t[0], f[1], f[2]]] }
};
const FACE_NAMES = Object.keys(FACE_DEFS);
const FACE_DIRS = {
  east: [1, 0, 0], west: [-1, 0, 0], up: [0, 1, 0],
  down: [0, -1, 0], south: [0, 0, 1], north: [0, 0, -1],
};

/* ============================= GEOMETRY BATCHING ============================= */

function getBucket(material, buckets = materialBuckets) {
  let b = buckets.get(material);
  if (!b) {
    b = { material, faces: [] };
    buckets.set(material, b);
  }
  return b;
}

const _qc0 = new THREE.Vector3(), _qc1 = new THREE.Vector3(), _qc2 = new THREE.Vector3(), _qc3 = new THREE.Vector3();
const _qn = new THREE.Vector3();
const missingTextureReported = new Set();

function pushQuad(bucket, c0, c1, c2, c3, n, uvs, blockKey) {
  const worldU = c0.distanceTo(c1), worldV = c0.distanceTo(c3);
  const uvU = Math.hypot(uvs[1][0] - uvs[0][0], uvs[1][1] - uvs[0][1]);
  const uvV = Math.hypot(uvs[3][0] - uvs[0][0], uvs[3][1] - uvs[0][1]);
  const faceScale = [
    worldU > 1e-5 ? uvU / worldU : 1,
    worldV > 1e-5 ? uvV / worldV : 1,
  ];

  // World-space tangent/bitangent for this face from its UV axes. The vertex
  // shader uses them to turn the day-cycle light into a 2D texture-space
  // direction, so the bevel follows the sun without any per-fragment transform.
  const e1x = c1.x - c0.x, e1y = c1.y - c0.y, e1z = c1.z - c0.z;
  const e2x = c3.x - c0.x, e2y = c3.y - c0.y, e2z = c3.z - c0.z;
  const du1x = uvs[1][0] - uvs[0][0], du1y = uvs[1][1] - uvs[0][1];
  const du2x = uvs[3][0] - uvs[0][0], du2y = uvs[3][1] - uvs[0][1];
  const det = du1x * du2y - du1y * du2x;
  let tx = 1, ty = 0, tz = 0, bx = 0, by = 1, bz = 0;
  if (Math.abs(det) > 1e-8) {
    const inv = 1 / det;
    tx = (e1x * du2y - e2x * du1y) * inv;
    ty = (e1y * du2y - e2y * du1y) * inv;
    tz = (e1z * du2y - e2z * du1y) * inv;
    bx = (e2x * du1x - e1x * du2x) * inv;
    by = (e2y * du1x - e1y * du2x) * inv;
    bz = (e2z * du1x - e1z * du2x) * inv;
    const tl = Math.hypot(tx, ty, tz) || 1;
    const bl = Math.hypot(bx, by, bz) || 1;
    tx /= tl; ty /= tl; tz /= tl;
    bx /= bl; by /= bl; bz /= bl;
  }

  bucket.faces.push({
    corners: [
      [c0.x, c0.y, c0.z], [c1.x, c1.y, c1.z],
      [c2.x, c2.y, c2.z], [c3.x, c3.y, c3.z],
    ],
    normal: [n.x, n.y, n.z],
    uvs: [
      [uvs[0][0], uvs[0][1]], [uvs[1][0], uvs[1][1]],
      [uvs[2][0], uvs[2][1]], [uvs[3][0], uvs[3][1]],
    ],
    blockKey,
    faceScale,
    tangent: [tx, ty, tz],
    bitangent: [bx, by, bz],
    removed: false,
  });
}

const AXIS_X = new THREE.Vector3(1, 0, 0);
const AXIS_Y = new THREE.Vector3(0, 1, 0);
const AXIS_Z = new THREE.Vector3(0, 0, 1);

function isFullCubeElement(el) {
  return !el.rotation &&
    el.from[0] === 0 && el.from[1] === 0 && el.from[2] === 0 &&
    el.to[0] === 16 && el.to[1] === 16 && el.to[2] === 16 &&
    el.faces && el.faces.up && el.faces.down &&
    el.faces.north && el.faces.south && el.faces.east && el.faces.west;
}

function isFlatElement(el) {
  return el.from[0] === el.to[0] || el.from[1] === el.to[1] || el.from[2] === el.to[2];
}

/* ============================= BLOCK COLLISION SHAPES ============================= */

/* Blocks whose render model has no collision box in Minecraft. Using the model
 * boxes for these would create invisible walls (flowers, torches, rails). */
const NO_COLLISION_BLOCKS = new Set([
  'air', 'cave_air', 'void_air',
  'water', 'flowing_water', 'lava', 'flowing_lava', 'bubble_column',
  'fire', 'soul_fire', 'end_portal', 'end_gateway', 'nether_portal',
  'light', 'structure_void',
  'short_grass', 'grass', 'tall_grass', 'fern', 'large_fern', 'dead_bush',
  'seagrass', 'tall_seagrass', 'kelp', 'kelp_plant', 'sea_pickle',
  'sugar_cane', 'cobweb', 'tripwire', 'redstone_wire',
  'dandelion', 'poppy', 'blue_orchid', 'allium', 'azure_bluet',
  'red_tulip', 'orange_tulip', 'white_tulip', 'pink_tulip', 'oxeye_daisy',
  'cornflower', 'lily_of_the_valley', 'wither_rose', 'torchflower',
  'sunflower', 'lilac', 'rose_bush', 'peony', 'pitcher_plant',
  'closed_eyeblossom', 'open_eyeblossom',
  'brown_mushroom', 'red_mushroom', 'crimson_fungus', 'warped_fungus',
  'nether_sprouts', 'warped_roots', 'crimson_roots',
  'mangrove_propagule', 'sweet_berry_bush',
  'wheat', 'carrots', 'potatoes', 'beetroots', 'nether_wart',
  'melon_stem', 'pumpkin_stem', 'attached_melon_stem', 'attached_pumpkin_stem',
  'torchflower_crop', 'pitcher_crop',
  'vine', 'glow_lichen', 'sculk_vein', 'ladder', 'chain', 'powder_snow',
  'bamboo_sapling',
  'cave_vines', 'cave_vines_plant', 'weeping_vines', 'weeping_vines_plant',
  'twisting_vines', 'twisting_vines_plant', 'hanging_roots',
]);

/* The models of these have no elements but they still stop the player. */
const FORCE_SOLID_BLOCKS = new Set(['barrier']);

function isNonSolidBlock(id) {
  const clean = id.replace('minecraft:', '');
  if (NO_COLLISION_BLOCKS.has(clean)) return true;
  if (/(^|_)sapling$/.test(clean)) return true;
  if (/(^|_)(wall_)?torch$/.test(clean)) return true;
  if (/(^|_)wall_banner$|(^|_)banner$/.test(clean)) return true;
  if (/(^|_)rail$/.test(clean)) return true;
  if (/_coral_(wall_)?fan$/.test(clean)) return true;
  return false;
}

const _shapeQBlock = new THREE.Quaternion();
const _shapeQElement = new THREE.Quaternion();
const _shapeOrigin = new THREE.Vector3();
const _shapeHalf = new THREE.Vector3();
const _shapeOffset = new THREE.Vector3();
const _shapeV = new THREE.Vector3();
const _shapeBounds = { minX: 0, minY: 0, minZ: 0, maxX: 0, maxY: 0, maxZ: 0 };

function elementCollisionBox(el, qBlock, offset) {
  _shapeQElement.identity();
  let rotated = false;
  if (el.rotation) {
    const axis = el.rotation.axis;
    const angle = THREE.MathUtils.degToRad(el.rotation.angle || 0);
    _shapeQElement.setFromAxisAngle(axis === 'x' ? AXIS_X : axis === 'y' ? AXIS_Y : AXIS_Z, angle);
    _shapeOrigin.set(el.rotation.origin[0] / 16, el.rotation.origin[1] / 16, el.rotation.origin[2] / 16);
    rotated = true;
  }

  let minX = Infinity, minY = Infinity, minZ = Infinity;
  let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
  for (let xi = 0; xi < 2; xi++) {
    for (let yi = 0; yi < 2; yi++) {
      for (let zi = 0; zi < 2; zi++) {
        _shapeV.set(
          (xi ? el.to[0] : el.from[0]) / 16,
          (yi ? el.to[1] : el.from[1]) / 16,
          (zi ? el.to[2] : el.from[2]) / 16);
        if (rotated) _shapeV.sub(_shapeOrigin).applyQuaternion(_shapeQElement).add(_shapeOrigin);
        _shapeV.applyQuaternion(qBlock).add(offset);
        if (_shapeV.x < minX) minX = _shapeV.x;
        if (_shapeV.y < minY) minY = _shapeV.y;
        if (_shapeV.z < minZ) minZ = _shapeV.z;
        if (_shapeV.x > maxX) maxX = _shapeV.x;
        if (_shapeV.y > maxY) maxY = _shapeV.y;
        if (_shapeV.z > maxZ) maxZ = _shapeV.z;
      }
    }
  }
  return { minX, minY, minZ, maxX, maxY, maxZ };
}

/* Collision shape of one model application, in unit block space. Cached per
 * model object because every oak_stairs block shares the same element list. */
function getEntryCollisionShape(entry) {
  const data = entry.data;
  if (!data || !data.elements || data.elements.length === 0) return null;

  let perModel = collisionShapeCache.get(data);
  if (!perModel) { perModel = new Map(); collisionShapeCache.set(data, perModel); }
  const cacheKey = `${entry.x || 0},${entry.y || 0}`;
  if (perModel.has(cacheKey)) return perModel.get(cacheKey);

  _shapeQBlock.identity();
  if (entry.x || entry.y) {
    _shapeQBlock.setFromEuler(new THREE.Euler(
      THREE.MathUtils.degToRad(-(entry.x || 0)),
      THREE.MathUtils.degToRad(-(entry.y || 0)),
      0, 'YXZ'));
  }
  _shapeHalf.set(0.5, 0.5, 0.5).applyQuaternion(_shapeQBlock);
  _shapeOffset.set(1, 1, 1).sub(_shapeHalf);

  const boxes = [];
  let full = false;
  for (const el of data.elements) {
    if (!el.from || !el.to) continue;
    const box = elementCollisionBox(el, _shapeQBlock, _shapeOffset);
    if (box.maxX - box.minX < 1e-6 || box.maxY - box.minY < 1e-6 || box.maxZ - box.minZ < 1e-6) continue;
    if (box.minX <= 0.5 + 1e-5 && box.minY <= 0.5 + 1e-5 && box.minZ <= 0.5 + 1e-5 &&
        box.maxX >= 1.5 - 1e-5 && box.maxY >= 1.5 - 1e-5 && box.maxZ >= 1.5 - 1e-5) {
      full = true;
      break;
    }
    boxes.push(box);
  }
  const shape = { full, boxes };
  perModel.set(cacheKey, shape);
  return shape;
}

function getBlockCollisionShape(id, entries) {
  const clean = id.replace('minecraft:', '');
  const actual = blockCollisionShapes[clean];
  if (Array.isArray(actual) && blockProperties[clean]?.blockEntity) {
    if (!actual.length) return null;
    const full = actual.length === 1 &&
      actual[0][0] === 0 && actual[0][1] === 0 && actual[0][2] === 0 &&
      actual[0][3] === 1 && actual[0][4] === 1 && actual[0][5] === 1;
    return { full, boxes: full ? [] : actual };
  }
  if (FORCE_SOLID_BLOCKS.has(clean)) return { full: true, boxes: [] };
  if (isNonSolidBlock(clean)) return null;

  const boxes = [];
  for (const entry of entries) {
    const shape = getEntryCollisionShape(entry);
    if (!shape) continue;
    if (shape.full) return { full: true, boxes: [] };
    for (const box of shape.boxes) boxes.push(box);
  }
  return { full: false, boxes };
}

function normalizeCollisionBoxes(boxes) {
  return boxes.map(b => Array.isArray(b)
    ? { minX: b[0], minY: b[1], minZ: b[2], maxX: b[3], maxY: b[4], maxZ: b[5] }
    : b);
}

function registerBlockCollision(info) {
  const { id, pos, entries, stateKey } = info;
  if (!entries || entries.length === 0) return;
  const stateBoxes = stateKey ? blockCollisionStates[stateKey] : null;
  if (Array.isArray(stateBoxes)) {
    if (!stateBoxes.length) return;
    const key = `${pos.x},${pos.y},${pos.z}`;
    const normalized = normalizeCollisionBoxes(stateBoxes);
    const full = normalized.length === 1 &&
      normalized[0].minX === 0 && normalized[0].minY === 0 && normalized[0].minZ === 0 &&
      normalized[0].maxX === 1 && normalized[0].maxY === 1 && normalized[0].maxZ === 1;
    if (full) collisionSolids.add(key);
    else collisionPartials.set(key, normalized);
    return;
  }
  const shape = getBlockCollisionShape(id, entries);
  if (!shape) return;
  const key = `${pos.x},${pos.y},${pos.z}`;
  if (shape.full) collisionSolids.add(key);
  else if (shape.boxes.length) collisionPartials.set(key, normalizeCollisionBoxes(shape.boxes));
}

const UVLOCK_BASIS = {
  north: { u: [-1, 0, 0], v: [0, 1, 0], n: [0, 0, -1] },
  south: { u: [1, 0, 0], v: [0, 1, 0], n: [0, 0, 1] },
  east: { u: [0, 0, -1], v: [0, 1, 0], n: [1, 0, 0] },
  west: { u: [0, 0, 1], v: [0, 1, 0], n: [-1, 0, 0] },
  up: { u: [1, 0, 0], v: [0, 0, -1], n: [0, 1, 0] },
  down: { u: [1, 0, 0], v: [0, 0, 1], n: [0, -1, 0] },
};

function uvFaceFromNormal(n) {
  const ax = Math.abs(n.x), ay = Math.abs(n.y), az = Math.abs(n.z);
  if (ax >= ay && ax >= az) return n.x >= 0 ? 'east' : 'west';
  if (ay >= ax && ay >= az) return n.y >= 0 ? 'up' : 'down';
  return n.z >= 0 ? 'south' : 'north';
}

/* Vanilla FaceBakery uv-lock: map the face basis through the block rotation,
 * invert it about (0.5, 0.5), and express the result in the source face's
 * basis. This is not a single rotation angle for every face. */
function applyUvLock(quadUVs, faceName, q) {
  const source = UVLOCK_BASIS[faceName];
  if (!source) return quadUVs;
  // BlockMath.VANILLA_UV_TRANSFORM_LOCAL_TO_GLOBAL
  const localToGlobal = {
    south: new THREE.Quaternion(),
    east: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 2),
    west: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -Math.PI / 2),
    north: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI),
    up: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2),
    down: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2),
  }[faceName];
  if (!localToGlobal) return quadUVs;
  const faceAction = q.clone().multiply(localToGlobal);
  const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(faceAction);
  const targetName = uvFaceFromNormal(normal);
  const targetLocal = {
    south: new THREE.Quaternion(),
    east: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 2),
    west: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -Math.PI / 2),
    north: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI),
    up: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2),
    down: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2),
  }[targetName];
  if (!targetLocal) return quadUVs;
  // FaceBakery: uvTransform is the inverse face transformation.
  const inv = targetLocal.invert().multiply(faceAction).invert();
  return quadUVs.map(([u, v]) => {
    const p = new THREE.Vector3(u - 0.5, (1 - v) - 0.5, 0).applyQuaternion(inv);
    return [p.x + 0.5, 1 - (p.y + 0.5)];
  });
}

function collectElementFaces(el, modelTextures, blockId, q, offset, skipFaces, overrideMaterial, translucent, blockKey, uvLock = false, rotX = 0, rotY = 0, facing = null, bucketMap = materialBuckets) {
  const from = el.from;
  const to = el.to;
  const f = [from[0] / 16, from[1] / 16, from[2] / 16];
  const t = [to[0] / 16, to[1] / 16, to[2] / 16];

  const flat = isFlatElement(el);

  let elQuat = null, elOrigin = null;
  if (el.rotation) {
    elOrigin = new THREE.Vector3(el.rotation.origin[0] / 16, el.rotation.origin[1] / 16, el.rotation.origin[2] / 16);
    const axis = el.rotation.axis;
    const angle = THREE.MathUtils.degToRad(el.rotation.angle || 0);
    elQuat = new THREE.Quaternion().setFromAxisAngle(
      axis === 'x' ? AXIS_X : axis === 'y' ? AXIS_Y : AXIS_Z, angle);
  }

  for (const faceName of FACE_NAMES) {
    if (!el.faces || !el.faces[faceName]) continue;
    if (skipFaces && skipFaces.has(faceName)) continue;

    const face = el.faces[faceName];
    const texPath = resolveTexture(face.texture, modelTextures);
    const material = overrideMaterial || getBlockMaterial(texPath, face.tintindex, translucent, flat);
    if (!overrideMaterial && material.map === magentaTex) {
      const key = `${blockId}|${texPath}`;
      if (!missingTextureReported.has(key)) {
        missingTextureReported.add(key);
        showError(`Missing texture for ${blockId}: ${texPath}`);
      }
    }
    // Translucent and cutout materials must keep every face: adjacent leaves
    // and glass cells have coincident faces that must not be deduplicated.
    if ((translucent && !translucencyKeepsInternalFaces(blockId)) || isCutoutBlock(blockId)) material.userData.noFaceDedup = true;
    const bucket = getBucket(material, bucketMap);

    const rawUv = face.uv ? face.uv : getDefaultUV(faceName, from, to);
    const u1 = rawUv[0] / 16, v1 = 1 - rawUv[1] / 16, u2 = rawUv[2] / 16, v2 = 1 - rawUv[3] / 16;

    let quadUVs;
    if (faceName === 'up') quadUVs = [[u1, v2], [u2, v2], [u2, v1], [u1, v1]];
    else if (faceName === 'down') quadUVs = [[u1, v1], [u2, v1], [u2, v2], [u1, v2]];
    else quadUVs = [[u2, v2], [u2, v1], [u1, v1], [u1, v2]];

    const rot = (face.rotation || 0) % 360;
    for (let i = 0; i < rot / 90; i++) quadUVs.push(quadUVs.shift());

    // East-facing bottom stairs are the unrotated vanilla model and have no
    // uvlock variant. Their horizontal face is one quarter-turn off from the
    // viewer's default basis; all other stair variants use uvlock.
    if (rotX === 0 && (faceName === 'up' || faceName === 'down')
        && /_stairs$/.test(blockId) && (facing === 'east' || (!facing && rotY === 0))) {
      quadUVs = quadUVs.map(([u, v]) => [1 - v, u]);
    }

    // Blockstate uvlock keeps textures aligned to the world when the model is
    // rotated. Vanilla applies this per face, not as one global spin.
    if (uvLock && (rotX || rotY)) {
      if (faceName === 'up' || faceName === 'down') {
        // Minecraft's default top/bottom UV basis is rotated 90 degrees
        // relative to the side-face basis; keep the texture attached to the
        // stair but remove that quarter-turn offset.
        quadUVs = quadUVs.map(([u, v]) => [1 - v, u]);
      } else {
        quadUVs = applyUvLock(quadUVs, faceName, q);
      }
    }

    const def = FACE_DEFS[faceName];
    const c = def.corners(f, t);

    _qn.set(def.normal[0], def.normal[1], def.normal[2]);
    if (elQuat) _qn.applyQuaternion(elQuat);
    _qn.applyQuaternion(q);

    const quad = [_qc0, _qc1, _qc2, _qc3];
    for (let i = 0; i < 4; i++) {
      const v = quad[i];
      v.set(c[i][0], c[i][1], c[i][2]);
      if (elQuat) v.sub(elOrigin).applyQuaternion(elQuat).add(elOrigin);
      v.applyQuaternion(q).add(offset);
    }

    pushQuad(bucket, quad[0], quad[1], quad[2], quad[3], _qn, quadUVs, blockKey);
  }
}

function entriesAreOpaqueCube(entries) {
  if (!entries || entries.length === 0) return false;
  for (const entry of entries) {
    if (entry.x || entry.y) return false;
    const data = entry.data;
    if (!data || !data.elements || data.elements.length !== 1) return false;
    if (!isFullCubeElement(data.elements[0])) return false;
  }
  return true;
}

const BANNER_PATTERN_COLORS = {
  white: '#ffffff', orange: '#f9801d', magenta: '#c74ebd', light_blue: '#3ab3da',
  yellow: '#fed83d', lime: '#80c71f', pink: '#f38baa', gray: '#474f52',
  light_gray: '#9d9d97', cyan: '#169c9c', purple: '#8932b8', blue: '#3c44aa',
  brown: '#835432', green: '#5e7c16', red: '#b02e26', black: '#1d1d21',
};

function bannerPatternsFromNbt(nbt) {
  if (!nbt) return [];
  const out = [];
  for (const body of nbt.match(/\{([^{}]*)\}/g) || []) {
    const pattern = body.match(/pattern\s*:\s*"([^"]+)"/i)?.[1];
    const color = body.match(/color\s*:\s*"([^"]+)"/i)?.[1];
    if (pattern) out.push({ pattern: pattern.toLowerCase(), color: (color || 'white').toLowerCase() });
  }
  return out;
}

function potPatternsFromNbt(nbt) {
  if (!nbt) return [];
  const list = nbt.match(/sherds\s*:\s*\[([^\]]*)\]/i)?.[1] || '';
  return [...list.matchAll(/"([^"]+)"/g)].map(m => m[1].replace('minecraft:', '').replace('_pottery_sherd', ''));
}

function collectBlockEntityGeometry(info) {
  const { id, pos, properties } = info;
  const model = blockEntityModels[id.replace('minecraft:', '')];
  if (!model) return false;
  if (id === 'lectern' && properties?.has_book !== 'true') return false;
  if (id === 'beacon') {
    const levels = info.nbt?.match(/levels\s*:\s*(\d+)/i)?.[1];
    if (!levels || Number(levels) <= 0) return false;
  }
  const yawByFacing = { north: Math.PI, east: -Math.PI / 2, south: 0, west: Math.PI / 2 };
  let yaw = yawByFacing[properties?.facing] || 0;
  if (properties?.rotation !== undefined) yaw += (Number(properties.rotation) / 16) * Math.PI * 2;
  const cos = Math.cos(yaw), sin = Math.sin(yaw);
  for (const quad of model.quads || []) {
    let material = getBlockMaterial(quad.texture || model.texture, undefined, model.translucent === true, false);
    if (model.tint) {
      material = material.clone();
      material.color.set(model.tint);
    }
    material.side = THREE.DoubleSide;
    const bucket = getBucket(material);
    const corners = quad.positions.map(([x, y, z]) => {
      let rx = x / 16 - 0.5, rz = z / 16 - 0.5;
      const tx = rx * cos - rz * sin;
      const tz = rx * sin + rz * cos;
      return new THREE.Vector3(pos.x + 0.5 + tx, pos.y + 0.5 + y / 16, pos.z + 0.5 + tz);
    });
    let n = quad.normal || [0, 1, 0];
    const nx = n[0] * cos - n[2] * sin;
    const nz = n[0] * sin + n[2] * cos;
    const uvs = (quad.uvs || []).map(([u, v]) => [u, model.flipV === false ? v : 1 - v]);
    pushQuad(bucket, corners[0], corners[1], corners[2], corners[3], new THREE.Vector3(nx, n[1], nz), uvs, `${pos.x},${pos.y},${pos.z}`);
  }

  const patterns = id.includes('banner') ? bannerPatternsFromNbt(info.nbt) : [];
  if (patterns.length && model.quads) {
    const flagQuads = model.quads.filter(q => {
      const ys = q.positions.map(p => p[1]);
      return Math.abs(q.normal?.[2] || 0) > 0.9 && Math.max(...ys) - Math.min(...ys) > 12;
    });
    patterns.forEach((entry, layer) => {
      let material = getBlockMaterial(`entity/banner/${entry.pattern}`, undefined, false, false);
      material = material.clone();
      material.color.set(BANNER_PATTERN_COLORS[entry.color] || '#ffffff');
      material.side = THREE.DoubleSide;
      const bucket = getBucket(material);
      for (const quad of flagQuads) {
        const zOffset = (quad.normal[2] > 0 ? 1 : -1) * 0.08 * (layer + 1);
        const corners = quad.positions.map(([x, y, z]) => {
          let rx = x / 16 - 0.5, rz = (z + zOffset) / 16 - 0.5;
          const tx = rx * cos - rz * sin;
          const tz = rx * sin + rz * cos;
          return new THREE.Vector3(pos.x + 0.5 + tx, pos.y + 0.5 + y / 16, pos.z + 0.5 + tz);
        });
        const n = quad.normal;
        const nx = n[0] * cos - n[2] * sin;
        const nz = n[0] * sin + n[2] * cos;
        const uvs = [[0, 0], [1, 0], [1, 1], [0, 1]];
        pushQuad(bucket, corners[0], corners[1], corners[2], corners[3], new THREE.Vector3(nx, n[1], nz), uvs, `${pos.x},${pos.y},${pos.z}`);
      }
    });
  }
  const potSherds = id === 'decorated_pot' ? potPatternsFromNbt(info.nbt) : [];
  if (potSherds.length && model.quads) {
    const sideQuads = model.quads.slice(0, 4);
    potSherds.slice(0, 4).forEach((pattern, side) => {
      if (!pattern || pattern === 'brick') return;
      const tex = `entity/decorated_pot/${pattern}_pottery_pattern`;
      const material = getBlockMaterial(tex, undefined, false, false);
      material.side = THREE.DoubleSide;
      const bucket = getBucket(material);
      const quad = sideQuads[side];
      if (!quad) return;
      const n = quad.normal;
      const corners = quad.positions.map(([x, y, z]) => {
        let rx = x / 16 - 0.5, rz = (z + n[2] * 0.05) / 16 - 0.5;
        const tx = rx * cos - rz * sin;
        const tz = rx * sin + rz * cos;
        return new THREE.Vector3(pos.x + 0.5 + tx, pos.y + 0.5 + y / 16, pos.z + 0.5 + tz);
      });
      const nx = n[0] * cos - n[2] * sin;
      const nz = n[0] * sin + n[2] * cos;
      pushQuad(bucket, corners[0], corners[1], corners[2], corners[3],
        new THREE.Vector3(nx, n[1], nz), [[0, 0], [1, 0], [1, 1], [0, 1]], `${pos.x},${pos.y},${pos.z}`);
    });
  }
  return true;
}

async function collectBlockFaces(info, opaquePositions, fluidPositions = new Set()) {
  const { id, pos, entries, properties } = info;
  if (!entries || entries.length === 0) return;

  registerBlockCollision(info);

  const blockKey = `${pos.x},${pos.y},${pos.z}`;
  const beModel = blockEntityModels[id.replace('minecraft:', '')];
  if (beModel && !beModel.extra && collectBlockEntityGeometry(info)) {
    collisionSolids.add(blockKey);
    return;
  }

  const shaderConfig = await getShaderConfigForBlock(id);
  let overrideMaterial = null;
  if (shaderConfig) overrideMaterial = await createMCShaderMaterial(shaderConfig);

  const translucent = isTranslucentBlock(id);
  const fluid = isFluidBlock(id);
  const cutout = isCutoutBlock(id);
  // Leaves are a cutout material: even against opaque neighbours, keep every
  // leaf face so connected canopies stay full instead of growing holes.
  const selfOpaque = !shaderConfig && !cutout && entriesAreOpaqueCube(entries);

  for (const entry of entries) {
    const data = entry.data;
    if (!data || !data.elements) continue;

    const rotX = entry.x || 0, rotY = entry.y || 0;
    const q = new THREE.Quaternion();
    if (rotX || rotY) {
      q.setFromEuler(new THREE.Euler(
        THREE.MathUtils.degToRad(-rotX),
        THREE.MathUtils.degToRad(-rotY),
        0, 'YXZ'));
    }
    const half = new THREE.Vector3(0.5, 0.5, 0.5).applyQuaternion(q);
    const offset = new THREE.Vector3(pos.x + 1, pos.y + 1, pos.z + 1).sub(half);

    for (const el of data.elements) {
      let skipFaces = null;
      if (isFullCubeElement(el)) {
        // Opaque cubes hide faces against other opaque cubes; fluid cubes hide
        // faces between adjacent fluid cells so pools don't double-blend.
        for (const fn of FACE_NAMES) {
          const d = FACE_DIRS[fn];
          const nk = `${pos.x + d[0]},${pos.y + d[1]},${pos.z + d[2]}`;
          if ((selfOpaque && opaquePositions.has(nk)) || (fluid && fluidPositions.has(nk))) {
            (skipFaces || (skipFaces = new Set())).add(fn);
          }
        }
      }
      collectElementFaces(el, data.textures || {}, id, q, offset, skipFaces, overrideMaterial, translucent, blockKey, entry.uvlock, rotX, rotY, properties?.facing);
    }
  }
  if (beModel?.extra) collectBlockEntityGeometry(info);
}

/* ============================= COINCIDENT FACE DEDUPLICATION ============================= */

const _R = (n) => Math.round(n * 4096) / 4096;

function faceCanonicalKey(face, materialId) {
  const corners = [
    [ _R(face.corners[0][0]), _R(face.corners[0][1]), _R(face.corners[0][2]) ],
    [ _R(face.corners[1][0]), _R(face.corners[1][1]), _R(face.corners[1][2]) ],
    [ _R(face.corners[2][0]), _R(face.corners[2][1]), _R(face.corners[2][2]) ],
    [ _R(face.corners[3][0]), _R(face.corners[3][1]), _R(face.corners[3][2]) ],
  ];
  corners.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);

  const uvs = [
    [ _R(face.uvs[0][0]), _R(face.uvs[0][1]) ],
    [ _R(face.uvs[1][0]), _R(face.uvs[1][1]) ],
    [ _R(face.uvs[2][0]), _R(face.uvs[2][1]) ],
    [ _R(face.uvs[3][0]), _R(face.uvs[3][1]) ],
  ];
  uvs.sort((a, b) => a[0] - b[0] || a[1] - b[1]);

  return materialId + '|' +
    corners.map(c => c.join(',')).join(';') + '|' +
    uvs.map(u => u.join(',')).join(';');
}

function dedupeCoincidentFaces() {
  if (!CONFIG.render.dedupeCoincidentFaces) return 0;
  const groups = new Map();
  for (const bucket of materialBuckets.values()) {
    if (bucket.material.userData.noFaceDedup) continue;
    const matId = bucket.material.uuid;
    for (const face of bucket.faces) {
      if (face.removed) continue;
      const key = faceCanonicalKey(face, matId);
      let arr = groups.get(key);
      if (!arr) { arr = []; groups.set(key, arr); }
      arr.push(face);
    }
  }
  let removed = 0;
  for (const arr of groups.values()) {
    if (arr.length < 2) continue;

    const blockKeys = new Set();
    for (const f of arr) blockKeys.add(f.blockKey);

    if (blockKeys.size >= 2) {
      for (const f of arr) {
        if (!f.removed) { f.removed = true; removed++; }
      }
    } else {
      let kept = false;
      for (const f of arr) {
        if (!kept) { kept = true; continue; }
        if (!f.removed) { f.removed = true; removed++; }
      }
    }
  }
  return removed;
}

/* ============================= FLUSH ============================= */

function flushBuckets() {
  const culled = dedupeCoincidentFaces();
  if (culled > 0) console.log(`Deduplicated ${culled} coincident faces`);

  let meshCount = 0, totalFaces = 0;
  for (const bucket of materialBuckets.values()) {
    const positions = [], normals = [], uvs = [], faceScales = [], tangents = [], bitangents = [], indices = [];
    let vCount = 0;
    for (const face of bucket.faces) {
      if (face.removed) continue;
      const c = face.corners, u = face.uvs, n = face.normal;
      for (let i = 0; i < 4; i++) {
        positions.push(c[i][0], c[i][1], c[i][2]);
        normals.push(n[0], n[1], n[2]);
        uvs.push(u[i][0], u[i][1]);
        faceScales.push(face.faceScale[0], face.faceScale[1]);
        tangents.push(face.tangent[0], face.tangent[1], face.tangent[2]);
        bitangents.push(face.bitangent[0], face.bitangent[1], face.bitangent[2]);
      }
      indices.push(vCount, vCount + 1, vCount + 2, vCount, vCount + 2, vCount + 3);
      vCount += 4;
      totalFaces++;
    }
    if (vCount === 0) continue;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.setAttribute('faceScale', new THREE.Float32BufferAttribute(faceScales, 2));
    g.setAttribute('faceTangent', new THREE.Float32BufferAttribute(tangents, 3));
    g.setAttribute('faceBitangent', new THREE.Float32BufferAttribute(bitangents, 3));
    g.setIndex(indices);
    g.computeBoundingSphere();
    const mesh = new THREE.Mesh(g, bucket.material);
    worldGroup.add(mesh);
    meshCount++;
  }
  materialBuckets.clear();
  console.log(`Flushed ${meshCount} merged meshes (${totalFaces} faces)`);
}

function clearWorld() {
  for (const c of [...worldGroup.children]) {
    worldGroup.remove(c);
    if (c.geometry) c.geometry.dispose();
  }
  materialBuckets.clear();
  missingTextureReported.clear();
  collisionSolids.clear();
  collisionPartials.clear();
  physicsBlocks.clear();
  physicsStates.clear();
  worldBounds = null;
}

/* ============================= MODEL SELECTION ============================= */

const FLUID_BLOCKS = new Set(['water', 'flowing_water', 'lava', 'flowing_lava']);
function isFluidBlock(id) {
  return FLUID_BLOCKS.has(id.replace('minecraft:', ''));
}

function createFluidModel(id) {
  const fluid = id.includes('lava') ? 'lava' : 'water';
  const faces = {};
  for (const faceName of FACE_NAMES) {
    faces[faceName] = {
      uv: [0, 0, 16, 16],
      texture: '#all',
    };
    if (fluid === 'water') faces[faceName].tintindex = 2;
  }
  return {
    textures: { all: `block/${fluid}_still` },
    elements: [{ from: [0, 0, 0], to: [16, 16, 16], faces }],
  };
}

function createBlockEntityFallbackModel(data) {
  const texture = data.textures?.particle || data.textures?.all || 'block/stone';
  const faces = {};
  for (const faceName of FACE_NAMES) faces[faceName] = { uv: [0, 0, 16, 16], texture: '#particle' };
  return {
    ...data,
    textures: { ...(data.textures || {}), particle: texture },
    elements: [{ from: [0, 0, 0], to: [16, 16, 16], faces }],
  };
}

function movingPistonMovedState(nbt) {
  const raw = nbt?.match(/blockstate\s*:\s*"([^"]+)"/i)?.[1];
  if (!raw) return null;
  let spec = raw.replace('minecraft:', '');
  let id = spec, props = {};
  const bracket = spec.indexOf('[');
  if (bracket !== -1) {
    id = spec.substring(0, bracket);
    const body = spec.substring(bracket + 1, spec.length - 1);
    for (const pair of body.split(',')) {
      const [k, v] = pair.split('=');
      if (k && v) props[k.trim()] = v.trim();
    }
  }
  return [id.toLowerCase(), props];
}

async function getBlockModels(blockId, properties, pos, nbt = null) {
  if (blockId === 'moving_piston') {
    const moved = movingPistonMovedState(nbt);
    if (moved) return getBlockModels(moved[0], moved[1], pos);
    return getBlockModels('piston_head', {
      facing: properties?.facing || 'north',
      type: properties?.type || 'normal',
    }, pos);
  }
  const stateData = await loadBlockstate(blockId);
  const defaults = getDefaultProperties(stateData, blockId.replace('minecraft:', ''));
  const filledProps = { ...defaults, ...properties };
  const modelApps = [];

  if (stateData.variants) {
    let best = null, bestScore = -1;
    for (const vk of Object.keys(stateData.variants)) {
      const vProps = {};
      for (const pair of vk.split(',')) { if (!pair) continue; const [k, v] = pair.split('='); if (k) vProps[k.trim()] = v.trim(); }
      let ok = true;
      for (const k in vProps) if (String(filledProps[k]) !== vProps[k]) { ok = false; break; }
      if (ok) { const score = Object.keys(vProps).length; if (score > bestScore) { bestScore = score; best = stateData.variants[vk]; } }
    }
    if (!best) {
      // Never silently choose the first variant: for stairs that can be an
      // inner-left corner. Prefer a straight/default variant instead.
      const entries = Object.entries(stateData.variants);
      const straight = entries.find(([k]) => !k.includes('shape=') || k.includes('shape=straight'));
      best = (straight || entries[0])?.[1];
    }
    if (best) {
      let chosen;
      if (Array.isArray(best)) {
        if (best.length === 1) chosen = best[0];
        else if (pos) { const hash = (((pos.x * 73856093) ^ (pos.y * 19349663) ^ (pos.z * 83492791)) >>> 0); chosen = best[hash % best.length]; }
        else chosen = best[0];
      } else chosen = best;
      modelApps.push({ model: chosen.model, x: chosen.x || 0, y: chosen.y || 0, uvlock: !!chosen.uvlock });
    }
  } else if (stateData.multipart) {
    for (const part of stateData.multipart) {
      let match = true;
      if (part.when) match = matchesCondition(part.when, filledProps);
      if (match && part.apply) {
        const apps = Array.isArray(part.apply) ? part.apply : [part.apply];
        for (const app of apps) modelApps.push({ model: app.model, x: app.x || 0, y: app.y || 0, uvlock: !!app.uvlock });
      }
    }
  }

  const result = [];
  for (const app of modelApps) {
    let data = await loadModel(app.model);
    if (data && isFluidBlock(blockId) && (!data.elements || data.elements.length === 0)) {
      data = { ...data, ...createFluidModel(blockId) };
    }
    const cleanId = blockId.replace('minecraft:', '');
    const props = blockProperties[cleanId];
    if (data && props?.blockEntity && !blockEntityModels[cleanId] && (!data.elements || data.elements.length === 0)) {
      data = createBlockEntityFallbackModel(data);
    }
    if (data) result.push({ data, x: app.x, y: app.y, uvlock: !!app.uvlock });
  }
  return result;
}

function matchesCondition(cond, props) {
  if (!cond || typeof cond !== 'object') return true;
  if (Array.isArray(cond.AND)) return cond.AND.every(c => matchesCondition(c, props));
  if (Array.isArray(cond.OR)) return cond.OR.some(c => matchesCondition(c, props));
  if (cond.NOT) return !matchesCondition(cond.NOT, props);
  for (const k in cond) {
    if (k === 'AND' || k === 'OR' || k === 'NOT') continue;
    const val = cond[k];
    if (typeof val === 'string') { if (String(props[k]) !== val) return false; }
    else if (Array.isArray(val)) { if (!val.includes(String(props[k]))) return false; }
  }
  return true;
}

/* ============================= COMMANDS ============================= */

function loadCommandsFromStorage() {
  const saved = localStorage.getItem('voxelBuilderCommandsJava');
  document.getElementById('commands').value = saved || "/setblock 0 0 0 end_portal\n/setblock 1 0 0 stone\n/fill 2 0 0 4 2 2 stone";
}
function saveCommandsToStorage() {
  localStorage.setItem('voxelBuilderCommandsJava', document.getElementById('commands').value);
}
function parseBlockSpec(spec) {
  let id = spec, props = {}, nbt = null;
  const brace = spec.indexOf('{');
  if (brace !== -1) { nbt = spec.substring(brace); spec = spec.substring(0, brace); }
  const bracket = spec.indexOf('[');
  if (bracket !== -1) {
    id = spec.substring(0, bracket);
    const propStr = spec.substring(bracket + 1, spec.length - 1);
    for (const pair of propStr.split(',')) { const [k, v] = pair.split('='); if (k && v) props[k.trim()] = v.trim(); }
  } else {
    id = spec;
  }
  return [id, props, nbt];
}

function growWorldBounds(x, y, z) {
  const b = worldBounds;
  if (!b) return;
  if (x < b.minX) b.minX = x;
  if (y < b.minY) b.minY = y;
  if (z < b.minZ) b.minZ = z;
  if (x > b.maxX) b.maxX = x;
  if (y > b.maxY) b.maxY = y;
  if (z > b.maxZ) b.maxZ = z;
}

async function build() {
  window.__viewerReady = false;
  clearWorld();
  errorOverlay.textContent = ''; errorOverlay.style.display = 'none';
  await loadColormaps();
  tintColorCache.clear();
  await loadBlockProperties();

  const placementMap = new Map();
  worldBounds = { minX: Infinity, minY: Infinity, minZ: Infinity, maxX: -Infinity, maxY: -Infinity, maxZ: -Infinity };
  for (const rawLine of document.getElementById('commands').value.split('\n')) {
    const line = rawLine.trim(); if (!line) continue;
    const parts = line.match(/\S+/g) || []; if (parts.length === 0) continue;
    const cmd = parts[0].toLowerCase();
    if (cmd === '/setblock' && parts.length >= 5) {
      const bx = parseFloat(parts[1]), by = parseFloat(parts[2]), bz = parseFloat(parts[3]);
      growWorldBounds(bx, by, bz);
      placementMap.set(`${bx},${by},${bz}`, parts[4].toLowerCase().replace('minecraft:', ''));
    } else if (cmd === '/fill' && parts.length >= 8) {
      const x1 = Math.min(parseFloat(parts[1]), parseFloat(parts[4]));
      const x2 = Math.max(parseFloat(parts[1]), parseFloat(parts[4]));
      const y1 = Math.min(parseFloat(parts[2]), parseFloat(parts[5]));
      const y2 = Math.max(parseFloat(parts[2]), parseFloat(parts[5]));
      const z1 = Math.min(parseFloat(parts[3]), parseFloat(parts[6]));
      const z2 = Math.max(parseFloat(parts[3]), parseFloat(parts[6]));
      const spec = parts[7].toLowerCase().replace('minecraft:', '');
      growWorldBounds(x1, y1, z1); growWorldBounds(x2, y2, z2);
      for (let x = x1; x <= x2; x++) for (let y = y1; y <= y2; y++) for (let z = z1; z <= z2; z++) {
        placementMap.set(`${x},${y},${z}`, spec);
      }
    }
  }
  if (!placementMap.size) worldBounds = null;

  const concurrency = Math.max(1, CONFIG.render.concurrency || 12);
  const entries = Array.from(placementMap.entries());
  const t0 = performance.now();

  /* ---- pass 1: resolve models in parallel ---- */
  const blockInfo = new Map();
  const opaquePositions = new Set();
  const fluidPositions = new Set();

  const { errors: resolveErrors } = await mapWithConcurrency(entries, concurrency, async ([key, spec]) => {
    const [id, props, nbt] = parseBlockSpec(spec);
    const [xStr, yStr, zStr] = key.split(',');
    const pos = { x: parseInt(xStr, 10), y: parseInt(yStr, 10), z: parseInt(zStr, 10) };
    const modelEntries = await getBlockModels(id, props, pos, nbt);
    const stateKey = await blockStateKey(id, props);
    blockInfo.set(key, { id, pos, entries: modelEntries, properties: props, nbt, stateKey });
    physicsBlocks.set(key, id);
    physicsStates.set(key, props);
    if (isFluidBlock(id)) fluidPositions.add(key);
    if (!SHADER_BLOCK_IDS.has(id) && !isTranslucentBlock(id) && !isCutoutBlock(id) && entriesAreOpaqueCube(modelEntries)) {
      opaquePositions.add(key);
    }
  });
  const t1 = performance.now();
  for (const e of resolveErrors) showError(`Failed to resolve: ${e.error.message}`);
  console.log(`Pass 1 (resolve): ${blockInfo.size}/${entries.length} blocks in ${(t1 - t0).toFixed(0)} ms`);

  /* ---- pass 2: emit geometry in parallel ---- */
  const infos = Array.from(blockInfo.values());
  const { errors: emitErrors } = await mapWithConcurrency(infos, concurrency, async (info) => {
    await collectBlockFaces(info, opaquePositions, fluidPositions);
  });
  const t2 = performance.now();
  for (const e of emitErrors) showError(`Failed to place ${e.item.id}: ${e.error.message}`);
  console.log(`Pass 2 (emit): ${infos.length} blocks in ${(t2 - t1).toFixed(0)} ms`);

  flushBuckets();
  reflectionDirty = true;
  updatePlayerSpawnFromWorld();
  unstuckPlayer();
  const t3 = performance.now();
  console.log(`Build complete: ${placementMap.size} blocks in ${(t3 - t0).toFixed(0)} ms total`);
  window.__viewerReady = true;
}

/*
 * Tick-accurate recreation of Java Edition creative movement:
 *  - walk accel 0.098, sprint x1.3, sneak x0.3, ground drag 0.546
 *  - air accel 0.02 / sprint 0.026, air drag 0.91
 *  - jump 0.42, gravity 0.08, vertical drag 0.98 (terminal -3.92)
 *  - flight accel 0.05 (x2 sprinting), drag 0.91, vertical impulse 0.15 with 0.6 drag
 *  - double-tap jump toggles flight, landing while flying disables it
 *  - 0.6 step height, 0.6x1.8 hitbox (1.5 sneaking), 1.62 eye (1.27 sneaking)
 * All simulation runs at 20 ticks/second with render interpolation.
 */

const TICK_SECONDS = 0.05;
const PLAYER_HALF_WIDTH = 0.3;
const PLAYER_HEIGHT = 1.8;
const PLAYER_SNEAK_HEIGHT = 1.5;

const EYE_HEIGHT_SNEAK = 1.27;

const AIR_DRAG = 0.91;
const GROUND_DRAG = 0.6 * 0.91;
const GROUND_ACCEL_FACTOR = 0.16277136 / (GROUND_DRAG * GROUND_DRAG * GROUND_DRAG);
const WALK_ACCEL = 0.1;
const SPRINT_ACCEL_MULT = 1.3;
const SNEAK_ACCEL_MULT = 0.3;
const FLY_ACCEL = 0.05;
const FLY_VERTICAL_ACCEL = FLY_ACCEL * 3;
const FLY_VERTICAL_DRAG = 0.6;
const JUMP_VELOCITY = 0.42;
const SPRINT_JUMP_BOOST = 0.2;
const JUMP_COOLDOWN_TICKS = 10;
const DOUBLE_TAP_TICKS = 7;
const EYE_SMOOTH_RATE = 18;
const COLLISION_EPS = 1e-7;
const PLAYER_MODE_KEY = 'voxelBuilderViewMode';
const FOV_STORAGE_KEY = 'voxelBuilderFov';
const IS_MAC = /Mac|iPhone|iPad|iPod/.test(navigator.platform);
const IS_TOUCH = new URLSearchParams(location.search).has('touch') ||
  matchMedia('(pointer: coarse)').matches ||
  /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
document.body.classList.toggle('touch', IS_TOUCH);

  yaw: Math.PI / 4,
  pitch: -Math.PI / 6,

};

const playerInput = {
  forward: false, back: false, left: false, right: false,
  jump: false, sneak: false, sprint: false,
  forwardEdge: false, jumpEdge: false,
};
let mobileSprintToggle = false;

let keyboardLockActive = false;

const _camPos = new THREE.Vector3();
const _lookDir = new THREE.Vector3();

/* ---------------------------- collision queries ---------------------------- */

function playerCollidesAt(x, y, z, height = player.height) {
  const minX = x - PLAYER_HALF_WIDTH, maxX = x + PLAYER_HALF_WIDTH;
  const minY = y, maxY = y + height;
  const minZ = z - PLAYER_HALF_WIDTH, maxZ = z + PLAYER_HALF_WIDTH;
  // Geometry places a block at integer p in the cell [p+0.5, p+1.5].
  const x0 = Math.floor(minX - 0.5), x1 = Math.floor(maxX - 0.5 - COLLISION_EPS);
  const y0 = Math.floor(minY - 0.5), y1 = Math.floor(maxY - 0.5 - COLLISION_EPS);
  const z0 = Math.floor(minZ - 0.5), z1 = Math.floor(maxZ - 0.5 - COLLISION_EPS);

  for (let bx = x0; bx <= x1; bx++) {
    for (let by = y0 - 1; by <= y1; by++) {
      for (let bz = z0; bz <= z1; bz++) {
        const key = bx + ',' + by + ',' + bz;
        if (collisionSolids.has(key)) {
          if (maxX > bx + 0.5 + COLLISION_EPS && minX < bx + 1.5 - COLLISION_EPS &&
              maxY > by + 0.5 + COLLISION_EPS && minY < by + 1.5 - COLLISION_EPS &&
              maxZ > bz + 0.5 + COLLISION_EPS && minZ < bz + 1.5 - COLLISION_EPS) {
            return true;
          }
          continue;
        }
        const boxes = collisionPartials.get(key);
        if (!boxes) continue;
        for (const b of boxes) {
          const bminX = Array.isArray(b) ? b[0] : b.minX;
          const bminY = Array.isArray(b) ? b[1] : b.minY;
          const bminZ = Array.isArray(b) ? b[2] : b.minZ;
          const bmaxX = Array.isArray(b) ? b[3] : b.maxX;
          const bmaxY = Array.isArray(b) ? b[4] : b.maxY;
          const bmaxZ = Array.isArray(b) ? b[5] : b.maxZ;
          if (maxX > bx + 0.5 + bminX + COLLISION_EPS && minX < bx + 0.5 + bmaxX - COLLISION_EPS &&
              maxY > by + 0.5 + bminY + COLLISION_EPS && minY < by + 0.5 + bmaxY - COLLISION_EPS &&
              maxZ > bz + 0.5 + bminZ + COLLISION_EPS && minZ < bz + 0.5 + bmaxZ - COLLISION_EPS) {
            return true;
          }
        }
      }
    }
  }
  return false;
}

function playerHasSupport(x, y, z) {
  return playerCollidesAt(x, y - 0.02, z);
}

/* Move along one axis in <=0.2 block sweeps so terminal velocity cannot tunnel
 * through a floor, then bisect the last step to rest exactly on the surface. */
function sweepPlayerAxis(axis, delta) {
  if (!delta) return false;
  const steps = Math.max(1, Math.ceil(Math.abs(delta) / 0.2));
  const step = delta / steps;
  for (let i = 0; i < steps; i++) {
    const before = player.pos[axis];
    player.pos[axis] = before + step;
    if (!playerCollidesAt(player.pos.x, player.pos.y, player.pos.z)) continue;
    let lo = 0, hi = step;
    for (let j = 0; j < 12; j++) {
      const mid = (lo + hi) * 0.5;
      player.pos[axis] = before + mid;
      if (playerCollidesAt(player.pos.x, player.pos.y, player.pos.z)) hi = mid;
      else lo = mid;
    }
    player.pos[axis] = before + lo;
    return true;
  }
  return false;
}

function tryStepUp(axis, delta, startAxis, startY) {
  // The full lift can clip a door frame, eave or wall block above the step
  // even when a lower step is clear. Try progressively lower lifts instead of
  // giving up after the single highest probe.
  for (let lift = STEP_HEIGHT; lift >= 0.05; lift -= 0.05) {
    player.pos[axis] = startAxis;
    player.pos.y = startY + lift;
    if (playerCollidesAt(player.pos.x, player.pos.y, player.pos.z)) continue;
    if (!sweepPlayerAxis(axis, delta)) {
      const landed = sweepPlayerAxis('y', -lift);
      if (landed && player.pos.y >= startY + 0.01) {
        player.collidedHorizontally = false;
        player.onGround = true;
        return true;
      }
    }
    player.pos[axis] = startAxis;
    player.pos.y = startY;
  }
  return false;
}

function movePlayerHorizontal(axis) {
  const delta = player.vel[axis];
  if (!delta) return;

  const startAxis = player.pos[axis];
  const startY = player.pos.y;
  const hit = sweepPlayerAxis(axis, delta);
  if (!hit) {
    // Sneaking backs off ledges instead of walking off them.
    if (player.sneaking && !player.flying && player.onGround &&
        !playerHasSupport(player.pos.x, player.pos.y, player.pos.z)) {
      player.pos[axis] = startAxis;
      player.vel[axis] = 0;
    }
    return;
  }

  player.collidedHorizontally = true;

  // Auto-step (up to 0.6) onto slabs, stairs, etc. Only while walking on the
  // ground; lower lifts are tried when a door frame or eave above the step
  // catches the full lift.
  if (!player.flying && player.onGround) {
    player.pos[axis] = startAxis;
    player.pos.y = startY;
    if (tryStepUp(axis, delta, startAxis, startY)) return;
  }

  player.vel[axis] = 0;
}

function movePlayer() {
  player.yCollided = false;

  if (player.vel.y !== 0) {
    if (sweepPlayerAxis('y', player.vel.y)) {
      player.yCollided = true;
      player.vel.y = 0;
      player.onGround = playerHasSupport(player.pos.x, player.pos.y, player.pos.z);
    } else {
      player.onGround = false;
    }
  } else {
    player.onGround = playerHasSupport(player.pos.x, player.pos.y, player.pos.z);
  }

  movePlayerHorizontal('x');
  movePlayerHorizontal('z');

  if (!player.onGround) {
    player.onGround = playerHasSupport(player.pos.x, player.pos.y, player.pos.z);
  }
}

/* ------------------------------- spawning ------------------------------- */

function findNearestFreePosition(x, y, z, height, requireSupport = false) {
  const maxRadius = 16;
  const step = 0.5;
  const isFree = (px, py, pz) =>
    !playerCollidesAt(px, py, pz, height) &&
    (!requireSupport || playerCollidesAt(px, py - 0.02, pz, height));

  if (isFree(x, y, z)) return new THREE.Vector3(x, y, z);

  let best = null;
  let bestDist = Infinity;
  for (let dy = -maxRadius; dy <= maxRadius; dy += step) {
    for (let dx = -maxRadius; dx <= maxRadius; dx += step) {
      for (let dz = -maxRadius; dz <= maxRadius; dz += step) {
        const dist = dx * dx + dy * dy + dz * dz;
        if (dist >= bestDist) continue;
        const px = x + dx, py = y + dy, pz = z + dz;
        if (!isFree(px, py, pz)) continue;
        bestDist = dist;
        best = new THREE.Vector3(px, py, pz);
      }
    }
  }
  return best;
}

function computeSpawnPoint() {
  if (!worldBounds || !isFinite(worldBounds.minX)) {
    return new THREE.Vector3(0.5, 4.0, 0.5);
  }
  const b = worldBounds;
  const cx = (b.minX + b.maxX) * 0.5 + 1;
  const cz = (b.minZ + b.maxZ) * 0.5 + 1;
  const flying = CONFIG.player?.startFlying !== false;
  // Flying spawns above the build; grounded spawns stand on the top surface.
  const candidate = new THREE.Vector3(cx, flying ? b.maxY + 2.5 : b.maxY + 1.5, cz);
  const safe = findNearestFreePosition(candidate.x, candidate.y, candidate.z, PLAYER_HEIGHT, !flying);
  return safe || candidate;
}

function updatePlayerSpawnFromWorld() {
  player.spawn.copy(computeSpawnPoint());
}

function respawnPlayer() {
  player.pos.copy(player.spawn);
  player.prevPos.copy(player.spawn);
  player.vel.set(0, 0, 0);
  player.onGround = false;
  player.collidedHorizontally = false;
  player.sprinting = false;
  player.sneaking = false;
  player.height = PLAYER_HEIGHT;
  player.eyeHeight = EYE_HEIGHT;
  player.flying = CONFIG.player?.startFlying !== false;
  player.jumpCooldown = 0;
  player.flyToggleTimer = 0;
  player.sprintToggleTimer = 0;
  clearPlayerInput();
  updateHud();
}

function unstuckPlayer() {
  const safe = findNearestFreePosition(player.pos.x, player.pos.y, player.pos.z, player.height, false);
  if (!safe) return;
  player.pos.copy(safe);
  player.prevPos.copy(player.pos);
  player.vel.set(0, 0, 0);
}

/* ------------------------------- simulation ------------------------------- */

function physicsTick() {
  if (player.jumpCooldown > 0) player.jumpCooldown--;
  if (player.flyToggleTimer > 0) player.flyToggleTimer--;
  if (player.sprintToggleTimer > 0) player.sprintToggleTimer--;

  player.prevPos.copy(player.pos);

  const rawFwd = (playerInput.forward ? 1 : 0) - (playerInput.back ? 1 : 0);
  const rawStrafe = (playerInput.right ? 1 : 0) - (playerInput.left ? 1 : 0);
  const jumpHeld = playerInput.jump;
  const sneakHeld = playerInput.sneak;

  if (playerInput.jumpEdge && playerInput.jump) {
    playerInput.jumpEdge = false;
    if (player.flyToggleTimer <= 0) {
      player.flyToggleTimer = DOUBLE_TAP_TICKS;
    } else {
      player.flying = !player.flying;
      player.flyToggleTimer = 0;
      player.vel.y = 0;
    }
  }

  // Sprint start: hold Ctrl (or Cmd) or double-tap forward. The double-tap
  // latches sprint until forward is released; Ctrl stops when released.
  if (playerInput.forwardEdge && playerInput.forward && rawFwd > 0.8) {
    if (player.sprintToggleTimer <= 0) player.sprintToggleTimer = DOUBLE_TAP_TICKS;
    else { player.sprinting = true; player.sprintLatch = true; player.sprintToggleTimer = 0; }
  }
  playerInput.forwardEdge = false;
  if (playerInput.sprint && rawFwd > 0.8 && !player.sneaking) player.sprinting = true;
  if (player.sprinting && rawFwd < 0.8) { player.sprinting = false; player.sprintLatch = false; }

  const wantSneak = sneakHeld && !player.flying;
  if (wantSneak && !player.sneaking) {
    player.sneaking = true;
    player.height = PLAYER_SNEAK_HEIGHT;
  } else if (!wantSneak && player.sneaking) {
    if (!playerCollidesAt(player.pos.x, player.pos.y, player.pos.z, PLAYER_HEIGHT)) {
      player.sneaking = false;
      player.height = PLAYER_HEIGHT;
    }
  }
  if (player.sneaking) { player.sprinting = false; player.sprintLatch = false; }

  // Input smoothing: Minecraft multiplies the raw input by 0.98 per tick.
  let fwd = rawFwd * 0.98;
  let strafe = rawStrafe * 0.98;

  const supportId = blockIdAtWorld(player.pos.x, player.pos.y - 0.02, player.pos.z);
  const supportProps = blockPhysics(supportId);
  const bodyIds = [
    blockIdAtWorld(player.pos.x, player.pos.y + 0.1, player.pos.z),
    blockIdAtWorld(player.pos.x, player.pos.y + 0.9, player.pos.z),
    blockIdAtWorld(player.pos.x, player.pos.y + 1.4, player.pos.z),
  ];
  const bodyPropsList = bodyIds.map(blockPhysics).filter(Boolean);
  const bodyProps = bodyPropsList[0] || null;
  const waterloggedBody = [
    blockStateAtWorld(player.pos.x, player.pos.y + 0.1, player.pos.z),
    blockStateAtWorld(player.pos.x, player.pos.y + 0.9, player.pos.z),
    blockStateAtWorld(player.pos.x, player.pos.y + 1.4, player.pos.z),
  ].some(state => state?.waterlogged === 'true');
  const WATER_PLANT_CLASSES = new Set([
    'KelpBlock', 'KelpPlantBlock', 'SeagrassBlock', 'TallSeagrassBlock',
    'BaseCoralPlantBlock', 'BaseCoralFanBlock', 'BaseCoralWallFanBlock',
    'CoralPlantBlock', 'CoralFanBlock', 'CoralWallFanBlock',
  ]);
  const inWeb = bodyPropsList.some(p => p.class === 'WebBlock');
  const inWater = waterloggedBody || bodyIds.some(id => id === 'water')
    || bodyPropsList.some(p => (p.class === 'LiquidBlock' && p.light !== 15) || WATER_PLANT_CLASSES.has(p.class));
  const inLava = bodyIds.some(id => id === 'lava') || bodyPropsList.some(p => p.class === 'LiquidBlock' && p.light === 15);
  const inPowder = bodyPropsList.some(p => p.class === 'PowderSnowBlock');
  const inBerry = bodyPropsList.some(p => p.class === 'SweetBerryBushBlock');
  const climbable = bodyPropsList.some(p => p.climbable);
  const speedCandidates = [supportProps, ...bodyPropsList]
    .filter(p => p && p.class !== 'AirBlock')
    .map(p => p.speed);
  const speedMul = speedCandidates.length ? Math.min(...speedCandidates) : 1;

  let groundDrag = GROUND_DRAG;
  let groundAccelFactor = GROUND_ACCEL_FACTOR;
  if (supportProps) {
    groundDrag = Math.max(0.05, Math.min(0.98, supportProps.friction * 0.91));
    groundAccelFactor = 0.16277136 / (groundDrag * groundDrag * groundDrag);
  }

  let accel, horizontalDrag;
  if (player.flying) {
    horizontalDrag = AIR_DRAG;
    accel = FLY_ACCEL * (player.sprinting ? 2 : 1);
  } else if (player.onGround) {
    horizontalDrag = groundDrag;
    accel = WALK_ACCEL * (player.sprinting ? SPRINT_ACCEL_MULT : 1) *
      (player.sneaking ? SNEAK_ACCEL_MULT : 1) * groundAccelFactor *
      speedMul;
  } else {
    horizontalDrag = AIR_DRAG;
    accel = player.sprinting ? 0.026 : 0.02;
  }

  if (fwd || strafe) {
    const inputLength = Math.max(1, Math.hypot(fwd, strafe));
    const scale = accel / inputLength;
    const sinYaw = Math.sin(player.yaw), cosYaw = Math.cos(player.yaw);
    player.vel.x += (-sinYaw * fwd + cosYaw * strafe) * scale;
    player.vel.z += (-cosYaw * fwd - sinYaw * strafe) * scale;
  }
  if (inWeb) {
    player.vel.x *= 0.25;
    player.vel.z *= 0.25;
    player.vel.y *= 0.05;
  }

  if (!jumpHeld) player.jumpCooldown = 0;

  if (player.flying) {
    if (jumpHeld) player.vel.y += FLY_VERTICAL_ACCEL;
    if (sneakHeld) player.vel.y -= FLY_VERTICAL_ACCEL;
  } else if (jumpHeld && player.onGround && player.jumpCooldown === 0) {
    player.vel.y = JUMP_VELOCITY * (supportProps?.jump ?? 1);
    if (player.sprinting) {
      player.vel.x += -Math.sin(player.yaw) * SPRINT_JUMP_BOOST;
      player.vel.z += -Math.cos(player.yaw) * SPRINT_JUMP_BOOST;
    }
    player.jumpCooldown = JUMP_COOLDOWN_TICKS;
  } else if (climbable && !player.flying && sneakHeld) {
    player.vel.y = Math.min(player.vel.y, -0.15);
  } else if (climbable && !player.flying && (fwd > 0.1 || jumpHeld)) {
    player.vel.y = Math.max(player.vel.y, 0.2);
  }

  const wasFlying = player.flying;
  const wasOnGround = player.onGround;
  const preMoveVy = player.vel.y;

  movePlayer();

  if (player.flying) {
    // The vertical impulse is preserved but heavily damped; gravity does not apply.
    player.vel.y = player.yCollided ? 0 : preMoveVy * FLY_VERTICAL_DRAG;
  } else {
    player.vel.y = (player.vel.y - GRAVITY) * 0.98;
  }
  player.vel.x *= horizontalDrag;
  player.vel.z *= horizontalDrag;

  if (inWater) {
    player.vel.x *= 0.8;
    player.vel.z *= 0.8;
    player.vel.y *= 0.8;
    if (jumpHeld) player.vel.y += 0.04;
  } else if (inLava) {
    player.vel.x *= 0.8;
    player.vel.z *= 0.8;
    player.vel.y *= 0.8;
    if (jumpHeld) player.vel.y += 0.04;
  } else if (inLava) {
    player.vel.x *= 0.5;
    player.vel.z *= 0.5;
    player.vel.y *= 0.5;
    if (jumpHeld) player.vel.y += 0.02;
  } else if (inPowder) {
    player.vel.x *= 0.7;
    player.vel.z *= 0.7;
  } else if (inBerry) {
    player.vel.x *= 0.6;
    player.vel.z *= 0.6;
  }

  if (bodyPropsList.some(p => p.class === 'BubbleColumnBlock')) {
    const bubbleDown = [-0.2, -1.2, -2.2].some(dy => {
      const below = blockPhysics(blockIdAtWorld(player.pos.x, player.pos.y + dy, player.pos.z));
      return below?.class === 'MagmaBlock';
    });
    player.vel.y += bubbleDown ? -0.08 : 0.08;
  }
  if (!player.flying && player.onGround && preMoveVy < -0.1 && supportProps?.class === 'SlimeBlock') {
    player.vel.y = Math.max(0.3, -preMoveVy * 0.8);
    player.onGround = false;
  }

  if (Math.abs(player.vel.x) < 0.005) player.vel.x = 0;
  if (Math.abs(player.vel.y) < 0.005) player.vel.y = 0;
  if (Math.abs(player.vel.z) < 0.005) player.vel.z = 0;

  // Hard safety floor: never fall more than 100 blocks below the lowest
  // placed block, even if the build has an edge/void.
  if (worldBounds && isFinite(worldBounds.minY)) {
    const fallLimit = worldBounds.minY - 100;
    if (player.pos.y < fallLimit) {
      player.pos.y = fallLimit;
      player.prevPos.y = Math.max(player.prevPos.y, fallLimit);
      player.vel.y = 0;
      player.yCollided = true;
    }
  }

  // Creative flight is cancelled when the player descends onto a surface.
  if (wasFlying && player.flying && !wasOnGround && player.onGround && preMoveVy < 0) {
    player.flying = false;
    player.vel.y = 0;
  }

  // Horizontal collisions must not cancel sprint: sliding along a wall keeps
  // the sprint state (and FOV) until forward is released or sneak is held.
}

function updatePlayer(delta) {
  physicsAccumulator += Math.min(delta, 0.25);
  let steps = 0;
  while (physicsAccumulator >= TICK_SECONDS && steps < 10) {
    physicsTick();
    physicsAccumulator -= TICK_SECONDS;
    steps++;
  }
  if (steps === 10) physicsAccumulator = 0;

  const alpha = Math.min(1, physicsAccumulator / TICK_SECONDS);
  // Smooth the crouch transition at render rate; doing it per tick made the
  // camera drop in visible 20 Hz steps.
  const targetEye = player.sneaking ? EYE_HEIGHT_SNEAK : EYE_HEIGHT;
  player.eyeHeight += (targetEye - player.eyeHeight) * (1 - Math.exp(-EYE_SMOOTH_RATE * delta));
  _camPos.lerpVectors(player.prevPos, player.pos, alpha);
  camera.position.set(_camPos.x, _camPos.y + player.eyeHeight, _camPos.z);
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

  const baseFov = CONFIG.player?.fov ?? 70;
  const targetFov = baseFov * (player.flying ? 1.1 : 1) * (player.sprinting ? 1.15 : 1);
  player.fov += (targetFov - player.fov) * Math.min(1, delta * 12);
  if (Math.abs(camera.fov - player.fov) > 0.01) {
    camera.fov = player.fov;
    camera.updateProjectionMatrix();
  }

  hudRefreshTimer += delta;
  if (hudRefreshTimer > 0.1) {
    hudRefreshTimer = 0;
    updateHud();
  }
}

/* -------------------------------- controls -------------------------------- */

function clearPlayerInput() {
  playerInput.forward = playerInput.back = playerInput.left = playerInput.right = false;
  playerInput.jump = playerInput.sneak = playerInput.sprint = false;
  playerInput.forwardEdge = playerInput.jumpEdge = false;
  mobileSprintToggle = false;
  mobileJoystickSprint = false;
  resetJoystick();
  syncMobileButtons();
}

function resetJoystick() {
  const knob = document.getElementById('joystickKnob');
  if (knob) knob.style.transform = 'translate(0px, 0px)';
  playerInput.forward = playerInput.back = playerInput.left = playerInput.right = false;
  mobileJoystickSprint = false;
  syncMobileSprint();
}

function syncMobileSprint() {
  playerInput.sprint = mobileSprintToggle || mobileJoystickSprint;
}

function syncMobileButtons() {
  const jump = document.getElementById('mobileJump');
  const sneak = document.getElementById('mobileSneak');
  const sprint = document.getElementById('mobileSprint');
  if (jump) jump.classList.toggle('active', playerInput.jump);
  if (sneak) {
    sneak.classList.toggle('active', playerInput.sneak);
    sneak.setAttribute('aria-pressed', String(playerInput.sneak));
  }
  if (sprint) {
    sprint.classList.toggle('active', playerInput.sprint);
    sprint.setAttribute('aria-pressed', String(playerInput.sprint));
  }
}

function updateMobileControls() {
  const el = document.getElementById('mobileControls');
  if (!el) return;
  const settingsOpen = document.getElementById('settingsPanel')?.classList.contains('open');
  const visible = IS_TOUCH && cameraMode === 'creative' && !settingsOpen;
  el.classList.toggle('visible', visible);
  el.setAttribute('aria-hidden', String(!visible));
  if (!visible) resetJoystick();
  syncMobileButtons();
}

function setMobileFullscreen(on) {
  mobileFullscreen = !!on;
  document.body.classList.toggle('mobile-fullscreen', mobileFullscreen);
  if (mobileFullscreen) setSettingsOpen(false);
  updateMobileControls();
  window.dispatchEvent(new Event('resize'));
}

function requestMobileFullscreen() {
  if (!IS_TOUCH || document.fullscreenElement) return;
  if (!document.documentElement.requestFullscreen) return;
  document.documentElement.requestFullscreen()
    .then(() => setMobileFullscreen(true))
    .catch(() => { /* fullscreen requires a user gesture / may be denied */ });
}

document.addEventListener('fullscreenchange', () => {
  if (IS_TOUCH) setMobileFullscreen(!!document.fullscreenElement);
});

function requestPointerLock() {
  if (IS_TOUCH || cameraMode !== 'creative' || pointerLocked) return;
  try {
    const p = canvas.requestPointerLock();
    if (p && typeof p.catch === 'function') p.catch(() => {});
  } catch (err) { /* pointer lock is optional */ }
}

/* Ctrl+W/A/D are browser shortcut keys. The Keyboard Lock API can hand them to
 * the page, but Chrome only enables it in JS-initiated fullscreen. Both requests
 * are made synchronously in the click gesture; the key lock follows fullscreen. */
function disableKeyboardLock() {
  keyboardLockActive = false;
  try { navigator.keyboard?.unlock?.(); } catch (err) { /* ignore */ }
}

function enterImmersiveCapture() {
  if (IS_TOUCH) return;
  let fullscreenRequest = null;
  if (navigator.keyboard && typeof navigator.keyboard.lock === 'function' && !document.fullscreenElement) {
    try { fullscreenRequest = document.documentElement.requestFullscreen(); } catch (err) { /* ignore */ }
  }
  requestPointerLock();

  if (!navigator.keyboard || typeof navigator.keyboard.lock !== 'function') return;
  const lockKeys = ['KeyW', 'KeyA', 'KeyD', 'ControlLeft', 'ControlRight'];
  // Windows screenshots (Win+Shift+S) need the Meta key left to the OS. Cmd
  // sprinting only matters on macOS, where Meta is part of the game controls.
  if (IS_MAC) lockKeys.push('MetaLeft', 'MetaRight');
  Promise.resolve(fullscreenRequest)
    .then(() => navigator.keyboard.lock(lockKeys))
    .then(() => { keyboardLockActive = true; })
    .catch(() => { keyboardLockActive = false; });
}

function setCameraMode(mode, requestLock = true) {
  if (mode === 'creative' && cameraMode !== 'creative') {
    camera.getWorldDirection(_lookDir);
    player.pitch = Math.asin(Math.max(-1, Math.min(1, _lookDir.y)));
    player.yaw = Math.atan2(-_lookDir.x, -_lookDir.z);
    player.pos.set(camera.position.x, camera.position.y - EYE_HEIGHT, camera.position.z);
    player.prevPos.copy(player.pos);
    player.vel.set(0, 0, 0);
    player.onGround = false;
    player.sneaking = false;
    player.height = PLAYER_HEIGHT;
    player.eyeHeight = EYE_HEIGHT;
    player.flying = CONFIG.player?.startFlying !== false;
    unstuckPlayer();
  }

  cameraMode = mode;
  localStorage.setItem(PLAYER_MODE_KEY, mode);
  clearPlayerInput();
  physicsAccumulator = 0;

  const btn = document.getElementById('cameraBtn');
  const crosshair = document.getElementById('crosshair');

  if (mode === 'creative') {
    controls.enabled = false;
    document.body.classList.add('play');
    if (crosshair) crosshair.style.display = 'block';
    if (btn) {
      btn.textContent = 'Camera: Creative';
      btn.classList.add('on'); btn.classList.remove('off');
      btn.setAttribute('aria-pressed', 'true');
    }
    if (requestLock) enterImmersiveCapture();
  } else {
    document.exitPointerLock?.();
    controls.enabled = true;
    controls.target.copy(player.pos).add(_lookDir.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw)).multiplyScalar(6));
    controls.update();
    document.body.classList.remove('play');
    if (crosshair) crosshair.style.display = 'none';
    if (btn) {
      btn.textContent = 'Camera: Orbit';
      btn.classList.remove('on'); btn.classList.add('off');
      btn.setAttribute('aria-pressed', 'false');
    }
    const baseFov = CONFIG.player?.fov ?? 70;
    player.fov = baseFov;
    camera.fov = baseFov;
    camera.updateProjectionMatrix();
  }
  updateHud();
  updateMobileControls();
}

function queueCreativeIcon(id, type, img) {
  img.addEventListener('error', () => { img.style.visibility = 'hidden'; });
  creativeIconQueue.push({ id, type, img });
  pumpCreativeIcons();
}

async function pumpCreativeIcons() {
  while (creativeIconsActive < 8 && creativeIconQueue.length) {
    const job = creativeIconQueue.shift();
    creativeIconsActive++;
    creativeIconUrl(job.id, job.type).then(url => {
      if (url) job.img.src = url;
      else job.img.style.visibility = 'hidden';
    }).finally(() => {
      creativeIconsActive--;
      pumpCreativeIcons();
    });
  }
}

function centerCreativeIcon(source) {
  if (!source) return source;
  const ctx = source.getContext('2d');
  const data = ctx.getImageData(0, 0, source.width, source.height).data;
  let minX = source.width, minY = source.height, maxX = -1, maxY = -1;
  for (let y = 0; y < source.height; y++) {
    for (let x = 0; x < source.width; x++) {
      if (data[(y * source.width + x) * 4 + 3]) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < minX || maxY < minY) return source;
  const out = document.createElement('canvas');
  out.width = source.width; out.height = source.height;
  const octx = out.getContext('2d');
  octx.imageSmoothingEnabled = false;
  const dx = Math.round((source.width - (maxX - minX + 1)) / 2) - minX;
  const dy = Math.round((source.height - (maxY - minY + 1)) / 2) - minY;
  octx.drawImage(source, dx, dy);
  return out;
}

async function creativeBlockIcon3DCanvas(id) {
  if (creativeIcon3DCache.has(id)) return creativeIcon3DCache.get(id);
  const previous = creativeIconRenderQueue;
  let release;
  creativeIconRenderQueue = new Promise(resolve => { release = resolve; });
  await previous;
  let result = null;
  try {
    const entries = await getBlockModels(id, {}, null);
    if (!entries?.length) return null;
    const buckets = new Map();
    for (const entry of entries) {
      const data = entry.data;
      if (!data?.elements) continue;
      const rotX = entry.x || 0, rotY = entry.y || 0;
      const q = new THREE.Quaternion();
      if (rotX || rotY) {
        q.setFromEuler(new THREE.Euler(
          THREE.MathUtils.degToRad(-rotX),
          THREE.MathUtils.degToRad(-rotY),
          0, 'YXZ'));
      }
      const offset = new THREE.Vector3(0.5, 0.5, 0.5);
      for (const el of data.elements) {
        collectElementFaces(el, data.textures || {}, id, q, offset, null, null, false, 'icon', entry.uvlock, rotX, rotY, null, buckets);
      }
    }
    if (!buckets.size) return null;
    initCreativeIconRenderer();
    const group = new THREE.Group();
    group.position.set(0, 0, 0);
    group.rotation.set(THREE.MathUtils.degToRad(30), THREE.MathUtils.degToRad(225), 0);
    group.scale.setScalar(0.625);
    for (const bucket of buckets.values()) {
      const positions = [], normals = [], uvs = [], colors = [], indices = [];
      let vCount = 0;
      for (const face of bucket.faces) {
        if (face.removed) continue;
        const c = face.corners, u = face.uvs, n = face.normal;
        const shade = 0.62 + 0.38 * Math.max(0, n[1] * 0.75 + n[2] * 0.25 + 0.15);
        for (let i = 0; i < 4; i++) {
          positions.push(c[i][0], c[i][1], c[i][2]);
          normals.push(n[0], n[1], n[2]);
          uvs.push(u[i][0], u[i][1]);
          colors.push(Math.min(1, shade), Math.min(1, shade), Math.min(1, shade));
        }
        indices.push(vCount, vCount + 1, vCount + 2, vCount, vCount + 2, vCount + 3);
        vCount += 4;
      }
      if (!vCount) continue;
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geom.setIndex(indices);
      geom.translate(-0.5, -0.5, -0.5);
      geom.computeBoundingBox();
      geom.computeBoundingSphere();
      if (!window.__iconDebug) window.__iconDebug = {};
      window.__iconDebug.bbox = geom.boundingBox ? {
        min: geom.boundingBox.min.toArray(), max: geom.boundingBox.max.toArray()
      } : null;
      window.__iconDebug.sphere = geom.boundingSphere ? {
        center: geom.boundingSphere.center.toArray(), radius: geom.boundingSphere.radius
      } : null;
      const map = bucket.material.map;
      if (!map) continue;
      window.__iconMapDebug = {
        src: map.image?.src || null,
        complete: map.image?.complete,
        width: map.image?.width,
        height: map.image?.height,
      };
      const mat = new THREE.MeshBasicMaterial({
        map,
        vertexColors: true,
        transparent: false,
        side: THREE.DoubleSide,
      });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.frustumCulled = false;
      group.add(mesh);
    }
    if (!group.children.length) return null;
    const waitForMap = map => {
      if (!map || (map.image && map.image.complete)) return Promise.resolve();
      return new Promise(resolve => {
        const started = performance.now();
        const poll = setInterval(() => {
          if (map.image && map.image.complete) {
            clearInterval(poll); resolve();
          } else if (performance.now() - started > 3500) {
            clearInterval(poll); resolve();
          }
        }, 40);
      });
    };
    await Promise.all([...group.children].map(child => waitForMap(child.material?.map)));
    creativeIconScene.add(group);
    creativeIconRenderer.render(creativeIconScene, creativeIconCamera);
    window.__iconDebug = {
      children: group.children.length,
      triangles: creativeIconRenderer.info.render.triangles,
      calls: creativeIconRenderer.info.render.calls,
      pos: group.position.toArray(),
      rot: [group.rotation.x, group.rotation.y, group.rotation.z],
    };
    const gl = creativeIconRenderer.getContext();
    const pixels = new Uint8Array(64 * 64 * 4);
    gl.readPixels(0, 0, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    let alpha = 0;
    for (let i = 3; i < pixels.length; i += 4) if (pixels[i]) alpha++;
    window.__iconDebug.alphaPixels = alpha;
    window.__iconDebug.canvas = [creativeIconRenderer.domElement.width, creativeIconRenderer.domElement.height];
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const outCtx = canvas.getContext('2d');
    outCtx.drawImage(creativeIconRenderer.domElement, 0, 0);
    const outData = outCtx.getImageData(0, 0, 64, 64).data;
    let visiblePixels = 0;
    for (let i = 3; i < outData.length; i += 4) if (outData[i]) visiblePixels++;
    creativeIconScene.remove(group);
    for (const child of group.children) {
      child.geometry.dispose();
      if (child.material.map) child.material.map = null;
      child.material.dispose();
    }
    result = visiblePixels > 20 ? centerCreativeIcon(canvas) : null;
  } catch (err) {
    result = null;
  } finally {
    release();
  }
  creativeIcon3DCache.set(id, result);
  return result;
}

async function creativeBlockIconCanvas(id) {
  const key = `canvas:${id}`;
  if (creativeIconCache.has(key)) return creativeIconCache.get(key);
  let canvas = null;
  try {
    const stateData = await loadBlockstate(id);
    const refs = [];
    if (stateData.variants) for (const v of Object.values(stateData.variants)) {
      for (const a of (Array.isArray(v) ? v : [v])) if (a?.model) refs.push(a.model);
    }
    for (const part of stateData.multipart || []) {
      const ap = part.apply; for (const a of (Array.isArray(ap) ? ap : [ap])) if (a?.model) refs.push(a.model);
    }
    const data = refs.length ? await loadModel(refs[0]) : null;
    const els = data?.elements || [];
    const fullCube = els.length === 1 &&
      els[0].from?.[0] === 0 && els[0].from?.[1] === 0 && els[0].from?.[2] === 0 &&
      els[0].to?.[0] === 16 && els[0].to?.[1] === 16 && els[0].to?.[2] === 16 &&
      !els[0].rotation;
    if (!fullCube) return null;
    const pick = name => resolveTexture(data.textures?.[name] || data.textures?.all || data.textures?.particle, data.textures || {});
    const topPath = pick('top'), sidePath = pick('side') || pick('all') || topPath;
    const frontPath = pick('front') || sidePath;
    const toUrl = path => {
      if (!path || path === 'block/missing') return null;
      let p = path.replace(/^minecraft:/, '');
      if (!p.startsWith('textures/')) p = `textures/${p}`;
      return `${ASSET_BASE}/${p}.png`;
    };
    const [topImg, sideImg, frontImg] = await Promise.all([
      toUrl(topPath) ? loadImage(toUrl(topPath)) : null,
      toUrl(sidePath) ? loadImage(toUrl(sidePath)) : null,
      toUrl(frontPath) ? loadImage(toUrl(frontPath)) : null,
    ]);
    if (!topImg || !sideImg) return null;
    canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    function quad(img, p0, p1, p2, p3, shade) {
      const [x0, y0] = p0, [x1, y1] = p1, [x3, y3] = p3;
      const a = (x1 - x0) / (img.width || 1), b = (y1 - y0) / (img.width || 1);
      const c = (x3 - x0) / (img.height || 1), d = (y3 - y0) / (img.height || 1);
      ctx.save();
      ctx.beginPath(); ctx.moveTo(...p0); ctx.lineTo(...p1); ctx.lineTo(...p2); ctx.lineTo(...p3); ctx.closePath(); ctx.clip();
      ctx.setTransform(a, b, c, d, x0, y0);
      ctx.drawImage(img, 0, 0);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (shade) { ctx.fillStyle = `rgba(0,0,0,${shade})`; ctx.fill(); }
      ctx.restore();
    }
    quad(topImg, [16, 1], [31, 8], [16, 15], [1, 8], 0);
    quad(frontImg || sideImg, [1, 8], [16, 15], [16, 31], [1, 24], 0.18);
    quad(sideImg, [16, 15], [31, 8], [31, 24], [16, 31], 0.32);
  } catch (err) { canvas = null; }
  canvas = centerCreativeIcon(canvas);
  creativeIconCache.set(key, canvas);
  return canvas;
}

async function creativeIconUrl(id, type = 'block') {
  const cacheKey = `${type}:${id}`;
  if (creativeIconCache.has(cacheKey)) return creativeIconCache.get(cacheKey);
  let url = null;
  if (type === 'item') {
    url = `${ASSET_BASE}/textures/item/${id}.png`;
  } else {
    try {
      const stateData = await loadBlockstate(id);
      const refs = [];
      if (stateData.variants) {
        for (const v of Object.values(stateData.variants)) {
          for (const a of (Array.isArray(v) ? v : [v])) if (a?.model) refs.push(a.model);
        }
      }
      for (const part of stateData.multipart || []) {
        const ap = part.apply; for (const a of (Array.isArray(ap) ? ap : [ap])) if (a?.model) refs.push(a.model);
      }
      for (const ref of refs.slice(0, 3)) {
        const data = await loadModel(ref);
        if (!data?.textures) continue;
        const preferred = data.textures.particle || data.textures.all ||
          data.textures.side || data.textures.top || Object.values(data.textures)[0];
        const tex = resolveTexture(preferred, data.textures);
        if (tex && tex !== 'block/missing') {
          let cleanTex = tex.replace(/^minecraft:/, '');
          if (!cleanTex.startsWith('textures/')) cleanTex = `textures/${cleanTex}`;
          url = `${ASSET_BASE}/${cleanTex}.png`;
          break;
        }
      }
    } catch (err) { /* leave placeholder */ }
  }
  creativeIconCache.set(cacheKey, url);
  return url;
}
