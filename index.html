    tab.style.width = `${layout.tabs.width * scale}px`;
    tab.style.height = `${layout.tabs.height * scale}px`;
    const suffix = `${top ? 'top' : 'bottom'}_${entry.name === creativeCategory ? 'selected' : 'unselected'}_${Math.min(7, col + 1)}`;
    tab.style.backgroundImage = `url('${ASSET_BASE}/textures/gui/sprites/container/creative_inventory/tab_${suffix}.png')`;
    tab.style.backgroundSize = `${layout.tabs.width * scale}px ${layout.tabs.height * scale}px`;
    tab.style.backgroundRepeat = 'no-repeat';
    tab.addEventListener('click', () => {
      creativeCategory = entry.name;
      creativePage = 0;
      const search = document.getElementById('inventorySearch');
      if (search) search.value = '';
      updateCreativePanelBackground();
      renderCreativeTabs();
      renderCreativeInventory();
    });
    const iconId = entry.icon || 'stone';
    const iconType = blockProperties[iconId.replace('minecraft:', '')] ? 'block' : 'item';
    const img = document.createElement('img');
    img.style.left = `${5 * scale}px`;
    img.style.top = `${(top ? 9 : 7) * scale}px`;
    img.style.width = `${16 * scale}px`;
    img.style.height = `${16 * scale}px`;
    queueCreativeIcon(iconId.replace('minecraft:', ''), iconType, img);
    tab.appendChild(img);
    tabs.appendChild(tab);
  }
}

function getCreativeLayout() {
  const selected = creativeTabs.find(tab => tab.name === creativeCategory);
  return selected?.type === 'INVENTORY' ? CREATIVE_LAYOUTS.inventory : CREATIVE_LAYOUTS.creative;
}

function applyCreativeScreenLayout() {
  const panel = document.querySelector('.inventory-panel');
  if (!panel) return;
  const layout = getCreativeLayout();
  const scale = creativeGuiScale;
  const selected = creativeTabs.find(tab => tab.name === creativeCategory);
  const type = selected?.type;
  const isInventory = type === 'INVENTORY';
  const px = value => `${value * scale}px`;
  panel.classList.toggle('inventory-mode', isInventory);
  panel.style.setProperty('--screen-w', px(layout.width));
  panel.style.setProperty('--screen-h', px(layout.height));
  panel.style.setProperty('--bg-size', px(256));
  panel.style.backgroundImage = `url('${ASSET_BASE}/textures/gui/${isInventory ? 'container/inventory.png' : type === 'SEARCH' ? 'container/creative_inventory/tab_item_search.png' : 'container/creative_inventory/tab_items.png'}')`;
  panel.style.backgroundSize = px(256);
  panel.style.setProperty('--tab-w', px(layout.tabs.width));
  panel.style.setProperty('--tab-h', px(layout.tabs.height));
  panel.style.setProperty('--tab-icon-x', px(5));
  panel.style.setProperty('--tab-icon-y', px(9));
  panel.style.setProperty('--icon-size', px(16));
  panel.style.setProperty('--icon-inset', px(1));

  const canvas = document.getElementById('inventoryText');
  if (canvas) {
    canvas.width = Math.round(layout.width * scale);
    canvas.height = Math.round(layout.height * scale);
  }
  const search = document.getElementById('inventorySearch');
  if (search) {
    search.style.left = px(layout.search?.x ?? 0);
    search.style.top = px(layout.search?.y ?? 0);
    search.style.width = px(layout.search?.w ?? 0);
    search.style.height = px(layout.search?.h ?? 0);
  }
  const grid = document.getElementById('inventoryGrid');
  if (grid && layout.grid) {
    const g = layout.grid;
    grid.style.setProperty('--grid-x', px(g.x));
    grid.style.setProperty('--grid-y', px(g.y));
    grid.style.setProperty('--grid-cols', String(g.cols));
    grid.style.setProperty('--slot-size', px(g.slot));
    grid.style.width = px(g.cols * g.slot);
    grid.style.height = px(g.rows * g.slot);
  }
  const hotbar = document.getElementById('inventoryHotbar');
  if (hotbar && layout.hotbar) {
    const h = layout.hotbar;
    hotbar.style.setProperty('--hotbar-x', px(h.x));
    hotbar.style.setProperty('--hotbar-y', px(h.y));
    hotbar.style.setProperty('--hotbar-cols', String(h.cols));
    hotbar.style.setProperty('--slot-size', px(h.slot));
    hotbar.style.width = px(h.cols * h.slot);
    hotbar.style.height = px(h.slot);
  }
  const scroll = document.querySelector('.inventory-scroll');
  if (scroll && layout.scroll) {
    scroll.style.setProperty('--scroll-x', px(layout.scroll.x));
    scroll.style.setProperty('--scroll-y', px(layout.scroll.y));
    scroll.style.setProperty('--scroll-w', px(layout.scroll.w));
    scroll.style.setProperty('--scroll-h', px(layout.scroll.h));
    scroll.style.setProperty('--scroll-thumb', px(layout.scroll.thumb));
  }
  const player = document.getElementById('inventoryPlayer');
  if (player && layout.player) {
    player.style.left = px(layout.player.x);
    player.style.top = px(layout.player.y);
    player.style.width = px(layout.player.w);
    player.style.height = px(layout.player.h);
  }
  renderInventorySlotLayer(scale, layout);
}

function renderInventorySlotLayer(scale, layout) {
  const layer = document.getElementById('inventorySlotLayer');
  if (!layer) return;
  layer.textContent = '';
  if (!layout.inventorySlots?.length) return;
  const add = (x, y) => {
    const slot = document.createElement('div');
    slot.className = 'inventory-slot';
    slot.style.left = `${x * scale}px`;
    slot.style.top = `${y * scale}px`;
    slot.style.width = `${18 * scale}px`;
    slot.style.height = `${18 * scale}px`;
    layer.appendChild(slot);
  };
  for (const group of layout.inventorySlots) {
    if (group.cols) {
      for (let row = 0; row < (group.rows || 1); row++) {
        for (let col = 0; col < group.cols; col++) add(group.x + col * 18, group.y + row * 18);
      }
    } else if (group.rows) {
      for (let row = 0; row < group.rows; row++) add(group.x, group.y + row * 18);
    } else {
      add(group.x, group.y);
    }
  }
}

function updateCreativePanelBackground() {
  const selected = creativeTabs.find(tab => tab.name === creativeCategory);
  const type = selected?.type;
  applyCreativeScreenLayout();
  const search = document.getElementById('inventorySearch');
  if (search) search.style.display = type === 'SEARCH' ? 'block' : 'none';
  if (type === 'INVENTORY') {
    const player = document.getElementById('inventoryPlayer');
    if (player) player.dataset.ready = '0';
    renderInventoryPlayer();
  }
  renderInventoryText();
}

let minecraftFontImage = null;
function loadMinecraftFont() {
  if (minecraftFontImage) return;
  minecraftFontImage = new Image();
  minecraftFontImage.crossOrigin = 'anonymous';
  minecraftFontImage.onload = () => renderInventoryText();
  minecraftFontImage.src = `${ASSET_BASE}/textures/font/ascii.png`;
}

function drawMinecraftText(ctx, text, x, y, scale, color) {
  const img = minecraftFontImage;
  if (!img?.complete) return;
  const glyph = 8;
  const advance = 6;
  const tmp = document.createElement('canvas');
  tmp.width = Math.max(1, ctx.canvas.width);
  tmp.height = Math.max(1, ctx.canvas.height);
  const tctx = tmp.getContext('2d');
  tctx.imageSmoothingEnabled = false;
  let tx = 0;
  for (let i = 0; i < text.length; i++) {
    const code = text.charCodeAt(i);
    if (code === 32) { tx += 4 * scale; continue; }
    const col = code % 16;
    const row = Math.floor(code / 16);
    tctx.drawImage(img, col * glyph, row * glyph, glyph, glyph, tx, 0, glyph * scale, glyph * scale);
    tx += advance * scale;
  }
  tctx.globalCompositeOperation = 'source-in';
  tctx.fillStyle = color;
  tctx.fillRect(0, 0, tmp.width, tmp.height);
  ctx.drawImage(tmp, x, y);
}

function renderInventoryText() {
  loadMinecraftFont();
  const canvas = document.getElementById('inventoryText');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = false;
  const selected = creativeTabs.find(tab => tab.name === creativeCategory);
  const type = selected?.type;
  const layout = getCreativeLayout();
  const s = creativeGuiScale;
  if (type !== 'INVENTORY') {
    const label = selected?.name || 'Building Blocks';
    drawMinecraftText(ctx, label, layout.title.x * s, layout.title.y * s, s, '#404040');
  }
  if (type === 'SEARCH') {
    const search = document.getElementById('inventorySearch');
    const text = search?.value || '';
    if (text) drawMinecraftText(ctx, text, (layout.search.x + 2) * s, (layout.search.y + 1) * s, s, '#ffffff');
  }
}

function activateCreativeHotbar(index, item) {
  if (creativeCarried) {
    creativeHotbar[index] = { id: creativeCarried.id, type: creativeCarried.type };
    creativeSelectedItem = creativeHotbar[index];
    creativeSlot = index;
    setCreativeCarried(null);
  } else {
    creativeSlot = index;
    creativeSelectedItem = item;
  }
  renderCreativeHotbar();
  renderInventoryHotbar();
}

function renderInventoryHotbar() {
  const bar = document.getElementById('inventoryHotbar');
  if (!bar) return;
  bar.textContent = '';
  creativeHotbar.forEach((item, index) => {
    const slot = document.createElement('button');
    slot.type = 'button';
    slot.className = 'creative-slot' + (index === creativeSlot ? ' selected' : '');
    slot.title = `${index + 1}: ${creativeLabel(item.id)}`;
    const img = document.createElement('img');
    img.alt = '';
    queueCreativeIcon(item.id, item.type, img);
    slot.appendChild(img);
    slot.addEventListener('click', () => {
      activateCreativeHotbar(index, item);
    });
    bar.appendChild(slot);
  });
}

function renderCreativeInventory(filter = '') {
  const grid = document.getElementById('inventoryGrid');
  if (!grid) return;
  const query = filter.trim().toLowerCase();
  const tab = creativeTabs.find(entry => entry.name === creativeCategory);
  const source = tab?.items?.length
    ? tab.items.map(id => ({ id, type: blockProperties[id] ? 'block' : 'item', cat: creativeCategory }))
    : creativeItems.length
      ? creativeItems
      : Object.keys(blockProperties).filter(id => id !== 'air').map(id => ({ id, type: 'block', cat: 'Building Blocks' }));
  const rows = source
    .filter(item => !query || item.id.includes(query));
  const cols = 9;
  const visibleRows = 5;
  const perPage = cols * visibleRows;
  const maxRow = Math.max(0, Math.ceil(rows.length / cols) - visibleRows);
  creativePage = Math.max(0, Math.min(Math.round(creativePage), maxRow));
  const pageRows = rows.slice(creativePage * cols, creativePage * cols + perPage);

  grid.textContent = '';
  for (let i = 0; i < perPage; i++) {
    const entry = pageRows[i];
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'inventory-item';
    if (!entry) { item.style.visibility = 'hidden'; grid.appendChild(item); continue; }
    item.title = '';
    queueCreativeMenuIcon(entry, item);
    item.addEventListener('mousedown', (event) => handleCreativeSlotClick(entry, event));
    item.addEventListener('contextmenu', (event) => event.preventDefault());
    item.addEventListener('mouseenter', (event) => {
      const tip = document.getElementById('creativeTooltip');
      if (!tip) return;
      tip.textContent = creativeLabel(entry.id);
      tip.style.display = 'block';
      tip.style.left = `${event.clientX + 12}px`;
      tip.style.top = `${event.clientY - 18}px`;
    });
    item.addEventListener('mousemove', (event) => {
      const tip = document.getElementById('creativeTooltip');
      if (!tip) return;
      tip.style.left = `${event.clientX + 12}px`;
      tip.style.top = `${event.clientY - 18}px`;
    });
    item.addEventListener('mouseleave', () => {
      const tip = document.getElementById('creativeTooltip');
      if (tip) tip.style.display = 'none';
    });
    grid.appendChild(item);
  }

  const knob = document.getElementById('inventoryScrollKnob');
  if (knob) {
    const track = Math.max(0, 224 - 30);
    const offset = maxRow ? (creativePage / maxRow) * track : 0;
    knob.style.transform = `translateY(${offset}px)`;
    knob.style.visibility = maxRow ? 'visible' : 'hidden';
  }
}

function openCreativeInventory() {
  creativeInventoryOpen = true;
  const overlay = document.getElementById('inventoryOverlay');
  if (!overlay) return;
  document.body.classList.add('inventory-open');
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden', 'false');
  document.exitPointerLock?.();
  const search = document.getElementById('inventorySearch');
  if (search) { search.value = ''; setTimeout(() => search.focus(), 0); }
  creativePage = 0;
  updateCreativePanelBackground();
  renderCreativeTabs();
  renderCreativeInventory();
  renderInventoryHotbar();
}

function closeCreativeInventory() {
  creativeInventoryOpen = false;
  setCreativeCarried(null);
  const tip = document.getElementById('creativeTooltip');
  if (tip) tip.style.display = 'none';
  document.body.classList.remove('inventory-open');
  const overlay = document.getElementById('inventoryOverlay');
  if (overlay) {
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
  }
}

function setCreativeGuiScale(scale, persist = false) {
  creativeGuiScale = Math.max(0.75, Math.min(4, Number(scale) || 1.5));
  if (persist) {
    try { localStorage.setItem('viewerCreativeGuiScale', String(creativeGuiScale)); } catch {}
  }
  if (creativeInventoryOpen) {
    applyCreativeScreenLayout();
    renderCreativeTabs();
    renderCreativeInventory();
  }
}

function initCreativeUI() {
  setCreativeGuiScale(CONFIG?.ui?.creativeGuiScale ?? 1.5);
  window.setCreativeGuiScale = setCreativeGuiScale;
  window.openCreativeInventory = openCreativeInventory;
  window.closeCreativeInventory = closeCreativeInventory;
  window.isCreativeInventoryOpen = () => creativeInventoryOpen;
  window.creativeBlockIcon3DCanvas = creativeBlockIcon3DCanvas;
  window.selectCreativeTab = (name) => {
    creativeCategory = name;
    creativePage = 0;
    updateCreativePanelBackground();
    renderCreativeTabs();
    renderCreativeInventory();
  };
  renderCreativeHotbar();
  renderInventoryHotbar();
  renderCreativeTabs();
  const panel = document.querySelector('.inventory-panel');
  if (panel) panel.style.backgroundImage = `url('${ASSET_BASE}/textures/gui/container/creative_inventory/tab_items.png')`;
  updateCreativePanelBackground();
  const knob = document.getElementById('inventoryScrollKnob');
  if (knob) knob.style.backgroundImage = `url('${ASSET_BASE}/textures/gui/sprites/container/creative_inventory/scroller.png')`;
  const scrollTrack = document.querySelector('.inventory-scroll');
  if (scrollTrack) {
    const setFromPointer = (clientY) => {
      const rect = scrollTrack.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (clientY - rect.top - 15) / Math.max(1, rect.height - 30)));
      const itemCount = creativeTabs.find(entry => entry.name === creativeCategory)?.items?.length || 0;
      const maxRow = Math.max(0, Math.ceil(itemCount / 9) - 5);
      creativePage = Math.round(ratio * maxRow);
      renderCreativeInventory(document.getElementById('inventorySearch')?.value || '');
    };
    scrollTrack.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      scrollTrack.setPointerCapture(e.pointerId);
      const move = ev => setFromPointer(ev.clientY);
      const up = () => {
        scrollTrack.removeEventListener('pointermove', move);
        scrollTrack.removeEventListener('pointerup', up);
        scrollTrack.removeEventListener('pointercancel', up);
      };
      scrollTrack.addEventListener('pointermove', move);
      scrollTrack.addEventListener('pointerup', up);
      scrollTrack.addEventListener('pointercancel', up);
      setFromPointer(e.clientY);
    });
  }
  const close = document.getElementById('inventoryClose');
  if (close) close.addEventListener('click', closeCreativeInventory);
  const overlay = document.getElementById('inventoryOverlay');
  if (overlay) overlay.addEventListener('pointerdown', (e) => {
    if (e.target !== overlay) return;
    if (creativeCarried) setCreativeCarried(null);
    else closeCreativeInventory();
  });
  document.addEventListener('pointermove', (e) => {
    if (creativeInventoryOpen) moveCreativeCursor(e);
  });
  if (overlay) overlay.addEventListener('wheel', (e) => {
    if (!creativeInventoryOpen) return;
    e.preventDefault();
    creativePage += e.deltaY > 0 ? 1 : -1;
    renderCreativeInventory(document.getElementById('inventorySearch')?.value || '');
  }, { passive: false });
  document.addEventListener('wheel', (e) => {
    if (creativeInventoryOpen || cameraMode !== 'creative' || !pointerLocked) return;
    e.preventDefault();
    creativeSlot = (creativeSlot + (e.deltaY > 0 ? 1 : -1) + creativeHotbar.length) % creativeHotbar.length;
    creativeSelectedItem = creativeHotbar[creativeSlot];
    renderCreativeHotbar();
    renderInventoryHotbar();
  }, { passive: false });
  const search = document.getElementById('inventorySearch');
  if (search) search.addEventListener('input', () => { creativePage = 0; renderCreativeInventory(search.value); renderInventoryText(); });
}

function updateHud() {
  const hud = document.getElementById('hud');
  if (!hud) return;
  if (cameraMode !== 'creative') {
    hud.textContent = 'Orbit camera';
    return;
  }
  const state = player.flying ? 'Flying' : (player.sneaking ? 'Sneaking' : (player.sprinting ? 'Sprinting' : (player.onGround ? 'Walking' : 'Falling')));
  const pos = `${player.pos.x.toFixed(2)} / ${player.pos.y.toFixed(2)} / ${player.pos.z.toFixed(2)}`;
  hud.textContent = `Creative — ${state} — XYZ ${pos}`;
}

function updateFovUi(fov) {
  const slider = document.getElementById('fovSlider');
  if (slider && Number(slider.value) !== fov) slider.value = String(fov);
  const value = document.getElementById('fovValue');
  if (value) value.textContent = fov + '°';
}

function setBaseFov(value, persist = true) {
  const fov = Math.max(30, Math.min(110, Math.round(Number(value) || 70)));
  if (!CONFIG.player) CONFIG.player = {};
  CONFIG.player.fov = fov;
  updateFovUi(fov);
  if (persist) localStorage.setItem(FOV_STORAGE_KEY, String(fov));
  if (cameraMode !== 'creative') {
    player.fov = fov;
    camera.fov = fov;
    camera.updateProjectionMatrix();
  }
}

function initPlayerController() {
  const cfg = CONFIG.player || {};
  const savedFov = parseFloat(localStorage.getItem(FOV_STORAGE_KEY));
  const fov = Number.isFinite(savedFov) ? savedFov : (cfg.fov ?? 70);
  player.fov = fov;
  setBaseFov(fov, false);
  camera.fov = player.fov;
  camera.updateProjectionMatrix();

  // Orient the camera at the build before taking the first-person pose from it.
  controls.target.set(0, 0, 0);
  controls.update();

  const saved = localStorage.getItem(PLAYER_MODE_KEY);
  const mode = saved === 'orbit' ? 'orbit' : 'creative';
  cameraMode = mode === 'creative' ? 'orbit' : 'creative'; // force the switch path
  setCameraMode(mode, false);
}

window.addEventListener('keydown', (e) => {
  // Ctrl/Cmd+S would save the page; intercept it everywhere, including while
  // typing in the command box. KeyS is deliberately not keyboard-locked so
  // Windows can still receive Win+Shift+S.
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyS') e.preventDefault();

  const tag = (e.target && e.target.tagName) || '';
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;

  if (e.code === 'KeyH' && !e.repeat) setHeightMapsEnabled(!heightMapsEnabled);

  if (creativeInventoryOpen) {
    if (e.code === 'Escape') closeCreativeInventory();
    return;
  }
  if (e.code === 'KeyE' && !e.repeat && cameraMode === 'creative') {
    openCreativeInventory();
    return;
  }
  const digit = /^Digit([1-9])$/.exec(e.code);
  if (digit && cameraMode === 'creative') {
    const index = Number(digit[1]) - 1;
    if (index < creativeHotbar.length) {
      creativeSlot = index;
      creativeSelectedItem = creativeHotbar[index];
      renderCreativeHotbar();
      renderInventoryHotbar();
    }
    return;
  }

  if (cameraMode !== 'creative') return;

  // With Keyboard Lock active this arrives after the shortcut was captured;
  // preventDefault is the last line of defence in browsers that deliver it.
  if ((e.ctrlKey || e.metaKey) && (e.code === 'KeyW' || e.code === 'KeyA' || e.code === 'KeyD')) e.preventDefault();

  switch (e.code) {
    case 'KeyW':
      if (!playerInput.forward && !e.repeat) playerInput.forwardEdge = true;
      playerInput.forward = true; break;
    case 'KeyS': playerInput.back = true; break;
    case 'KeyA': playerInput.left = true; break;
    case 'KeyD': playerInput.right = true; break;
    case 'Space':
      e.preventDefault();
      if (!playerInput.jump && !e.repeat) playerInput.jumpEdge = true;
      playerInput.jump = true; break;
    case 'ShiftLeft': case 'ShiftRight':
      playerInput.sneak = true; break;
    case 'ControlLeft': case 'ControlRight':
      e.preventDefault();
      playerInput.sprint = true; break;
    case 'MetaLeft': case 'MetaRight':
      if (IS_MAC) {
        e.preventDefault();
        playerInput.sprint = true;
      }
      break;
    case 'KeyR':
      if (!e.repeat) respawnPlayer();
      break;
  }
});

window.addEventListener('keyup', (e) => {
  switch (e.code) {
    case 'KeyW': playerInput.forward = false; break;
    case 'KeyS': playerInput.back = false; break;
    case 'KeyA': playerInput.left = false; break;
    case 'KeyD': playerInput.right = false; break;
    case 'Space': playerInput.jump = false; break;
    case 'ShiftLeft': case 'ShiftRight': playerInput.sneak = false; break;
    case 'ControlLeft': case 'ControlRight': playerInput.sprint = false; break;
    case 'MetaLeft': case 'MetaRight':
      if (IS_MAC) playerInput.sprint = false;
      break;
  }
});

window.addEventListener('blur', () => clearPlayerInput());

document.addEventListener('mousemove', (e) => {
  if (!pointerLocked || cameraMode !== 'creative') return;
  const sensitivity = CONFIG.player?.mouseSensitivity ?? 0.5;
  const f = sensitivity * 0.6 + 0.2;
  const degreesPerPixel = f * f * f * 8 * 0.15;
  player.yaw -= THREE.MathUtils.degToRad(e.movementX * degreesPerPixel);
  player.pitch -= THREE.MathUtils.degToRad(e.movementY * degreesPerPixel);
  const limit = Math.PI / 2 - 0.001;
  player.pitch = Math.max(-limit, Math.min(limit, player.pitch));
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === canvas;
  if (!pointerLocked) {
    clearPlayerInput();
    disableKeyboardLock();
  }
});

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) disableKeyboardLock();
});

canvas.addEventListener('click', () => {
  if (!IS_TOUCH && cameraMode === 'creative') enterImmersiveCapture();
});
canvas.addEventListener('contextmenu', (e) => {
  if (IS_TOUCH) e.preventDefault();
});

const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');

function setSettingsOpen(open) {
  settingsPanel.classList.toggle('open', open);
  settingsPanel.setAttribute('aria-hidden', String(!open));
  settingsBtn.setAttribute('aria-expanded', String(open));
  settingsBtn.classList.toggle('open', open);
  updateMobileControls();
}

settingsBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  setSettingsOpen(!settingsPanel.classList.contains('open'));
});

document.addEventListener('click', (e) => {
  if (!settingsPanel.classList.contains('open')) return;
  if (settingsPanel.contains(e.target) || settingsBtn.contains(e.target)) return;
  setSettingsOpen(false);
});

/* ------------------------------ touch controls ------------------------------ */

const joystickEl = document.getElementById('joystick');
const joystickKnob = document.getElementById('joystickKnob');
let joystickPointerId = null;
let lookPointerId = null;
let lookX = 0, lookY = 0;

function updateJoystickFromPointer(e) {
  const rect = joystickEl.getBoundingClientRect();
  const cx = rect.left + rect.width * 0.5;
  const cy = rect.top + rect.height * 0.5;
  const max = rect.width * 0.32;
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  const dist = Math.hypot(dx, dy);
  if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
  if (joystickKnob) joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  const nx = dx / max, ny = dy / max;
  const dead = 0.22;
  // Screen Y grows downward; up is forward.
  playerInput.forward = ny < -dead;
  playerInput.back = ny > dead;
  playerInput.left = nx < -dead;
  playerInput.right = nx > dead;
  const magnitude = Math.hypot(nx, ny);
  const autoSprint = ny < -0.65 && magnitude > 0.82;
  if (autoSprint !== mobileJoystickSprint) {
    mobileJoystickSprint = autoSprint;
    syncMobileSprint();
    syncMobileButtons();
  }
}

function captureReflections() {
  const gridWasVisible = gridHelper.visible;
  const worldWasVisible = worldGroup.visible;
  const starWasVisible = starContainer ? starContainer.visible : false;
  const sunWasVisible = sunMesh ? sunMesh.visible : false;
  const moonWasVisible = moonMesh ? moonMesh.visible : false;
  gridHelper.visible = false;
  worldGroup.visible = false;
  if (starContainer) starContainer.visible = false;
  if (sunMesh) sunMesh.visible = false;
  if (moonMesh) moonMesh.visible = false;

  reflectionCamera.renderTarget = reflectionWriteTarget;
  reflectionCamera.position.copy(camera.position);
  reflectionCamera.updateMatrixWorld(true);
  reflectionCamera.update(renderer, scene);

  gridHelper.visible = gridWasVisible;
  worldGroup.visible = worldWasVisible;
  if (starContainer) starContainer.visible = starWasVisible;
  if (sunMesh) sunMesh.visible = sunWasVisible;
  if (moonMesh) moonMesh.visible = moonWasVisible;

  reflectionTexture = reflectionWriteTarget.texture;
  reflectionWriteTarget = reflectionWriteTarget === reflectionTargetA ? reflectionTargetB : reflectionTargetA;
  for (const material of blockMaterialCache.values()) {
    if (material.userData.reflective) material.envMap = reflectionTexture;
  }
}

function captureCelestialReflections() {
  const gridWasVisible = gridHelper.visible;
  const worldWasVisible = worldGroup.visible;
  const starWasVisible = starContainer ? starContainer.visible : false;
  const skyWasVisible = skyMesh ? skyMesh.visible : false;
  const sunWasVisible = sunMesh ? sunMesh.visible : false;
  const moonWasVisible = moonMesh ? moonMesh.visible : false;
  const background = scene.background;
  const clearColor = renderer.getClearColor(new THREE.Color());
  const clearAlpha = renderer.getClearAlpha();

  gridHelper.visible = false;
  worldGroup.visible = false;
  if (starContainer) starContainer.visible = false;
  if (skyMesh) skyMesh.visible = false;
  // Real-sky sun/moon below the horizon must not appear in reflections.
  if (sunMesh) sunMesh.visible = sunWasVisible && sunMesh.position.y > camera.position.y + 0.01;
  if (moonMesh) moonMesh.visible = moonWasVisible && moonMesh.position.y > camera.position.y + 0.01;
  scene.background = null;
  renderer.setClearColor(0x000000, 1);

  celestialCamera.renderTarget = celestialWriteTarget;
  celestialCamera.position.copy(camera.position);
  celestialCamera.updateMatrixWorld(true);
  celestialCamera.update(renderer, scene);

  gridHelper.visible = gridWasVisible;
  worldGroup.visible = worldWasVisible;
  if (starContainer) starContainer.visible = starWasVisible;
  if (skyMesh) skyMesh.visible = skyWasVisible;
  if (sunMesh) sunMesh.visible = sunWasVisible;
  if (moonMesh) moonMesh.visible = moonWasVisible;
  scene.background = background;
  renderer.setClearColor(clearColor, clearAlpha);

  celestialTexture = celestialWriteTarget.texture;
  celestialWriteTarget = celestialWriteTarget === celestialTargetA ? celestialTargetB : celestialTargetA;
  for (const material of blockMaterialCache.values()) {
    if (!material.userData.reflective) continue;
    const u = material.userData.heightUniforms;
    if (u) u.uCelestialMap.value = celestialTexture;
  }
}

function updateReflections(delta) {
  if (!reflectionsEnabled) return;
  reflectionTimer += delta;
  if (reflectionDirty || reflectionTimer >= REFLECTION_INTERVAL) {
    reflectionTimer = 0;
    reflectionDirty = false;
    captureReflections();
  }
  celestialTimer += delta;
  if (celestialDirty || celestialTimer >= CELESTIAL_INTERVAL) {
    celestialTimer = 0;
    celestialDirty = false;
    captureCelestialReflections();
  }
}

/* ============================= ANIMATION ============================= */

const clock = new THREE.Clock();
let gameTime = 0;

function updateSky(delta) {
  if (!skyMaterial) return;
  skyElapsed += delta;
  const totalProgress = skyElapsed / CONFIG.sky.stateDuration;
  const stateIndex = Math.floor(totalProgress) % CONFIG.sky.stateCount;
  const nextIndex = (stateIndex + 1) % CONFIG.sky.stateCount;
  const localProgress = totalProgress - Math.floor(totalProgress);
  let blend = 0;
  if (localProgress >= CONFIG.sky.holdFraction) {
    blend = (localProgress - CONFIG.sky.holdFraction) / (1 - CONFIG.sky.holdFraction);
  }
  skyMaterial.uniforms.currentState.value = stateIndex;
  skyMaterial.uniforms.nextState.value = nextIndex;
  skyMaterial.uniforms.blend.value = blend;
  skyMesh.position.copy(camera.position);
}

const _orientMat = new THREE.Matrix4();
const _orientX = new THREE.Vector3();
const _orientY = new THREE.Vector3();
const _orientZ = new THREE.Vector3();

function orientCelestial(mesh, angle) {
  const c = Math.cos(angle);
  const s = Math.sin(angle);
  const nx = -c, ny = -s, nz = 0;
  const ux = -s, uy = c, uz = 0;
  const rx = uy * nz - uz * ny;
  const ry = uz * nx - ux * nz;
  const rz = ux * ny - uy * nx;
  _orientX.set(rx, ry, rz);
  _orientY.set(ux, uy, uz);
  _orientZ.set(nx, ny, nz);
  _orientMat.makeBasis(_orientX, _orientY, _orientZ);
  mesh.quaternion.setFromRotationMatrix(_orientMat);
}

function updateCelestialBodies(delta) {
  if (!sunMesh && !moonMesh && !starMesh) return;
  dayElapsed += delta;
  const angle = CONFIG.dayCycle.startAngleRadians + (dayElapsed / CONFIG.dayCycle.cycleSeconds) * Math.PI * 2;
  const sinAngle = Math.sin(angle);

  if (sunMesh) {
    const sunX = Math.cos(angle) * CONFIG.sun.distance;
    const sunY = Math.sin(angle) * CONFIG.sun.distance;
    sunMesh.position.set(camera.position.x + sunX, camera.position.y + sunY, camera.position.z);
    orientCelestial(sunMesh, angle);
    sunMesh.visible = true;
  }
  if (moonMesh) {
    const moonAngle = angle + Math.PI;
    const moonX = Math.cos(moonAngle) * CONFIG.moon.distance;
    const moonY = Math.sin(moonAngle) * CONFIG.moon.distance;
    moonMesh.position.set(camera.position.x + moonX, camera.position.y + moonY, camera.position.z);
    orientCelestial(moonMesh, moonAngle);
    moonMesh.visible = true;
    const dayCount = Math.floor(dayElapsed / CONFIG.dayCycle.cycleSeconds);
    const phaseIndex = ((CONFIG.moon.startingPhase + dayCount) % CONFIG.moon.phaseFiles.length + CONFIG.moon.phaseFiles.length) % CONFIG.moon.phaseFiles.length;
    if (phaseIndex !== currentMoonPhaseIndex && moonTextures[phaseIndex]) {
      moonMesh.material.uniforms.tex.value = moonTextures[phaseIndex];
      currentMoonPhaseIndex = phaseIndex;
    }
  }
  if (starContainer && starMesh) {
    starContainer.position.copy(camera.position);
    starContainer.rotation.z = angle - CONFIG.dayCycle.startAngleRadians;
    let night = 0;
    if (sinAngle < -0.05) night = Math.min(1, (-sinAngle - 0.05) / 0.35);
    if (starMesh.material.uniforms) {
      starMesh.material.uniforms.uNight.value = night;
      starMesh.material.uniforms.uTime.value = dayElapsed;
    }
    starMesh.visible = night > 0.001;
  }
}

function updateLighting() {
  const angle = CONFIG.dayCycle.startAngleRadians + (dayElapsed / CONFIG.dayCycle.cycleSeconds) * Math.PI * 2;
  const sinAngle = Math.sin(angle);
  const sunUp = Math.max(0, sinAngle);
  const moonUp = Math.max(0, -sinAngle);
  const totalUp = sunUp + moonUp;
  const dayness = totalUp > 0 ? sunUp / totalUp : 0.5;
  const fade = Math.min(1, totalUp / CONFIG.lighting.horizonFadeAngle);

  const ambientBase = CONFIG.lighting.ambientNight + (CONFIG.lighting.ambientDay - CONFIG.lighting.ambientNight) * dayness;
  ambientLight.intensity = ambientBase * (0.6 + 0.4 * fade);

  const activeAngle = sinAngle >= 0 ? angle : angle + Math.PI;
  const lx = Math.cos(activeAngle);
  const ly = Math.sin(activeAngle);
  heightSunDir.value.set(lx, ly, 0);
  const ld = 100;
  sunLight.position.set(camera.position.x + lx * ld, camera.position.y + ly * ld, camera.position.z);
  sunLight.target.position.copy(camera.position);
  sunLight.target.updateMatrixWorld();

  const dirIntensity = CONFIG.lighting.moonIntensity + (CONFIG.lighting.sunIntensity - CONFIG.lighting.moonIntensity) * dayness;
  sunLight.intensity = dirIntensity * fade;

  const sc = CONFIG.lighting.sunColorObj;
  const mc = CONFIG.lighting.moonColorObj;
  sunLight.color.setRGB(
    mc.r + (sc.r - mc.r) * dayness,
    mc.g + (sc.g - mc.g) * dayness,
    mc.b + (sc.b - mc.b) * dayness
  );
}

function animate() {
  requestAnimationFrame(animate);
  ensureViewport();
  const delta = Math.min(clock.getDelta(), 0.1);
  gameTime += delta * 20 * CONFIG.animation.shaderSpeed;
  for (const { uniformRef } of timeUniforms) uniformRef.value = gameTime;
  for (const tex of animatedTextures) {
    const data = tex.userData; if (!data) continue;
    data.timer += delta;
    if (data.timer >= data.frameDuration) {
      data.timer = 0;
      data.currentFrame = (data.currentFrame + 1) % data.frameCount;
      tex.offset.y = 1 - ((data.currentFrame + 1) / data.frameCount);
      if (data.reflectionMask) data.reflectionMask.offset.y = tex.offset.y;
    }
  }
  if (cameraMode === 'creative') updatePlayer(delta);
  else controls.update();
  updateSky(delta);
  updateCelestialBodies(delta);
  updateLighting();
  updateReflections(delta);
  renderer.render(scene, camera);
}

const mcUI = {
  open: false,
  scale: 1.5,
  page: 0,
  carried: null,
  search: '',
  mouse: { x: 0, y: 0, inside: false },
  hover: null,
  draggingScroll: false,
  images: new Map(),
  icons: new Map(),
  pendingImages: new Set(),
};

function mcImage(path) {
  if (!path) return null;
  const key = path.startsWith('http') ? path : `${ASSET_BASE}/${path}`;
  if (mcUI.images.has(key)) return mcUI.images.get(key);
  if (mcUI.pendingImages.has(key)) return null;
  mcUI.pendingImages.add(key);
  loadImage(key).then(img => {
    mcUI.images.set(key, img);
    mcUI.pendingImages.delete(key);
    mcRequestRender();
  }).catch(() => {
    mcUI.images.set(key, null);
    mcUI.pendingImages.delete(key);
  });
  return null;
}

function mcFontImage() {
  return mcImage('textures/font/ascii.png');
}

const mcFontTintCache = new Map();
let mcGlyphAdvanceCache = null;
function mcGlyphAdvances() {
  if (mcGlyphAdvanceCache) return mcGlyphAdvanceCache;
  const src = mcFontImage();
  if (!src) return null;
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  const g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  const data = g.getImageData(0, 0, c.width, c.height).data;
  const widths = new Uint8Array(256);
  for (let code = 0; code < 256; code++) {
    const col = code % 16, row = Math.floor(code / 16);
    let right = -1;
    for (let x = 0; x < 8; x++) {
      for (let y = 0; y < 8; y++) {
        if (data[((row * 8 + y) * c.width + col * 8 + x) * 4 + 3]) right = x;
      }
    }
    widths[code] = code === 32 ? 4 : (right < 0 ? 0 : right + 2);
  }
  mcGlyphAdvanceCache = widths;
  return widths;
}

function mcTintedFont(color) {
  const src = mcFontImage();
  if (!src) return null;
  if (mcFontTintCache.has(color)) return mcFontTintCache.get(color);
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = color;
  g.fillRect(0, 0, c.width, c.height);
  mcFontTintCache.set(color, c);
  return c;
}

function mcText(ctx, text, x, y, color = '#404040', scale = 1) {
  const font = mcTintedFont(color);
  const shadow = mcTintedFont('#3f3f3f');
  const widths = mcGlyphAdvances();
  if (!font || !widths) return;
  let cx = x;
  for (const ch of text) {
    const code = ch.charCodeAt(0);
    const col = code % 16;
    const row = Math.floor(code / 16);
    if (shadow && color !== '#3f3f3f') {
      ctx.drawImage(shadow, col * 8, row * 8, 8, 8, cx + scale, y + scale, 8 * scale, 8 * scale);
    }
    ctx.drawImage(font, col * 8, row * 8, 8, 8, cx, y, 8 * scale, 8 * scale);
    cx += (widths[code] || 0) * scale;
  }
}

function mcMeasureText(text, scale = 1) {
  const widths = mcGlyphAdvances();
  if (!widths) return 0;
  let w = 0;
  for (const ch of text) w += (widths[ch.charCodeAt(0)] || 0) * scale;
  return w;
}

function mcSelectedTab() {
  return creativeTabs.find(tab => tab.name === creativeCategory) || creativeTabs[0];
}

function mcScreenLayout() {
  const tab = mcSelectedTab();
  return tab?.type === 'INVENTORY' ? CREATIVE_LAYOUTS.inventory : CREATIVE_LAYOUTS.creative;
}

function mcTabX(tab, layout) {
  const right = ['Saved Hotbars', 'Search Items', 'Operator Utilities', 'Survival Inventory'].includes(tab.name);
  return right
    ? layout.width - layout.tabs.spacing * (7 - tab.column) + 1
    : layout.tabs.spacing * tab.column;
}

function mcTabRects(layout) {
  return creativeTabs.map(tab => {
    const top = tab.row !== 'BOTTOM';
    return {
      tab,
      x: mcTabX(tab, layout),
      y: top ? layout.tabs.drawTop : layout.tabs.drawBottom,
      w: layout.tabs.width,
      h: layout.tabs.height,
    };
  });
}

function mcEntryType(id) {
  return blockProperties[id] ? 'block' : 'item';
}

function mcFilteredEntries() {
  const tab = mcSelectedTab();
  let items = tab?.items || [];
  if (mcUI.search) {
    const q = mcUI.search.toLowerCase();
    items = items.filter(id => id.includes(q));
  }
  return items.map(id => ({ id, type: mcEntryType(id) }));
}

function mcRows() {
  return Math.max(0, Math.ceil(mcFilteredEntries().length / 9) - 5);
}

function mcIconFor(entry) {
  const key = `${entry.type}:${entry.id}`;
  if (mcUI.icons.has(key)) return mcUI.icons.get(key);
  mcUI.icons.set(key, null);
  if (entry.type === 'block') {
    creativeBlockIcon3DCanvas(entry.id).then(canvas => {
      if (canvas) { mcUI.icons.set(key, canvas); mcRequestRender(); }
    });
    creativeBlockIconCanvas(entry.id).then(canvas => {
      if (canvas && !mcUI.icons.get(key)) { mcUI.icons.set(key, canvas); mcRequestRender(); }
    });
  }
  creativeIconUrl(entry.id, entry.type).then(url => {
    if (!url) return;
    loadImage(url).then(img => {
      if (!mcUI.icons.get(key)) { mcUI.icons.set(key, img); mcRequestRender(); }
    }).catch(() => {});
  });
  return null;
}

function mcDrawIcon(ctx, entry, x, y, size = 16) {
  const icon = mcIconFor(entry);
  if (!icon) return;
  ctx.drawImage(icon, x, y, size, size);
}

let mcRenderQueued = false;
function mcRequestRender() {
  if (mcRenderQueued || !mcUI.open) return;
  mcRenderQueued = true;
  requestAnimationFrame(() => {
    mcRenderQueued = false;
    mcRender();
  });
}

function mcResize() {
  const canvas = document.getElementById('creativeCanvas');
  if (!canvas) return { canvas: null, ctx: null, layout: null, wrapW: 0, wrapH: 0 };
  const layout = mcScreenLayout();
  const logicalW = Math.max(195, layout.width) + 8;
  const logicalH = layout.height + 64;
  const scale = mcUI.scale;
  canvas.width = Math.round(logicalW * scale);
  canvas.height = Math.round(logicalH * scale);
  canvas.style.width = `${canvas.width}px`;
  canvas.style.height = `${canvas.height}px`;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.imageSmoothingEnabled = false;
  return { canvas, ctx, layout, logicalW, logicalH };
}

function mcRender() {
  if (!mcUI.open) return;
  const state = mcResize();
  const { canvas, ctx, layout } = state;
  if (!canvas) return;
  const tab = mcSelectedTab();
  const type = tab?.type;
  const panelX = 4;
  const panelY = 32;
  const isInventory = type === 'INVENTORY';
  const bgPath = isInventory
    ? 'textures/gui/container/inventory.png'
    : type === 'SEARCH'
      ? 'textures/gui/container/creative_inventory/tab_item_search.png'
      : 'textures/gui/container/creative_inventory/tab_items.png';
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const bg = mcImage(bgPath);
  if (bg) ctx.drawImage(bg, 0, 0, layout.width, layout.height, panelX, panelY, layout.width, layout.height);

  // Tab bodies and icons.
  for (const rect of mcTabRects(layout)) {
    const selected = rect.tab.name === creativeCategory;
    const top = rect.tab.row !== 'BOTTOM';
    const suffix = `${top ? 'top' : 'bottom'}_${selected ? 'selected' : 'unselected'}_${Math.min(7, rect.tab.column + 1)}`;
    const sprite = mcImage(`textures/gui/sprites/container/creative_inventory/tab_${suffix}.png`);
    if (sprite) ctx.drawImage(sprite, 0, 0, 26, 32, panelX + rect.x, panelY + rect.y, 26, 32);
    mcDrawIcon(ctx, { id: rect.tab.icon || 'stone', type: mcEntryType(rect.tab.icon || 'stone') }, panelX + rect.x + 5, panelY + rect.y + (top ? 9 : 7), 16);
  }

  if (type !== 'INVENTORY') {
    mcText(ctx, tab?.name || '', panelX + layout.title.x, panelY + layout.title.y, '#404040', 1);
  }

  if (isInventory) {
    const player = document.getElementById('inventoryPlayer');
    if (player) {
      player.dataset.ready = '0';
      renderInventoryPlayer();
      if (layout.player) {
        ctx.drawImage(player, 0, 0, 64, 86, panelX + layout.player.x, panelY + layout.player.y, layout.player.w, layout.player.h);
      }
    }
  } else {
    const entries = mcFilteredEntries();
    const maxRow = Math.max(0, Math.ceil(entries.length / 9) - 5);
    mcUI.page = Math.max(0, Math.min(Math.round(mcUI.page), maxRow));
    for (let i = 0; i < 45; i++) {
      const entry = entries[mcUI.page * 9 + i];
      if (!entry) continue;
      const col = i % 9, row = Math.floor(i / 9);
      const x = panelX + layout.grid.x + col * layout.grid.slot + 1;
      const y = panelY + layout.grid.y + row * layout.grid.slot + 1;
      mcDrawIcon(ctx, entry, x, y, 16);
    }
    for (let i = 0; i < 9; i++) {
      const item = creativeHotbar[i];
      if (!item) continue;
      mcDrawIcon(ctx, item, panelX + layout.hotbar.x + i * layout.hotbar.slot + 1, panelY + layout.hotbar.y + 1, 16);
    }
    if (layout.scroll) {
      const canScroll = maxRow > 0;
      const thumb = canScroll ? mcImage('textures/gui/sprites/container/creative_inventory/scroller.png') : null;
      if (thumb) {
        const travel = layout.scroll.h - layout.scroll.thumb;
        const offset = maxRow ? (mcUI.page / maxRow) * travel : 0;
        ctx.drawImage(thumb, 0, 0, 12, 15,
          panelX + layout.scroll.x, panelY + layout.scroll.y + offset, 12, 15);
      }
    }
    if (type === 'SEARCH') {
      mcText(ctx, mcUI.search, panelX + layout.search.x + 2, panelY + layout.search.y + 1, '#ffffff', 1);
    }
  }

  const hover = mcUI.hover;
  if (hover?.entry) {
    const hx = panelX + hover.x + 1, hy = panelY + hover.y + 1;
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillRect(hx, hy, 16, 16);
    const label = hover.entry.id.replace(/_/g, ' ');
    const tw = mcMeasureText(label, 1);
    const tx = panelX + mcUI.mouse.x + 10, ty = panelY + mcUI.mouse.y + 10;
    ctx.fillStyle = 'rgba(16,0,16,0.94)';
    ctx.fillRect(tx - 3, ty - 3, tw + 6, 14);
    ctx.strokeStyle = '#2d0a63'; ctx.strokeRect(tx - 3.5, ty - 3.5, tw + 7, 15);
    mcText(ctx, label, tx, ty, '#ffffff', 1);
  }

  if (mcUI.carried) {
    const entry = { id: mcUI.carried.id, type: mcUI.carried.type };
    const x = panelX + mcUI.mouse.x + 8, y = panelY + mcUI.mouse.y + 8;
    mcDrawIcon(ctx, entry, x, y, 16);
    if (mcUI.carried.count > 1) {
      mcText(ctx, String(mcUI.carried.count), x + 10, y + 8, '#ffffff', 1);
    }
  }

  const searchInput = document.getElementById('creativeSearchInput');
  if (searchInput) {
    if (type === 'SEARCH' && layout.search) {
      searchInput.style.display = 'block';
      searchInput.style.left = `${(panelX + layout.search.x) * mcUI.scale}px`;
      searchInput.style.top = `${(panelY + layout.search.y) * mcUI.scale}px`;
      searchInput.style.width = `${layout.search.w * mcUI.scale}px`;
      searchInput.style.height = `${layout.search.h * mcUI.scale}px`;
      searchInput.style.pointerEvents = 'auto';
    } else {
      searchInput.style.display = 'none';
      searchInput.style.pointerEvents = 'none';
    }
  }
}

function mcHitSlot(x, y) {
  const panelX = 4, panelY = 32;
  const layout = mcScreenLayout();
  if (!layout.grid || x < panelX || y < panelY) return null;
  const lx = x - panelX, ly = y - panelY;
  for (let row = 0; row < 5; row++) {
    for (let col = 0; col < 9; col++) {
      const sx = layout.grid.x + col * layout.grid.slot;
      const sy = layout.grid.y + row * layout.grid.slot;
      if (lx >= sx && lx < sx + 18 && ly >= sy && ly < sy + 18) {
        const idx = mcUI.page * 9 + row * 9 + col;
        const entry = mcFilteredEntries()[idx];
        return entry ? { kind: 'creative', entry, x: sx, y: sy, index: idx } : null;
      }
    }
  }
  for (let i = 0; i < 9; i++) {
    const sx = layout.hotbar.x + i * layout.hotbar.slot;
    const sy = layout.hotbar.y;
    if (lx >= sx && lx < sx + 18 && ly >= sy && ly < sy + 18) return { kind: 'hotbar', index: i, x: sx, y: sy, entry: creativeHotbar[i] };
  }
  return null;
}

function mcClickSlot(slot, button) {
  if (!slot) return;
  if (slot.kind === 'hotbar') {
    if (mcUI.carried) {
      creativeHotbar[slot.index] = { id: mcUI.carried.id, type: mcUI.carried.type };
      creativeSlot = slot.index;
      mcUI.carried = null;
      renderCreativeHotbar();
    } else {
      creativeSlot = slot.index;
    }
  } else if (slot.kind === 'creative') {
    if (!mcUI.carried) mcUI.carried = { id: slot.entry.id, type: slot.entry.type, count: 1 };
    else if (mcUI.carried.id === slot.entry.id && mcUI.carried.type === slot.entry.type) {
      mcUI.carried.count = button === 0 ? Math.min(64, mcUI.carried.count + 1) : Math.max(1, mcUI.carried.count - 1);
    } else mcUI.carried = { id: slot.entry.id, type: slot.entry.type, count: 1 };
  }
  mcRequestRender();
}

function mcPointer(event) {
  const canvas = document.getElementById('creativeCanvas');
  if (!canvas) return null;
  const rect = canvas.getBoundingClientRect();
  const logicalW = canvas.width / mcUI.scale;
  const logicalH = canvas.height / mcUI.scale;
  return {
    x: (event.clientX - rect.left) / rect.width * logicalW,
    y: (event.clientY - rect.top) / rect.height * logicalH,
  };
}

function mcOnPointerMove(event) {
  if (!mcUI.open) return;
  const p = mcPointer(event);
  if (!p) return;
  mcUI.mouse.x = p.x - 4;
  mcUI.mouse.y = p.y - 32;
  const layout = mcScreenLayout();
  const hit = mcHitSlot(p.x, p.y);
  mcUI.hover = hit;
  const overTab = mcTabRects(layout).some(r => p.x >= 4 + r.x && p.x < 4 + r.x + r.w && p.y >= 32 + r.y && p.y < 32 + r.y + r.h);
  const overPanel = p.x >= 4 && p.x < 4 + layout.width && p.y >= 32 && p.y < 32 + layout.height;
  canvasCursor(overTab ? 'pointer' : 'default');
  mcRequestRender();
}

function canvasCursor(cursor) {
  const canvas = document.getElementById('creativeCanvas');
  if (canvas) canvas.style.cursor = cursor;
}

function mcOnPointerDown(event) {
  if (!mcUI.open) return;
  const p = mcPointer(event);
  if (!p) return;
  const layout = mcScreenLayout();
  for (const rect of mcTabRects(layout)) {
    if (p.x >= 4 + rect.x && p.x < 4 + rect.x + rect.w && p.y >= 32 + rect.y && p.y < 32 + rect.y + rect.h) {
      creativeCategory = rect.tab.name;
      mcUI.page = 0;
      mcUI.search = '';
      const input = document.getElementById('creativeSearchInput');
      if (input) input.value = '';
      mcRender();
      if (rect.tab.type === 'SEARCH') {
        const si = document.getElementById('creativeSearchInput');
        if (si) { si.style.display = 'block'; si.focus(); }
      }
      return;
    }
  }
  if (layout.scroll && p.x >= 4 + layout.scroll.x && p.x < 4 + layout.scroll.x + layout.scroll.w && p.y >= 32 + layout.scroll.y && p.y < 32 + layout.scroll.y + layout.scroll.h) {
    mcUI.draggingScroll = true;
    mcUpdateScrollFromPointer(p);
    return;
  }
  const slot = mcHitSlot(p.x, p.y);
  if (slot) { mcClickSlot(slot, event.button); return; }
  if (mcUI.carried && (p.x < 4 || p.y < 32 || p.x >= 4 + layout.width || p.y >= 32 + layout.height)) {
    mcUI.carried = null;
    mcRequestRender();
  }
}

function mcUpdateScrollFromPointer(p) {
  const layout = mcScreenLayout();
  const maxRow = mcRows();
  if (!layout.scroll || maxRow <= 0) return;
  const ratio = Math.max(0, Math.min(1, (p.y - 32 - layout.scroll.y - 7.5) / Math.max(1, layout.scroll.h - 15)));
  mcUI.page = Math.round(ratio * maxRow);
  mcRequestRender();
}

function mcOnPointerUp() { mcUI.draggingScroll = false; }

function mcOnWheel(event) {
  if (!mcUI.open) return;
  const layout = mcScreenLayout();
  if (!layout.scroll) return;
  event.preventDefault();
  const maxRow = mcRows();
  mcUI.page = Math.max(0, Math.min(maxRow, mcUI.page + (event.deltaY > 0 ? 1 : -1)));
  mcRequestRender();
}

function mcOnSearchInput(event) {
  mcUI.search = event.target.value || '';
  mcUI.page = 0;
  mcRequestRender();
}

function mcAutoGuiScale() {
  return Math.max(1, Math.min(4,
    Math.floor(window.innerWidth / 320),
    Math.floor(window.innerHeight / 240)));
}

function mcResolveGuiScale(value) {
  if (value === 'auto' || value == null) return mcAutoGuiScale();
  const n = Number(value);
  return Number.isFinite(n) ? Math.max(1, Math.min(4, n)) : mcAutoGuiScale();
}

function mcOpen() {
  if (!document.getElementById('creativeCanvas')) return;
  mcUI.open = true;
  creativeInventoryOpen = true;
  mcUI.page = 0;
  mcUI.search = '';
  mcUI.carried = null;
  mcUI.hover = null;
  const overlay = document.getElementById('inventoryOverlay');
  if (overlay) { overlay.classList.add('open'); overlay.setAttribute('aria-hidden', 'false'); }
  document.body.classList.add('inventory-open');
  document.exitPointerLock?.();
  const input = document.getElementById('creativeSearchInput');
  if (input) input.value = '';
  mcRender();
}

function mcClose() {
  mcUI.open = false;
  creativeInventoryOpen = false;
  mcUI.carried = null;
  mcUI.hover = null;
  const overlay = document.getElementById('inventoryOverlay');
  if (overlay) { overlay.classList.remove('open'); overlay.setAttribute('aria-hidden', 'true'); }
  document.body.classList.remove('inventory-open');
}

openCreativeInventory = function() { mcOpen(); };
closeCreativeInventory = function() { mcClose(); };
initCreativeUI = function() {
  mcUI.scale = mcResolveGuiScale(CONFIG?.ui?.creativeGuiScale);
  const canvas = document.getElementById('creativeCanvas');
  if (!canvas) return;
  canvas.addEventListener('pointermove', mcOnPointerMove);
  canvas.addEventListener('pointerdown', mcOnPointerDown);
  window.addEventListener('pointerup', mcOnPointerUp);
  canvas.addEventListener('wheel', mcOnWheel, { passive: false });
  const input = document.getElementById('creativeSearchInput');
  if (input) input.addEventListener('input', mcOnSearchInput);
  window.setCreativeGuiScale = (scale, persist = false) => {
    mcUI.scale = mcResolveGuiScale(scale);
    if (persist) { try { localStorage.setItem('viewerCreativeGuiScale', String(scale)); } catch {} }
    renderCreativeHotbar();
    mcRender();
  };
  window.setCreativeGuiScaleMode = (value) => {
    mcUI.scale = mcResolveGuiScale(value);
    renderCreativeHotbar();
    mcRender();
  };
  window.addEventListener('resize', () => {
    if (!mcUI.open) return;
    if (CONFIG?.ui?.creativeGuiScale === 'auto') mcUI.scale = mcAutoGuiScale();
    renderCreativeHotbar();
    mcRender();
  });
  window.openCreativeInventory = openCreativeInventory;
  window.closeCreativeInventory = closeCreativeInventory;
  window.isCreativeInventoryOpen = () => mcUI.open;
  window.selectCreativeTab = (name) => {
    creativeCategory = name;
    mcUI.page = 0;
    mcUI.search = '';
    const si = document.getElementById('creativeSearchInput');
    if (si) si.value = '';
    mcRender();
  };
  window.addEventListener('keydown', (event) => {
    if (!mcUI.open) return;
    if (event.code === 'Escape' || event.code === 'KeyE') {
      event.preventDefault(); event.stopPropagation(); mcClose(); return;
    }
    if (/^Digit[1-9]$/.test(event.code) && event.target !== input) {
      creativeSlot = Number(event.code.slice(5)) - 1;
      renderCreativeHotbar();
      mcRequestRender();
    }
  }, true);
  // HUD hotbar listeners are created by its own renderer.
  renderCreativeHotbar();
}

renderCreativeTabs = function() { mcRequestRender(); };
renderCreativeInventory = function() { mcRequestRender(); };
updateCreativePanelBackground = function() { mcRequestRender(); };
setCreativeGuiScale = function(scale, persist = false) { window.setCreativeGuiScale?.(scale, persist); };

window.__collisionProbe = async (id, props = {}) => {
  const key = await blockStateKey(id, props);
  return { key, state: blockCollisionStates[key] ?? null };
};

window.__collisionDump = () => ({
  solids: [...collisionSolids],
  partials: [...collisionPartials.entries()],
  player: { x: player.pos.x, y: player.pos.y, z: player.pos.z, height: player.height, onGround: player.onGround },
});

window.__playerCollides = (x, y, z, height) => playerCollidesAt(x, y, z, height ?? player.height);


(async () => {
  const sha = await fetchLatestCommitSha();
  ASSET_BASE = `https://raw.githubusercontent.com/${REPO}/${sha}/minecraft`;
  REPO_BASE = `https://raw.githubusercontent.com/${REPO}/${sha}`;
  console.log('Asset base:', ASSET_BASE);
  await loadConfig();
  initHeightMapResolution();
  initHeightmapToggle();
  initReflectionStrength();
  initReflectionToggle();
  initFlatReflections();
  initPlayerController();
  initCreativeUI();
  await setupSky();
  await setupCelestialBodies();
  await setupStars();
  loadCommandsFromStorage();
  build();
  animate();
})();
</script>
</body>
