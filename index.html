function mergeConfig(defaults, loaded) {
  const out = {};
  for (const section in defaults) {
    if (typeof defaults[section] === 'object' && !Array.isArray(defaults[section])) {
      out[section] = { ...defaults[section], ...(loaded?.[section] || {}) };
    } else {
      out[section] = loaded?.[section] ?? defaults[section];
    }
  }
  for (const section in (loaded || {})) if (!out[section]) out[section] = loaded[section];
  return out;
}

async function mapWithConcurrency(items, limit, fn) {
  const results = new Array(items.length);
  const errors = [];
  let next = 0;
  async function worker() {
    while (true) {
      const i = next++;
      if (i >= items.length) return;
      try { results[i] = await fn(items[i], i); }
      catch (err) { errors.push({ index: i, item: items[i], error: err }); }
    }
  }
  const poolSize = Math.max(1, Math.min(limit, items.length));
  const workers = [];
  for (let i = 0; i < poolSize; i++) workers.push(worker());
  await Promise.all(workers);
  return { results, errors };
}

async function loadConfig() {
  try {
    const res = await fetch(`${REPO_BASE}/viewer/config.json`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const loaded = await res.json();
    CONFIG = mergeConfig(CONFIG_DEFAULTS, loaded);
    console.log('Viewer config loaded from repo');
  } catch (err) {
    console.warn('Viewer config not found, using defaults:', err);
    CONFIG = mergeConfig(CONFIG_DEFAULTS, {});
  }
  if (CONFIG.dayCycle.cycleSeconds == null) {
    CONFIG.dayCycle.cycleSeconds = CONFIG.sky.stateCount * CONFIG.sky.stateDuration;
  }
  CONFIG.dayCycle.startAngleRadians = Math.PI * CONFIG.dayCycle.startAnglePi;
  CONFIG.lighting.sunColorObj = new THREE.Color(CONFIG.lighting.sunColor);
  CONFIG.lighting.moonColorObj = new THREE.Color(CONFIG.lighting.moonColor);
  console.log('Effective config:', CONFIG);
}

async function fetchLatestCommitSha() {
  const cached = localStorage.getItem(SHA_KEY);
  if (cached) { console.log('Using cached SHA:', cached); return cached; }
  try {
    const res = await fetch(`https://api.github.com/repos/${REPO}/commits/${BRANCH}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    localStorage.setItem(SHA_KEY, data.sha);
    return data.sha;
  } catch (err) { console.warn('SHA fetch failed', err); return BRANCH; }
}

/* ============================= REFLECTIONS ============================= */

/* A 128px cube probe rendered from the player's eye. Reflective block
 * materials sample it with Three's built-in Lambert envMap path; the toggle
 * only changes reflectivity and stops/starts the six-face captures. */
const REFLECTION_TEXTURE_SIZE = 128;
const REFLECTION_INTERVAL = 0.35;
function createReflectionTarget() {
  const target = new THREE.WebGLCubeRenderTarget(REFLECTION_TEXTURE_SIZE);
  target.texture.generateMipmaps = false;
  target.texture.minFilter = THREE.LinearFilter;
  target.texture.magFilter = THREE.LinearFilter;
  return target;
}
/* Two cube targets ping-pong: the scene is captured into one while materials
 * still sample the other, which avoids a WebGL feedback loop now that every
 * block material reflects. */
const reflectionTargetA = createReflectionTarget();
const reflectionTargetB = createReflectionTarget();
const reflectionCamera = new THREE.CubeCamera(0.1, 3000, reflectionTargetA);
scene.add(reflectionCamera);
let reflectionTexture = reflectionTargetA.texture;
let reflectionWriteTarget = reflectionTargetB;

/* Sun/moon are captured separately and more often than the sky, so their
 * movement does not force a sky probe update. */
const CELESTIAL_INTERVAL = 0.1;
const celestialTargetA = createReflectionTarget();
const celestialTargetB = createReflectionTarget();
const celestialCamera = new THREE.CubeCamera(0.1, 3000, celestialTargetA);
scene.add(celestialCamera);
let celestialTexture = celestialTargetA.texture;
let celestialWriteTarget = celestialTargetB;
let celestialTimer = 0;
let celestialDirty = true;
const REFLECTION_STORAGE_KEY = 'voxelBuilderReflectionsEnabled';
const REFLECTION_STRENGTH_KEY = 'voxelBuilderReflectionStrength';
const REFLECTION_MODE_KEY = 'voxelBuilderReflectionMode';
const DEFAULT_REFLECTION_STRENGTH = 0.2;
let reflectionMode = 'off';
let reflectionsEnabled = false;
let reflectionStrengthScale = 0.5;
let reflectionTimer = 0;
let reflectionDirty = true;

/* A fully white 1x1 mask for translucent surfaces: the whole side reflects. */
const fullReflectionMask = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1, THREE.RGBAFormat);
fullReflectionMask.needsUpdate = true;
fullReflectionMask.colorSpace = THREE.NoColorSpace;

/* Per-pixel mask made from the albedo alpha channel. Transparent cutout pixels
 * do not reflect; opaque pixels do. The map is built on the same canvas as the
 * texture layout, including animated frame strips. */
function createAlphaMaskTexture(image, frameCount) {
  const canvas = document.createElement('canvas');
  canvas.width = image.width;
  canvas.height = image.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(image, 0, 0);
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = img.data;
  for (let i = 0; i < data.length; i += 4) {
    const alpha = data[i + 3];
    data[i] = alpha;
    data[i + 1] = alpha;
    data[i + 2] = alpha;
    data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);

  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.NoColorSpace;
  if (frameCount > 1) tex.repeat.set(1, 1 / frameCount);
  return tex;
}

/* ============================= JAVA-COMPATIBLE RNG ============================= */

class JavaRandom {
  constructor(seed) { this.seed = (BigInt(seed) ^ 0x5DEECE66Dn) & 0xFFFFFFFFFFFFn; }
  next(bits) {
    this.seed = (this.seed * 0x5DEECE66Dn + 0xBn) & 0xFFFFFFFFFFFFn;
    return Number(this.seed >> BigInt(48 - bits));
  }
  nextFloat() { return this.next(24) / (1 << 24); }
  nextDouble() {
    const high = this.next(26);
    const low = this.next(27);
    return (high * Math.pow(2, 27) + low) / Math.pow(2, 53);
  }
}

/* ============================= SHADER LOADING ============================= */

async function loadShaderFile(relPath) {
  if (shaderSourceCache.has(relPath)) return shaderSourceCache.get(relPath);
  const url = `${ASSET_BASE}/shaders/${relPath}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Shader not found: ${relPath} (${res.status})`);
  const text = await res.text();
  shaderSourceCache.set(relPath, text);
  return text;
}

async function loadPlainShader(vshPath, fshPath, uniforms, options = {}) {
  const [vsh, fsh] = await Promise.all([loadShaderFile(vshPath), loadShaderFile(fshPath)]);
  return new THREE.ShaderMaterial({ uniforms, vertexShader: vsh, fragmentShader: fsh, ...options });
}

/* ============================= SKY ============================= */

async function loadSkyTexture() {
  const url = `${ASSET_BASE}/textures/environment/sky.png`;
  return new Promise((resolve) => {
    new THREE.TextureLoader().load(url, (tex) => {
      tex.magFilter = THREE.LinearFilter;
      tex.minFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = THREE.MirroredRepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      resolve(tex);
    }, undefined, () => { showError(`Sky texture missing: ${url}`); resolve(magentaTex); });
  });
}

async function setupSky() {
  skyTexture = await loadSkyTexture();
  skyMaterial = await loadPlainShader('viewer/sky.vsh', 'viewer/sky.fsh', {
    skyTexture: { value: skyTexture },
    currentState: { value: 0.0 },
    nextState: { value: 1.0 },
    blend: { value: 0.0 },
    stateCount: { value: CONFIG.sky.stateCount },
    brightness: { value: CONFIG.sky.brightness },
    saturation: { value: CONFIG.sky.saturation },
  }, { side: THREE.BackSide, depthWrite: false, depthTest: false });

  const skyGeometry = new THREE.SphereGeometry(800, 64, 32, 0, Math.PI * 2, 0, Math.PI);
  skyMesh = new THREE.Mesh(skyGeometry, skyMaterial);
  skyMesh.renderOrder = -10;
  skyMesh.frustumCulled = false;
  scene.add(skyMesh);
}

/* ============================= SUN AND MOON ============================= */

function loadCelestialTexture(path) {
  const url = `${ASSET_BASE}/textures/${path}`;
  return new Promise((resolve, reject) => {
    new THREE.TextureLoader().load(url, (tex) => {
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      tex.generateMipmaps = false;
      tex.colorSpace = THREE.SRGBColorSpace;
      resolve(tex);
    }, undefined, () => reject(new Error(url)));
  });
}

async function makeCelestialMaterial(texture) {
  return loadPlainShader('viewer/celestial.vsh', 'viewer/celestial.fsh',
    { tex: { value: texture } },
    {
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true,
      side: THREE.DoubleSide,
    });
}

async function setupCelestialBodies() {
  if (CONFIG.sun.enabled) {
    try {
      const sunTex = await loadCelestialTexture(CONFIG.sun.texturePath);
      const geo = new THREE.PlaneGeometry(CONFIG.sun.size, CONFIG.sun.size);
      sunMesh = new THREE.Mesh(geo, await makeCelestialMaterial(sunTex));
      sunMesh.renderOrder = 0; sunMesh.frustumCulled = false;
      scene.add(sunMesh);
    } catch (err) { showError(`Sun texture missing: ${CONFIG.sun.texturePath}`); }
  }
  if (CONFIG.moon.enabled) {
    moonTextures = new Array(CONFIG.moon.phaseFiles.length).fill(null);
    for (let i = 0; i < CONFIG.moon.phaseFiles.length; i++) {
      try { moonTextures[i] = await loadCelestialTexture(CONFIG.moon.phaseFiles[i]); }
      catch (err) { showError(`Moon texture missing: ${CONFIG.moon.phaseFiles[i]}`); }
    }
    const startIndex = ((CONFIG.moon.startingPhase % CONFIG.moon.phaseFiles.length) + CONFIG.moon.phaseFiles.length) % CONFIG.moon.phaseFiles.length;
    const startTex = moonTextures[startIndex] || magentaTex;
    currentMoonPhaseIndex = startIndex;
    const geo = new THREE.PlaneGeometry(CONFIG.moon.size, CONFIG.moon.size);
    moonMesh = new THREE.Mesh(geo, await makeCelestialMaterial(startTex));
    moonMesh.renderOrder = 0; moonMesh.frustumCulled = false;
    scene.add(moonMesh);
  }
}

/* ============================= STARS ============================= */

function buildStarGeometry() {
  const posRng = new JavaRandom(10842);
  const attrRng = new JavaRandom(1337);
  const positions = [], opacities = [], phases = [], indices = [];
  let vertIndex = 0;
  const posScale = CONFIG.stars.distance / 100;
  const quadScale = posScale * (CONFIG.stars.sizeScale / 0.001);

  for (let i = 0; i < CONFIG.stars.attempts; i++) {
    let d0 = posRng.nextFloat() * 2 - 1;
    let d1 = posRng.nextFloat() * 2 - 1;
    let d2 = posRng.nextFloat() * 2 - 1;
    const d3 = 0.15 + posRng.nextFloat() * 0.1;
    let d4 = d0 * d0 + d1 * d1 + d2 * d2;
    if (d4 < 1.0 && d4 > 0.01) {
      d4 = 1.0 / Math.sqrt(d4);
      d0 *= d4; d1 *= d4; d2 *= d4;
      const d5 = d0 * 100, d6 = d1 * 100, d7 = d2 * 100;
      const d8 = Math.atan2(d0, d2);
      const d9 = Math.sin(d8), d10 = Math.cos(d8);
      const d11 = Math.atan2(Math.sqrt(d0 * d0 + d2 * d2), d1);
      const d12 = Math.sin(d11), d13 = Math.cos(d11);
      const d14 = posRng.nextDouble() * Math.PI * 2;
      const d15 = Math.sin(d14), d16 = Math.cos(d14);
      const starOpacity = CONFIG.stars.opacityMin + attrRng.nextFloat() * (CONFIG.stars.opacityMax - CONFIG.stars.opacityMin);
      const starPhase = attrRng.nextFloat() * Math.PI * 2;
      for (let j = 0; j < 4; j++) {
        const d18 = ((j & 2) - 1) * d3;
        const d19 = ((j + 1 & 2) - 1) * d3;
        const d21 = d18 * d16 - d19 * d15;
        const d22 = d19 * d16 + d18 * d15;
        const d23 = d21 * d12;
        const d24 = -d21 * d13;
        const d25 = d24 * d9 - d22 * d10;
        const d26 = d22 * d9 + d24 * d10;
        positions.push(
          d5 * posScale + d25 * quadScale,
          d6 * posScale + d23 * quadScale,
          d7 * posScale + d26 * quadScale
        );
        opacities.push(starOpacity);
        phases.push(starPhase);
      }
      indices.push(vertIndex, vertIndex + 1, vertIndex + 2, vertIndex, vertIndex + 2, vertIndex + 3);
      vertIndex += 4;
    }
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geom.setAttribute('starOpacity', new THREE.Float32BufferAttribute(opacities, 1));
  geom.setAttribute('starPhase', new THREE.Float32BufferAttribute(phases, 1));
  geom.setIndex(indices);
  console.log(`Generated ${vertIndex / 4} stars`);
  return geom;
}

async function setupStars() {
  if (!CONFIG.stars.enabled) return;
  const starGeometry = buildStarGeometry();
  const starMaterial = await loadPlainShader('viewer/stars.vsh', 'viewer/stars.fsh', {
    uTime: { value: 0 },
    uNight: { value: 0 },
    uBlinkSpeed: { value: CONFIG.stars.blinkSpeed },

  }, {

  starContainer.add(starMesh);

}

/* ============================= MINECRAFT SHADER PIPELINE ============================= */

async function preprocessShader(source, depth = 0, importedSet = null) {
  if (depth > 10) return '// #moj_import recursion limit';
  if (!importedSet) importedSet = new Set();
  const output = [];
  for (const line of source.split('\n')) {
    const m = line.match(/^\s*#moj_import\s*<([^>]+)>/);
    if (m) {
      let ref = m[1].replace(/^minecraft:/, '');
      if (importedSet.has(ref)) continue;
      importedSet.add(ref);
      try {
        const included = await loadShaderFile(`include/${ref}`);
        output.push(await preprocessShader(included, depth + 1, importedSet));
      } catch (e) { output.push(`// [include failed: ${ref}]`); }
    } else output.push(line);
  }
  return output.join('\n');
}

function injectDefines(source, defines) {
  if (!defines || Object.keys(defines).length === 0) return source;
  return Object.entries(defines).map(([k, v]) => `#define ${k} ${v}`).join('\n') + '\n' + source;
}

function stripShaderPreamble(source) {
  return source
    .replace(/^[ \t]*#version[ \t]+\d+([ \t]+\w+)?[ \t]*\r?\n?/gm, '')
    .replace(/^[ \t]*precision[ \t]+(lowp|mediump|highp)[ \t]+(float|int)[ \t]*;[ \t]*\r?\n?/gm, '');
}

function stripUBOs(source) {
  let s = source, changed = true;
  while (changed) {
    changed = false;
    let next = s.replace(/layout\s*\([^)]*\)/g, '');
    if (next !== s) { s = next; changed = true; }
    next = s.replace(/\(\s*(?:std140|std430|location(?:\s*=\s*\d+)?|binding(?:\s*=\s*\d+)?|set(?:\s*=\s*\d+)?|push_constant)\s*\)/g, '');
    if (next !== s) { s = next; changed = true; }
    next = s.replace(/uniform\s+(?:\w+\s+)?\{[^}]*\}\s*\w*\s*;?/g, '');
    if (next !== s) { s = next; changed = true; }
  }
  return s;
}

function normalizeShaderSource(source, isVertex) {
  let s = stripUBOs(source);
  s = s.replace(/\bModelViewMat\b/g, 'modelViewMatrix');
  s = s.replace(/\bProjMat\b/g, 'projectionMatrix');
  s = s.replace(/^\s*uniform\s+mat4\s+(modelViewMatrix|projectionMatrix|modelMatrix|viewMatrix)\s*;\s*$/gm, '');
  s = s.replace(/^\s*uniform\s+mat3\s+normalMatrix\s*;\s*$/gm, '');
  s = s.replace(/^\s*uniform\s+vec3\s+cameraPosition\s*;\s*$/gm, '');
  s = s.replace(/^\s*uniform\s+vec4\s+ColorModulator\s*;\s*$/gm, '');
  s = s.replace(/^\s*uniform\s+vec3\s+ModelOffset\s*;\s*$/gm, '');
  s = s.replace(/^\s*uniform\s+mat4\s+TextureMat\s*;\s*$/gm, '');
  s = s.replace(/^\s*uniform\s+float\s+LineWidth\s*;\s*$/gm, '');
  if (isVertex) {
    s = s.replace(/\bin\s+vec3\s+Position\s*;/g, '');
    s = s.replace(/\bPosition\b/g, 'position');
    s = s.replace(/^\s*in\s+vec3\s+position\s*;\s*$/gm, '');
    s = s.replace(/^\s*in\s+vec3\s+normal\s*;\s*$/gm, '');
    s = s.replace(/^\s*in\s+vec2\s+uv\s*;\s*$/gm, '');
  }
  return s;
}

async function createMCShaderMaterial({
  vshPath, fshPath, defines = {}, textures = {}, uniforms = {},
  transparent = false, side = THREE.FrontSide,
}) {
  const key = vshPath + '|' + fshPath + '|' + JSON.stringify(defines);
  if (shaderMaterialCache.has(key)) return shaderMaterialCache.get(key);
  if (shaderMaterialPending.has(key)) return shaderMaterialPending.get(key);

  const p = (async () => {
    try {
      const [vshRaw, fshRaw] = await Promise.all([loadShaderFile(vshPath), loadShaderFile(fshPath)]);
      let vsh = await preprocessShader(vshRaw);
      let fsh = await preprocessShader(fshRaw);
      vsh = injectDefines(vsh, defines);
      fsh = injectDefines(fsh, defines);
      vsh = stripShaderPreamble(vsh);
      fsh = stripShaderPreamble(fsh);
      vsh = normalizeShaderSource(vsh, true);
      fsh = normalizeShaderSource(fsh, false);

      const commonHeader = `precision highp float;
precision highp int;
uniform mat4 modelViewMatrix;
uniform mat4 projectionMatrix;
uniform mat4 modelMatrix;
uniform mat4 viewMatrix;
uniform mat3 normalMatrix;
uniform vec3 cameraPosition;
uniform vec4 ColorModulator;
uniform vec3 ModelOffset;
uniform mat4 TextureMat;
uniform float LineWidth;
uniform vec4 FogColor;
uniform float FogEnvironmentalStart;
uniform float FogEnvironmentalEnd;
uniform float FogRenderDistanceStart;
uniform float FogRenderDistanceEnd;
uniform float FogSkyEnd;
uniform float FogCloudsEnd;
uniform float GameTime;
uniform ivec3 CameraBlockPos;
uniform vec3 CameraOffset;
`;
      const vertexShader = commonHeader + `in vec3 position;\nin vec3 normal;\nin vec2 uv;\n` + vsh;
      const fragmentShader = commonHeader + fsh;

      const finalUniforms = {
        modelViewMatrix: { value: new THREE.Matrix4() },
        projectionMatrix: { value: new THREE.Matrix4() },
        modelMatrix: { value: new THREE.Matrix4() },
        viewMatrix: { value: new THREE.Matrix4() },
        normalMatrix: { value: new THREE.Matrix3() },
        cameraPosition: { value: new THREE.Vector3() },
        ColorModulator: { value: new THREE.Vector4(1, 1, 1, 1) },
        ModelOffset: { value: new THREE.Vector3(0, 0, 0) },
        TextureMat: { value: new THREE.Matrix4() },
        LineWidth: { value: 1.0 },
        GameTime: { value: 0 },
        FogColor: { value: new THREE.Vector4(0, 0, 0, 1) },
        FogEnvironmentalStart: { value: 0.0 },
        FogEnvironmentalEnd: { value: 1000.0 },
        FogRenderDistanceStart: { value: 200.0 },
        FogRenderDistanceEnd: { value: 1000.0 },
        FogSkyEnd: { value: 1000.0 },
        FogCloudsEnd: { value: 1000.0 },
        CameraBlockPos: { value: new THREE.Vector3(0, 0, 0) },
        CameraOffset: { value: new THREE.Vector3(0, 0, 0) },
        ...uniforms,
      };
      for (const [k, v] of Object.entries(textures)) finalUniforms[k] = { value: v };

      const material = new THREE.RawShaderMaterial({
        vertexShader, fragmentShader, uniforms: finalUniforms, transparent, side,
        glslVersion: THREE.GLSL3,
      });
      material.onBeforeRender = function (renderer, scene, camera, geometry, object) {
        const u = this.uniforms;
        u.modelViewMatrix.value.multiplyMatrices(camera.matrixWorldInverse, object.matrixWorld);
        u.projectionMatrix.value.copy(camera.projectionMatrix);
        u.modelMatrix.value.copy(object.matrixWorld);
        u.viewMatrix.value.copy(camera.matrixWorldInverse);
        u.normalMatrix.value.getNormalMatrix(u.modelViewMatrix.value);
        u.cameraPosition.value.setFromMatrixPosition(camera.matrixWorld);
      };
      if (!timeUniforms.find(t => t.uniformRef === finalUniforms.GameTime)) {
        timeUniforms.push({ uniformRef: finalUniforms.GameTime, speed: 20 });
      }
      shaderMaterialCache.set(key, material);
      return material;
    } catch (err) {
      showError(`Shader setup failed (${vshPath}): ${err.message}`);
      console.error(err);
      const fallbackTex = textures.Sampler0 || textures.Sampler1 || magentaTex;
      return new THREE.MeshBasicMaterial({ map: fallbackTex, transparent, side });
    } finally {
      shaderMaterialPending.delete(key);
    }
  })();

  shaderMaterialPending.set(key, p);
  return p;
}

/* ============================= TEXTURE LOADING ============================= */

function getTexture(texPath) {
  const cleanPath = texPath.replace('minecraft:', '');
  const url = `${ASSET_BASE}/textures/${cleanPath}.png`;
  if (textureCache.has(url)) return textureCache.get(url);
  const tex = new THREE.TextureLoader().load(url, (loadedTex) => {
    const image = loadedTex.image;
    if (!image || !image.width || !image.height) return;

    let frameCount = 1;
    if (image.height > image.width && image.height % image.width === 0) {
      frameCount = image.height / image.width;
      loadedTex.repeat.set(1, 1 / frameCount);
      loadedTex.userData = {
        ...(loadedTex.userData || {}),
        frameCount, currentFrame: 0, timer: 0, frameDuration: 0.1,
      };
      if (!animatedTextures.includes(loadedTex)) animatedTextures.push(loadedTex);
    }

    try {
      const mask = createAlphaMaskTexture(image, frameCount);
      loadedTex.userData = { ...(loadedTex.userData || {}), reflectionMask: mask };
      for (const mat of blockMaterialCache.values()) {
        if (mat.map === loadedTex && !mat.transparent) mat.specularMap = mask;
      }
    } catch (err) {
      console.warn('Reflection mask failed for', url, err);
    }
  }, undefined, (err) => { showError(`Texture missing: ${url}`); textureCache.set(url, magentaTex); });
  tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
  tex.colorSpace = THREE.SRGBColorSpace; tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
  textureCache.set(url, tex);
  return tex;
}

/* ============================= PROCEDURAL HEIGHT MAPS ============================= */

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(`Failed ${url}`));
    img.src = url;
  });
}

const surfaceMapCache = new Map();
const surfaceMapPending = new Map();

function srgbToLinear(c) {
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}

/* Match opposite texture edges so the height field tiles across adjacent blocks. */
function makePeriodic(values, w, h) {
  for (let y = 0; y < h; y++) {
    const a = y * w, b = y * w + (w - 1);
    const mid = (values[a] + values[b]) * 0.5;
    values[a] = mid; values[b] = mid;
  }
  for (let x = 0; x < w; x++) {
    const a = x, b = (h - 1) * w + x;
    const mid = (values[a] + values[b]) * 0.5;
    values[a] = mid; values[b] = mid;
  }
}

function canvasTextureFromHeightFrames(frames, w, h, frameSize) {
  const frameCount = frames.length;
  const cols = Math.ceil(Math.sqrt(frameCount));
  const rows = Math.ceil(frameCount / cols);
  const canvas = document.createElement('canvas');
  canvas.width = frameSize * cols;
  canvas.height = frameSize * rows;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(canvas.width, canvas.height);
  // One square per animation frame, row-major. Nearest-neighbour expansion
  // keeps the 16x steps exact while giving the shader enough texels for a
  // crisp 1-pixel-wide bevel at screen resolution.
  for (let f = 0; f < frameCount; f++) {
    const values = frames[f];
    const col = f % cols;
    const row = Math.floor(f / cols);
    for (let y = 0; y < frameSize; y++) {
      const sy = Math.min(h - 1, Math.floor(y * h / frameSize));
      for (let x = 0; x < frameSize; x++) {
        const sx = Math.min(w - 1, Math.floor(x * w / frameSize));
        const v = Math.max(0, Math.min(255, Math.round(values[sy * w + sx] * 255)));
        const i = ((row * frameSize + y) * canvas.width + (col * frameSize + x)) * 4;
        // RTX convention: R = height, G = B = 0. Non-zero G/B would identify
        // the file as a normal map instead of a heightmap.
        img.data[i] = v;
        img.data[i + 1] = 0;
        img.data[i + 2] = 0;
        img.data[i + 3] = 255;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.NoColorSpace;
  tex.userData = { size: frameSize, frameSize, frameCount, cols, rows, width: canvas.width, height: canvas.height };
  return tex;
}

function heightFrameFromPixels(pixels, w, h, gamma, levels) {
  const colorLuminance = new Map();
  let transparent = 0;
  for (let i = 0; i < w * h; i++) {
    if (pixels[i * 4 + 3] < 128) { transparent++; continue; }
    const key = (pixels[i * 4] << 16) | (pixels[i * 4 + 1] << 8) | pixels[i * 4 + 2];
    if (colorLuminance.has(key)) continue;
    const r = srgbToLinear(pixels[i * 4] / 255);
    const g = srgbToLinear(pixels[i * 4 + 1] / 255);
    const b = srgbToLinear(pixels[i * 4 + 2] / 255);
    colorLuminance.set(key, 0.2126 * r + 0.7152 * g + 0.0722 * b);
  }

  const height = new Float32Array(w * h);
  if (1 - transparent / (w * h) < 0.05) {
    height.fill(0.5);
    return height;
  }

  const palette = Array.from(colorLuminance.entries())
    .sort((a, b) => (a[1] - b[1]) || (a[0] - b[0]));
  if (palette.length < 2) {
    height.fill(0.5);
    return height;
  }

  const rank = new Map();
  const denom = palette.length - 1;
  for (let i = 0; i < palette.length; i++) rank.set(palette[i][0], i / denom);

  for (let i = 0; i < w * h; i++) {
    if (pixels[i * 4 + 3] < 128) { height[i] = 0.5; continue; }
    const key = (pixels[i * 4] << 16) | (pixels[i * 4 + 1] << 8) | pixels[i * 4 + 2];
    let v = Math.pow(rank.get(key) || 0, gamma);
    if (levels > 1) v = Math.round(v * (levels - 1)) / (levels - 1);
    height[i] = v;
  }
  if (CONFIG.render.heightMapSeamless !== false) makePeriodic(height, w, h);
  return height;
}

/*
 * Depth inference by whole-image color ranking, per frame:
 *   1. collect every unique opaque RGB in the frame;
 *   2. compare all of them against each other, sorted by Rec. 709 luminance;
 *   3. each pixel's depth is its color's rank in that global palette (0..1);
 *   4. apply gamma / optional height levels.
 * Every animation frame gets its own height field, packed left-to-right into
 * one atlas texture. No neighbouring pixels are compared when defining depth.
 */
async function buildSurfaceMapsFromUrl(url) {
  const img = await loadImage(url);
  const imgW = img.width, imgH = img.height;
  if (!imgW || !imgH) return null;

  const frameCount = (imgH > imgW && imgH % imgW === 0) ? imgH / imgW : 1;
  const w = imgW, h = imgW;
  const configRes = CONFIG.render.heightMapResolution || 256;
  const frameSize = configRes;
  const gamma = Math.max(0.25, CONFIG.render.heightMapGamma ?? 1.0);
  const levels = Math.max(0, Math.round(CONFIG.render.heightMapLevels || 0));

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const frames = [];
  for (let f = 0; f < frameCount; f++) {
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(img, 0, f * h, w, h, 0, 0, w, h);
    const pixels = ctx.getImageData(0, 0, w, h).data;
    frames.push(heightFrameFromPixels(pixels, w, h, gamma, levels));
  }

  const heightTexture = canvasTextureFromHeightFrames(frames, w, h, frameSize);

  return {
    width: heightTexture.userData.width, height: heightTexture.userData.height,
    frameSize, frameCount, atlasCols: heightTexture.userData.cols, atlasRows: heightTexture.userData.rows,
    heightTexture,
  };
}

function getSurfaceMaps(url) {
  if (surfaceMapCache.has(url)) return surfaceMapCache.get(url);
  if (surfaceMapPending.has(url)) return null;
  const p = buildSurfaceMapsFromUrl(url)
    .then((maps) => { surfaceMapCache.set(url, maps); return maps; })
    .catch((err) => { console.warn(`Surface map failed for ${url}:`, err); return null; })
    .finally(() => { surfaceMapPending.delete(url); });
  surfaceMapPending.set(url, p);
  return null;
}

function applySurfaceMapsToMaterial(material, maps, allowHeightRelief) {
  if (!maps) return;
  const data = material.userData;
  data.heightTexture = maps.heightTexture;
  data.heightFrames = maps.frameCount || 1;
  data.heightMapWidth = maps.width;
  data.heightMapHeight = maps.height;
  data.heightSampleStep = Math.max(1, maps.frameSize / 192);
  data.heightAtlasCols = maps.atlasCols || 1;
  data.heightAtlasRows = maps.atlasRows || 1;
  data.heightRelief = allowHeightRelief;

  if (data.heightUniforms) {
    data.heightUniforms.uHeightMap.value = maps.heightTexture;
    data.heightUniforms.uHeightMapTexel.value.set(1 / maps.width, 1 / maps.height);
    data.heightUniforms.uHeightSampleStep.value = data.heightSampleStep;
    data.heightUniforms.uHeightFrames.value = data.heightFrames;
    data.heightUniforms.uHeightAtlasCols.value = data.heightAtlasCols;
    data.heightUniforms.uHeightAtlasRows.value = data.heightAtlasRows;
    data.heightUniforms.uHeightEnabled.value = (heightMapsEnabled && allowHeightRelief) ? 1 : 0;
  }
}

function attachSurfaceMaps(material, texPath, allowHeightRelief) {
  if (material.userData.surfaceMapsAttached) return;
  material.userData.surfaceMapsAttached = true;
  material.userData.heightRelief = allowHeightRelief;

  const cleanPath = texPath.replace('minecraft:', '');
  const url = `${ASSET_BASE}/textures/${cleanPath}.png`;

  const ready = getSurfaceMaps(url);
  if (ready) {
    applySurfaceMapsToMaterial(material, ready, allowHeightRelief);
  } else {
    const pending = surfaceMapPending.get(url);
    if (pending) pending.then((maps) => applySurfaceMapsToMaterial(material, maps, allowHeightRelief));
  }
}

/* Heightmap shading for MeshLambertMaterial. The fragment shader reads the
 * height field, derives normals/AO/bevels and never displaces geometry; the
 * toggle is a uniform, so no world rebuild. */
function patchHeightMaterial(material, allowHeightRelief = false) {
  material.onBeforeCompile = (shader) => {
    const data = material.userData;
    shader.uniforms.uHeightMap = { value: data.heightTexture || flatHeightTexture };
    shader.uniforms.uHeightEnabled = {
      value: (heightMapsEnabled && allowHeightRelief && !!data.heightTexture) ? 1 : 0,
    };
    shader.uniforms.uHeightMapTexel = {
      value: new THREE.Vector2(
        1 / (data.heightMapWidth || 256),
        1 / (data.heightMapHeight || 256)),
    };
    shader.uniforms.uHeightSampleStep = { value: data.heightSampleStep || 1 };
    shader.uniforms.uHeightFrames = { value: data.heightFrames || 1 };
    shader.uniforms.uHeightAtlasCols = { value: data.heightAtlasCols || 1 };
    shader.uniforms.uHeightAtlasRows = { value: data.heightAtlasRows || 1 };
    shader.uniforms.uHeightAO = { value: CONFIG.render.heightMapAO ?? 0.12 };
    shader.uniforms.uHeightEdge = { value: CONFIG.render.heightMapEdge ?? 0.45 };
    shader.uniforms.uHeightEdgeThreshold = { value: CONFIG.render.heightMapEdgeThreshold ?? 0.05 };
    shader.uniforms.uHeightLift = { value: CONFIG.render.heightMapLift ?? 0.05 };
    shader.uniforms.uHeightNormalStrength = { value: (CONFIG.render.heightMapNormalStrength ?? 2.4) };
    shader.uniforms.uHeightSun = heightSunDir;
    shader.uniforms.uReflectionMode = { value: reflectionMode === 'normal' ? 2 : (reflectionMode === 'flat' ? 1 : 0) };
    shader.uniforms.uReflectionStrength = {
      value: reflectionsEnabled
        ? (material.userData.reflectionStrength ?? DEFAULT_REFLECTION_STRENGTH) * reflectionStrengthScale
        : 0,
    };
    shader.uniforms.uCelestialMap = { value: celestialTexture };
    shader.uniforms.uCelestialStrength = {
      value: reflectionsEnabled
        ? Math.min(1.0, (material.userData.reflectionStrength ?? DEFAULT_REFLECTION_STRENGTH) * 2.0 * reflectionStrengthScale)
        : 0,
    };

    shader.vertexShader = shader.vertexShader.replace(
      '#include <common>',
      `#include <common>
attribute vec2 faceScale;
attribute vec3 faceTangent;
attribute vec3 faceBitangent;
uniform vec3 uHeightSun;
varying vec2 vFaceScale;
varying vec2 vHeightLightTS;
varying vec3 vReflectWorldPos;`
    );
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `vFaceScale = faceScale;
vec2 heightLight = vec2(dot(uHeightSun, faceTangent), dot(uHeightSun, faceBitangent));
float heightLightLen = length(heightLight);
vHeightLightTS = heightLightLen > 1e-4 ? heightLight / heightLightLen : vec2(0.0, 1.0);
#include <begin_vertex>
vReflectWorldPos = ( modelMatrix * vec4( transformed, 1.0 ) ).xyz;`
    );

    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <common>',
      `#include <common>
uniform sampler2D uHeightMap;
uniform float uHeightEnabled;
uniform vec2 uHeightMapTexel;
uniform float uHeightSampleStep;
uniform float uHeightFrames;
uniform float uHeightAtlasCols;
uniform float uHeightAtlasRows;
uniform float uHeightAO;
uniform float uHeightEdge;
uniform float uHeightEdgeThreshold;
uniform float uHeightLift;
uniform float uHeightNormalStrength;
uniform float uReflectionMode;
uniform float uReflectionStrength;
uniform samplerCube uCelestialMap;
uniform float uCelestialStrength;
varying vec2 vFaceScale;
varying vec2 vHeightLightTS;
varying vec3 vReflectWorldPos;
vec2 gHeightUv;
vec3 gHeightNormal = vec3(0.0, 0.0, 1.0);
vec3 gFaceNormal = vec3(0.0, 0.0, 1.0);
mat3 gHeightTBN = mat3(1.0);

`
    );

    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <map_fragment>',
      `#ifdef USE_MAP
  vec2 heightUv = vMapUv;
  // Animated textures are a vertical strip of frames; the height atlas is a
  // row-major grid with one independent square per frame.
  if (uHeightFrames > 1.5) {
    float n = uHeightFrames;
    float frameIndex = clamp(n - 1.0 - floor(vMapUv.y * n), 0.0, n - 1.0);
    float col = mod(frameIndex, uHeightAtlasCols);
    float row = floor(frameIndex / uHeightAtlasCols);
    vec2 local = vec2(vMapUv.x, fract(vMapUv.y * n));
    heightUv = vec2((col + local.x) / uHeightAtlasCols,
                    1.0 - (row + 1.0 - local.y) / uHeightAtlasRows);
  }
  gHeightUv = heightUv;
  float heightAO = 1.0;
  float heightEdge = 1.0;
  if (uHeightEnabled > 0.5) {
    vec3 hv = normalize(vViewPosition);
    vec3 hn = normalize(vNormal);
    vec3 hv1 = dFdx(hv);
    vec3 hv2 = dFdy(hv);
    vec2 hu1 = dFdx(vMapUv);
    vec2 hu2 = dFdy(vMapUv);
    vec3 hp2 = cross(hv2, hn);
    vec3 hp1 = cross(hn, hv1);
    vec3 ht = hp2 * hu1.x + hp1 * hu2.x;
    vec3 hb = hp2 * hu1.y + hp1 * hu2.y;
    float hinv = inversesqrt(max(max(dot(ht, ht), dot(hb, hb)), 1e-8));
    ht *= hinv; hb *= hinv;
    gHeightTBN = mat3(ht, hb, hn);

    vec2 hStep = uHeightMapTexel * uHeightSampleStep * vFaceScale;
    float hC = texture2D(uHeightMap, heightUv).r;
    float hL = texture2D(uHeightMap, heightUv - vec2(hStep.x, 0.0)).r;
    float hR = texture2D(uHeightMap, heightUv + vec2(hStep.x, 0.0)).r;
    float hD = texture2D(uHeightMap, heightUv - vec2(0.0, hStep.y)).r;
    float hU = texture2D(uHeightMap, heightUv + vec2(0.0, hStep.y)).r;

    // Height normal: central differences of the height field, no normal-map asset.
    gHeightNormal = normalize(vec3(
      (hL - hR) * uHeightNormalStrength,
      (hD - hU) * uHeightNormalStrength,
      1.0));

    // Cavity darkening in the low parts of the height field.
    float cavity = clamp((hL + hR + hD + hU) * 0.25 - hC, 0.0, 1.0);
    heightAO = 1.0 - cavity * uHeightAO;

    // Crisp relief outline. The sun/moon direction is converted to texture
    // space per face in the vertex shader; the fragment only does one dot.
    // edge is the height gradient; the surface normal tilts against it, so
    // the lit side is where the gradient points *away* from the light.
    vec2 edge = vec2(hR - hL, hU - hD);
    float edgeMag = length(edge);
    float edgeMask = smoothstep(uHeightEdgeThreshold, uHeightEdgeThreshold + 0.02, edgeMag);
    float slope = -dot(edge, vHeightLightTS);
    float lit = smoothstep(0.0, 0.02, slope);
    float shade = smoothstep(0.0, 0.02, -slope);
    heightEdge = 1.0 + uHeightLift + edgeMask * (lit - shade * 0.75) * uHeightEdge;
  }
  vec4 sampledDiffuseColor = texture2D( map, vMapUv );
  #ifdef DECODE_VIDEO_TEXTURE
    sampledDiffuseColor = vec4( mix( pow( sampledDiffuseColor.rgb * 0.9478672986 + vec3( 0.0521327014 ), vec3( 2.4 ) ), sampledDiffuseColor.rgb * 0.0773993808, vec3( lessThanEqual( sampledDiffuseColor.rgb, vec3( 0.04045 ) ) ) ), sampledDiffuseColor.w );
  #endif
  diffuseColor *= sampledDiffuseColor;
  diffuseColor.rgb *= heightAO * heightEdge;
#endif`
    );

    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <normal_fragment_maps>',
      `gFaceNormal = normal;
if (uHeightEnabled > 0.5) {
  normal = normalize(gHeightTBN * gHeightNormal);
}`
    );

    // Replace the stock flat envMap blend: mode 1 uses the face normal, mode 2
    // uses the per-pixel heightmap normal so reflections behave like a normal map.
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <envmap_fragment>',
      `#ifdef USE_ENVMAP
  if (uReflectionMode > 0.5 && uReflectionStrength > 0.0) {
    vec3 surfaceNormal = normalize( uReflectionMode > 1.5 ? normal : gFaceNormal );
    vec3 worldNormal = normalize( ( vec4( surfaceNormal, 0.0 ) * viewMatrix ).xyz );
    vec3 cameraToFrag = normalize( vReflectWorldPos - cameraPosition );
    vec3 reflectionDir = reflect( cameraToFrag, worldNormal );
    vec3 cubeUv = vec3( flipEnvMap * reflectionDir.x, reflectionDir.yz );
    vec4 reflectionColor = textureCube( envMap, cubeUv );
    float reflectionAmount = clamp( specularStrength * uReflectionStrength, 0.0, 1.0 );
    outgoingLight = mix( outgoingLight, reflectionColor.rgb, reflectionAmount );
    vec3 celestialColor = textureCube( uCelestialMap, cubeUv ).rgb;
    outgoingLight += celestialColor * specularStrength * uCelestialStrength;
  }
#endif`
    );

    material.userData.heightUniforms = shader.uniforms;
  };
  material.customProgramCacheKey = () => 'procedural-surface-v3';
}

function updateHeightmapButton() {
  const btn = document.getElementById('heightmapBtn');
  if (!btn) return;
  btn.textContent = `Heightmaps: ${heightMapsEnabled ? 'On' : 'Off'}`;
  btn.classList.toggle('on', heightMapsEnabled);
  btn.classList.toggle('off', !heightMapsEnabled);
  btn.setAttribute('aria-pressed', String(heightMapsEnabled));
  btn.title = 'Toggle heightmap shading: height normals, cavity AO and outlined bevels (H)';
}

function initHeightmapToggle() {
  const saved = localStorage.getItem(HEIGHTMAP_STORAGE_KEY);
  const enabled = saved === null ? !!CONFIG.render.heightMap : saved === '1';
  setHeightMapsEnabled(enabled, false);
}

function setHeightMapsEnabled(enabled, persist = true) {
  heightMapsEnabled = !!enabled;
  CONFIG.render.heightMap = heightMapsEnabled;
  if (persist) localStorage.setItem(HEIGHTMAP_STORAGE_KEY, heightMapsEnabled ? '1' : '0');
  updateHeightmapButton();
  for (const material of blockMaterialCache.values()) {
    const u = material.userData.heightUniforms;
    if (u) u.uHeightEnabled.value = (heightMapsEnabled && material.userData.heightRelief) ? 1 : 0;
  }
}

function reflectionModeValue() {
  return reflectionMode === 'normal' ? 2 : (reflectionMode === 'flat' ? 1 : 0);
}

function updateReflectionStrengthUi(percent) {
  const slider = document.getElementById('reflectionStrengthSlider');
  if (slider && Number(slider.value) !== percent) slider.value = String(percent);
  const value = document.getElementById('reflectionValue');
  if (value) value.textContent = percent + '%';
}

function setReflectionStrengthPercent(value, persist = true) {
  const percent = Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
  reflectionStrengthScale = percent / 100;
  CONFIG.render.reflectionStrength = reflectionStrengthScale;
  if (persist) localStorage.setItem(REFLECTION_STRENGTH_KEY, String(percent));
  updateReflectionStrengthUi(percent);
  for (const material of blockMaterialCache.values()) {
    if (!material.userData.reflective) continue;
    const base = material.userData.reflectionStrength ?? DEFAULT_REFLECTION_STRENGTH;
    material.reflectivity = reflectionsEnabled ? base * reflectionStrengthScale : 0;
    const u = material.userData.heightUniforms;
    if (u) {
      u.uReflectionStrength.value = reflectionsEnabled ? base * reflectionStrengthScale : 0;
      u.uCelestialStrength.value = reflectionsEnabled
        ? Math.min(1.0, base * 2.0 * reflectionStrengthScale)
        : 0;
    }
  }
}

function initReflectionStrength() {
  const saved = parseFloat(localStorage.getItem(REFLECTION_STRENGTH_KEY));
  const percent = Number.isFinite(saved)
    ? saved
    : (Number.isFinite(CONFIG.render.reflectionStrength) ? CONFIG.render.reflectionStrength * 100 : 50);
  setReflectionStrengthPercent(percent, false);
}

function updateReflectionButton() {
  const btn = document.getElementById('reflectionsBtn');
  if (!btn) return;
  const label = reflectionMode === 'normal' ? 'Normal' : (reflectionMode === 'flat' ? 'Flat' : 'Off');
  btn.textContent = `Reflections: ${label}`;
  btn.classList.toggle('on', reflectionsEnabled);
  btn.classList.toggle('off', !reflectionsEnabled);
  btn.setAttribute('aria-pressed', String(reflectionsEnabled));
  btn.title = 'Cycle reflections: Off → Normal (per-pixel heightmap normals) → Flat (face normals)';
}

function initReflectionToggle() {
  const savedMode = localStorage.getItem(REFLECTION_MODE_KEY);
  if (savedMode === 'off' || savedMode === 'normal' || savedMode === 'flat') {
    setReflectionMode(savedMode, false);
    return;
  }
  const saved = localStorage.getItem(REFLECTION_STORAGE_KEY);
  const enabled = saved === null ? !!CONFIG.render.reflections : saved === '1';
  const fallback = CONFIG.render.reflectionType === 'flat' ? 'flat' : 'normal';
  setReflectionMode(enabled ? fallback : 'off', false);
}

function setReflectionMode(mode, persist = true) {
  if (mode !== 'off' && mode !== 'normal' && mode !== 'flat') mode = 'off';
  const wasEnabled = reflectionsEnabled;
  reflectionMode = mode;
  reflectionsEnabled = mode !== 'off';
  CONFIG.render.reflections = reflectionsEnabled;
  CONFIG.render.reflectionType = mode === 'flat' ? 'flat' : 'normal';

  if (persist) {
    localStorage.setItem(REFLECTION_MODE_KEY, reflectionMode);
    localStorage.setItem(REFLECTION_STORAGE_KEY, reflectionsEnabled ? '1' : '0');
  }
  if (reflectionsEnabled && !wasEnabled) {
    reflectionDirty = true;
    celestialDirty = true;
    reflectionTimer = REFLECTION_INTERVAL;
    celestialTimer = CELESTIAL_INTERVAL;
  }

  const modeValue = reflectionModeValue();
  for (const material of blockMaterialCache.values()) {
    if (!material.userData.reflective) continue;
    const base = material.userData.reflectionStrength ?? DEFAULT_REFLECTION_STRENGTH;
    material.reflectivity = reflectionsEnabled ? base * reflectionStrengthScale : 0;
    const u = material.userData.heightUniforms;
    if (u) {
      u.uReflectionMode.value = modeValue;
      u.uReflectionStrength.value = reflectionsEnabled ? base * reflectionStrengthScale : 0;
      u.uCelestialMap.value = celestialTexture;
      u.uCelestialStrength.value = reflectionsEnabled
        ? Math.min(1.0, base * 2.0 * reflectionStrengthScale)
        : 0;
    }
  }
  updateReflectionButton();
}

function setReflectionsEnabled(enabled, persist = true) {
  if (!enabled) { setReflectionMode('off', persist); return; }
  setReflectionMode(reflectionMode === 'off'
    ? (CONFIG.render.reflectionType === 'flat' ? 'flat' : 'normal')
    : reflectionMode, persist);
}

function cycleReflectionMode() {
  const order = ['off', 'normal', 'flat'];
  const next = order[(order.indexOf(reflectionMode) + 1) % order.length];
  setReflectionMode(next, true);
}

/* ============================= MODEL / BLOCKSTATE LOADING ============================= */

async function loadModel(modelName) {
  let clean = modelName.replace('minecraft:', '');
  if (!clean.startsWith('block/')) clean = `block/${clean}`;
  if (modelCache.has(clean)) return modelCache.get(clean);
  if (modelPending.has(clean)) return modelPending.get(clean);

  const p = (async () => {
    try {
      const res = await fetch(`${ASSET_BASE}/models/${clean}.json`);
      if (!res.ok) throw new Error(`HTTP ${res.status} for ${clean}`);
      const data = await res.json();
      if (data.parent) {
        const parent = await loadModel(data.parent);
        if (parent) {
          data.textures = { ...(parent.textures || {}), ...(data.textures || {}) };
          if (!data.elements && parent.elements) data.elements = parent.elements;
        }
      }
      modelCache.set(clean, data);
      return data;
    } catch (err) {
      showError(`Model error: ${err.message}`);
      modelCache.set(clean, null);
      return null;
    } finally {
      modelPending.delete(clean);
    }
  })();

  modelPending.set(clean, p);
  return p;
}

async function loadBlockstate(blockId) {
  const clean = blockId.replace('minecraft:', '');
  if (blockstateCache.has(clean)) return blockstateCache.get(clean);
  if (blockstatePending.has(clean)) return blockstatePending.get(clean);

  const p = (async () => {
    try {
      const res = await fetch(`${ASSET_BASE}/blockstates/${clean}.json`);
      if (!res.ok) throw new Error(`HTTP ${res.status} for ${clean}`);
      const data = await res.json();
      blockstateCache.set(clean, data);
      return data;
    } catch {
      const fallback = { variants: { "": { model: clean } } };
      blockstateCache.set(clean, fallback);
      return fallback;
    } finally {
      blockstatePending.delete(clean);
    }
  })();

  blockstatePending.set(clean, p);
  return p;
}

const PREFERRED_DEFAULTS = ['y','north','bottom','up','false','none','straight','single','lower','base','floor','left','foot','0','harp','inactive','unlit','unlocked','intact','unpowered','south','east','west','down'];

const BOOLEAN_TRUE_BLOCKS = new Set(['fire', 'soul_fire']);

function computeDefaultProperties(stateData, blockId) {
  const cleanId = (blockId || '').replace('minecraft:', '');
  const preferTrue = BOOLEAN_TRUE_BLOCKS.has(cleanId);

  const propValues = {};
  if (stateData.variants) {
    for (const vk of Object.keys(stateData.variants)) {
      for (const pair of vk.split(',')) {
        if (!pair) continue;
        const [k, v] = pair.split('=');
        if (!k) continue;
        const key = k.trim(), val = v.trim();
        if (!propValues[key]) propValues[key] = new Set();
        propValues[key].add(val);
      }
    }
  }
  if (stateData.multipart) {
    for (const part of stateData.multipart) {
      if (!part.when) continue;
      const conds = part.when.OR ? part.when.OR : [part.when];
      for (const cond of conds) for (const k in cond) {
        const v = cond[k];
        if (!propValues[k]) propValues[k] = new Set();
        if (Array.isArray(v)) v.forEach(x => propValues[k].add(String(x)));
        else propValues[k].add(String(v));
      }
    }
  }
  const defaults = {};
  for (const k in propValues) {
    const vals = Array.from(propValues[k]);
    const booleanProp = vals.includes('true') || vals.includes('false');
    if (booleanProp && vals.includes('true') && vals.includes('false')) {
      defaults[k] = preferTrue ? 'true' : 'false';
      continue;
    }
    if (vals.length === 1 && (vals[0] === 'true' || vals[0] === 'false')) {
      defaults[k] = preferTrue ? 'true' : 'false';
      continue;
    }
    let found = null;
    for (const pref of PREFERRED_DEFAULTS) if (vals.includes(pref)) { found = pref; break; }
    defaults[k] = found || vals.sort()[0];
  }
  return defaults;
}

function getDefaultProperties(stateData, blockId) {
  if (defaultPropsCache.has(blockId)) return defaultPropsCache.get(blockId);
  const d = computeDefaultProperties(stateData, blockId);
  defaultPropsCache.set(blockId, d);
  return d;
}

function resolveTexture(ref, textures) {
  let current = ref, depth = 10;
  while (current && current.startsWith('#') && depth-- > 0) current = textures[current.substring(1)];
  return current || 'block/missing';
}

function getDefaultUV(face, from, to) {
  const [x1, y1, z1] = from;
  const [x2, y2, z2] = to;
  switch (face) {
    case 'north': return [16 - x2, 16 - y2, 16 - x1, 16 - y1];
    case 'south': return [x1, 16 - y2, x2, 16 - y1];
    case 'west':  return [z1, 16 - y2, z2, 16 - y1];
    case 'east':  return [16 - z2, 16 - y2, 16 - z1, 16 - y1];
    case 'up':    return [x1, 16 - z2, x2, 16 - z1];
    case 'down':  return [x1, z1, x2, z2];
    default:     return [0, 0, 16, 16];
  }
}

let grassColormap = null, foliageColormap = null;
let grassColormapData = null, foliageColormapData = null;

function imageToData(img) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  return { data: ctx.getImageData(0, 0, img.width, img.height).data, w: img.width, h: img.height };
}

async function loadColormaps() {
  try {
    if (!grassColormap) {
      grassColormap = await loadImage(`${ASSET_BASE}/textures/colormap/grass.png`);
      grassColormapData = imageToData(grassColormap);
    }
    if (!foliageColormap) {
      foliageColormap = await loadImage(`${ASSET_BASE}/textures/colormap/foliage.png`);
      foliageColormapData = imageToData(foliageColormap);
    }
  } catch (err) { console.warn('Colormap load failed', err); }
}

function getBiomeColor(temp, humidity, cmap) {
  if (!cmap) return new THREE.Color(1, 1, 1);
  const x = Math.min(cmap.w - 1, Math.max(0, Math.floor((1 - humidity) * (cmap.w - 1))));
  const y = Math.min(cmap.h - 1, Math.max(0, Math.floor((1 - temp) * (cmap.h - 1))));
  const i = (y * cmap.w + x) * 4;
  return new THREE.Color(cmap.data[i] / 255, cmap.data[i + 1] / 255, cmap.data[i + 2] / 255);
}

const tintColorCache = new Map();
function getTintColor(tintIndex) {
  if (tintColorCache.has(tintIndex)) return tintColorCache.get(tintIndex);
  const temp = 0.8, humidity = 0.4;
  let color;
  if (tintIndex === 0) color = getBiomeColor(temp, humidity, grassColormapData);
  else if (tintIndex === 1) color = getBiomeColor(temp, humidity, foliageColormapData);
  else if (tintIndex === 2) color = new THREE.Color(0.2, 0.4, 1.0);
  else color = new THREE.Color(1, 1, 1);
  tintColorCache.set(tintIndex, color);
  return color;
}

/* ============================= MATERIAL CACHE ============================= */

const TRANSLUCENT_BLOCKS = new Set([
  'water', 'bubble_column', 'ice', 'blue_ice', 'frosted_ice',
  'slime_block', 'honey_block', 'nether_portal', 'tinted_glass', 'powder_snow',
]);
function isTranslucentBlock(id) {
  const b = id.replace('minecraft:', '');
  return TRANSLUCENT_BLOCKS.has(b) || b.includes('stained_glass');
}

/* How strongly each material class reflects. Every block side reflects; the
 * per-pixel alpha mask decides which texels are visible enough to reflect, and
 * these classes only tune the overall strength. */
const REFLECTIVE_TEXTURES = [
  { re: /(^|\/)water_(still|flow|overlay)$/, strength: 0.68 },
  { re: /(^|\/)(ice|blue_ice|frosted_ice|packed_ice)$/, strength: 0.6 },
  { re: /glass/, strength: 0.55 },
  { re: /(iron|gold|diamond|emerald|netherite|lapis|redstone|coal|raw_iron|raw_gold|raw_copper)_block$/, strength: 0.55 },
  { re: /(copper_block|exposed_copper|weathered_copper|oxidized_copper|cut_copper)/, strength: 0.5 },
  { re: /amethyst_block$/, strength: 0.4 },
];

function getReflectionStrength(texPath) {
  const clean = texPath.replace('minecraft:', '');
  for (const rule of REFLECTIVE_TEXTURES) {
    if (rule.re.test(clean)) return rule.strength;
  }
  return DEFAULT_REFLECTION_STRENGTH;
}

function getBlockMaterial(texPath, tintIndex, translucent, flat) {
  const key = texPath + '|' + (tintIndex === undefined ? -1 : tintIndex) + '|' + (translucent ? 'T' : 'O') + '|' + (flat ? 'D' : 'S');
  let mat = blockMaterialCache.get(key);
  if (mat) return mat;

  const texture = getTexture(texPath);
  mat = new THREE.MeshLambertMaterial({
    map: texture,
    transparent: !!translucent,
    alphaTest: translucent ? 0.0 : 0.5,
    side: flat ? THREE.DoubleSide : THREE.FrontSide,
    depthWrite: !translucent,
  });
  if (tintIndex !== undefined) mat.color = getTintColor(tintIndex);

  const reflectionStrength = getReflectionStrength(texPath);
  if (texture !== magentaTex) {
    // Translucent faces reflect across the whole side; cutout/opaque faces use
    // the albedo alpha as the per-pixel reflectivity map.
    const mask = translucent ? fullReflectionMask : (texture.userData?.reflectionMask || fullReflectionMask);
    mat.envMap = reflectionTexture;
    mat.specularMap = mask;
    mat.combine = THREE.MixOperation;
    mat.reflectivity = reflectionsEnabled ? reflectionStrength * reflectionStrengthScale : 0;
    mat.userData.reflective = true;
    mat.userData.reflectionStrength = reflectionStrength;
  }

  // Every block surface, including cutouts and translucent glass/ice, gets the
  // same procedural relief from its per-frame height atlas.
  const allowHeightRelief = true;
  if (texture !== magentaTex) {
    patchHeightMaterial(mat, allowHeightRelief);
    attachSurfaceMaps(mat, texPath, allowHeightRelief);
  }

  blockMaterialCache.set(key, mat);
  return mat;
}

/* ============================= FACE GEOMETRY ============================= */

const FACE_DEFS = {
  east:  { normal: [ 1, 0, 0], corners: (f, t) => [[t[0], f[1], f[2]], [t[0], t[1], f[2]], [t[0], t[1], t[2]], [t[0], f[1], t[2]]] },
  west:  { normal: [-1, 0, 0], corners: (f, t) => [[f[0], f[1], t[2]], [f[0], t[1], t[2]], [f[0], t[1], f[2]], [f[0], f[1], f[2]]] },
  up:    { normal: [ 0, 1, 0], corners: (f, t) => [[f[0], t[1], t[2]], [t[0], t[1], t[2]], [t[0], t[1], f[2]], [f[0], t[1], f[2]]] },
  down:  { normal: [ 0,-1, 0], corners: (f, t) => [[f[0], f[1], f[2]], [t[0], f[1], f[2]], [t[0], f[1], t[2]], [f[0], f[1], t[2]]] },
  south: { normal: [ 0, 0, 1], corners: (f, t) => [[t[0], f[1], t[2]], [t[0], t[1], t[2]], [f[0], t[1], t[2]], [f[0], f[1], t[2]]] },
  north: { normal: [ 0, 0,-1], corners: (f, t) => [[f[0], f[1], f[2]], [f[0], t[1], f[2]], [t[0], t[1], f[2]], [t[0], f[1], f[2]]] }
};
const FACE_NAMES = Object.keys(FACE_DEFS);
const FACE_DIRS = {
  east: [1, 0, 0], west: [-1, 0, 0], up: [0, 1, 0],
  down: [0, -1, 0], south: [0, 0, 1], north: [0, 0, -1],
};

/* ============================= GEOMETRY BATCHING ============================= */

function getBucket(material) {
  let b = materialBuckets.get(material);
  if (!b) {
    b = { material, faces: [] };
    materialBuckets.set(material, b);
  }
  return b;
}

const _qc0 = new THREE.Vector3(), _qc1 = new THREE.Vector3(), _qc2 = new THREE.Vector3(), _qc3 = new THREE.Vector3();
const _qn = new THREE.Vector3();

function pushQuad(bucket, c0, c1, c2, c3, n, uvs, blockKey) {
  const worldU = c0.distanceTo(c1), worldV = c0.distanceTo(c3);
  const uvU = Math.hypot(uvs[1][0] - uvs[0][0], uvs[1][1] - uvs[0][1]);
  const uvV = Math.hypot(uvs[3][0] - uvs[0][0], uvs[3][1] - uvs[0][1]);
  const faceScale = [
    worldU > 1e-5 ? uvU / worldU : 1,
    worldV > 1e-5 ? uvV / worldV : 1,
  ];

  // World-space tangent/bitangent for this face from its UV axes. The vertex
  // shader uses them to turn the day-cycle light into a 2D texture-space
  // direction, so the bevel follows the sun without any per-fragment transform.
  const e1x = c1.x - c0.x, e1y = c1.y - c0.y, e1z = c1.z - c0.z;
  const e2x = c3.x - c0.x, e2y = c3.y - c0.y, e2z = c3.z - c0.z;
  const du1x = uvs[1][0] - uvs[0][0], du1y = uvs[1][1] - uvs[0][1];
  const du2x = uvs[3][0] - uvs[0][0], du2y = uvs[3][1] - uvs[0][1];
  const det = du1x * du2y - du1y * du2x;
  let tx = 1, ty = 0, tz = 0, bx = 0, by = 1, bz = 0;
  if (Math.abs(det) > 1e-8) {
    const inv = 1 / det;
    tx = (e1x * du2y - e2x * du1y) * inv;
    ty = (e1y * du2y - e2y * du1y) * inv;
    tz = (e1z * du2y - e2z * du1y) * inv;
    bx = (e2x * du1x - e1x * du2x) * inv;
    by = (e2y * du1x - e1y * du2x) * inv;
    bz = (e2z * du1x - e1z * du2x) * inv;
    const tl = Math.hypot(tx, ty, tz) || 1;
    const bl = Math.hypot(bx, by, bz) || 1;
    tx /= tl; ty /= tl; tz /= tl;
    bx /= bl; by /= bl; bz /= bl;
  }

  bucket.faces.push({
    corners: [
      [c0.x, c0.y, c0.z], [c1.x, c1.y, c1.z],
      [c2.x, c2.y, c2.z], [c3.x, c3.y, c3.z],
    ],
    normal: [n.x, n.y, n.z],
    uvs: [
      [uvs[0][0], uvs[0][1]], [uvs[1][0], uvs[1][1]],
      [uvs[2][0], uvs[2][1]], [uvs[3][0], uvs[3][1]],
    ],
    blockKey,
    faceScale,
    tangent: [tx, ty, tz],
    bitangent: [bx, by, bz],
    removed: false,
  });
}

const AXIS_X = new THREE.Vector3(1, 0, 0);
const AXIS_Y = new THREE.Vector3(0, 1, 0);
const AXIS_Z = new THREE.Vector3(0, 0, 1);

function isFullCubeElement(el) {
  return !el.rotation &&
    el.from[0] === 0 && el.from[1] === 0 && el.from[2] === 0 &&
    el.to[0] === 16 && el.to[1] === 16 && el.to[2] === 16 &&
    el.faces && el.faces.up && el.faces.down &&
    el.faces.north && el.faces.south && el.faces.east && el.faces.west;
}

function isFlatElement(el) {
  return el.from[0] === el.to[0] || el.from[1] === el.to[1] || el.from[2] === el.to[2];
}

/* ============================= BLOCK COLLISION SHAPES ============================= */

/* Blocks whose render model has no collision box in Minecraft. Using the model
 * boxes for these would create invisible walls (flowers, torches, rails). */
const NO_COLLISION_BLOCKS = new Set([
  'air', 'cave_air', 'void_air',
  'water', 'flowing_water', 'lava', 'flowing_lava', 'bubble_column',
  'fire', 'soul_fire', 'end_portal', 'end_gateway', 'nether_portal',
  'light', 'structure_void',
  'short_grass', 'grass', 'tall_grass', 'fern', 'large_fern', 'dead_bush',
  'seagrass', 'tall_seagrass', 'kelp', 'kelp_plant', 'sea_pickle',
  'sugar_cane', 'cobweb', 'tripwire', 'redstone_wire',
  'dandelion', 'poppy', 'blue_orchid', 'allium', 'azure_bluet',
  'red_tulip', 'orange_tulip', 'white_tulip', 'pink_tulip', 'oxeye_daisy',
  'cornflower', 'lily_of_the_valley', 'wither_rose', 'torchflower',
  'sunflower', 'lilac', 'rose_bush', 'peony', 'pitcher_plant',
  'closed_eyeblossom', 'open_eyeblossom',
  'brown_mushroom', 'red_mushroom', 'crimson_fungus', 'warped_fungus',
  'nether_sprouts', 'warped_roots', 'crimson_roots',
  'mangrove_propagule', 'sweet_berry_bush',
  'wheat', 'carrots', 'potatoes', 'beetroots', 'nether_wart',
  'melon_stem', 'pumpkin_stem', 'attached_melon_stem', 'attached_pumpkin_stem',
  'torchflower_crop', 'pitcher_crop',
  'vine', 'glow_lichen', 'sculk_vein', 'ladder', 'chain', 'powder_snow',
  'bamboo_sapling',
  'cave_vines', 'cave_vines_plant', 'weeping_vines', 'weeping_vines_plant',
  'twisting_vines', 'twisting_vines_plant', 'hanging_roots',
]);

/* The models of these have no elements but they still stop the player. */
const FORCE_SOLID_BLOCKS = new Set(['barrier']);

function isNonSolidBlock(id) {
  const clean = id.replace('minecraft:', '');
  if (NO_COLLISION_BLOCKS.has(clean)) return true;
  if (/(^|_)sapling$/.test(clean)) return true;
  if (/(^|_)(wall_)?torch$/.test(clean)) return true;
  if (/(^|_)wall_banner$|(^|_)banner$/.test(clean)) return true;
  if (/(^|_)rail$/.test(clean)) return true;
  if (/_coral_(wall_)?fan$/.test(clean)) return true;
  return false;
}

const _shapeQBlock = new THREE.Quaternion();
const _shapeQElement = new THREE.Quaternion();
const _shapeOrigin = new THREE.Vector3();
const _shapeHalf = new THREE.Vector3();
const _shapeOffset = new THREE.Vector3();
const _shapeV = new THREE.Vector3();
const _shapeBounds = { minX: 0, minY: 0, minZ: 0, maxX: 0, maxY: 0, maxZ: 0 };

function elementCollisionBox(el, qBlock, offset) {
  _shapeQElement.identity();
  let rotated = false;
  if (el.rotation) {
    const axis = el.rotation.axis;
    const angle = THREE.MathUtils.degToRad(el.rotation.angle || 0);
    _shapeQElement.setFromAxisAngle(axis === 'x' ? AXIS_X : axis === 'y' ? AXIS_Y : AXIS_Z, angle);
    _shapeOrigin.set(el.rotation.origin[0] / 16, el.rotation.origin[1] / 16, el.rotation.origin[2] / 16);
    rotated = true;
  }

  let minX = Infinity, minY = Infinity, minZ = Infinity;
  let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
  for (let xi = 0; xi < 2; xi++) {
    for (let yi = 0; yi < 2; yi++) {
      for (let zi = 0; zi < 2; zi++) {
        _shapeV.set(
          (xi ? el.to[0] : el.from[0]) / 16,
          (yi ? el.to[1] : el.from[1]) / 16,
          (zi ? el.to[2] : el.from[2]) / 16);
        if (rotated) _shapeV.sub(_shapeOrigin).applyQuaternion(_shapeQElement).add(_shapeOrigin);
        _shapeV.applyQuaternion(qBlock).add(offset);
        if (_shapeV.x < minX) minX = _shapeV.x;
        if (_shapeV.y < minY) minY = _shapeV.y;
        if (_shapeV.z < minZ) minZ = _shapeV.z;
        if (_shapeV.x > maxX) maxX = _shapeV.x;
        if (_shapeV.y > maxY) maxY = _shapeV.y;
        if (_shapeV.z > maxZ) maxZ = _shapeV.z;
      }
    }
  }
  return { minX, minY, minZ, maxX, maxY, maxZ };
}

/* Collision shape of one model application, in unit block space. Cached per
 * model object because every oak_stairs block shares the same element list. */
function getEntryCollisionShape(entry) {
  const data = entry.data;
  if (!data || !data.elements || data.elements.length === 0) return null;

  let perModel = collisionShapeCache.get(data);
  if (!perModel) { perModel = new Map(); collisionShapeCache.set(data, perModel); }
  const cacheKey = `${entry.x || 0},${entry.y || 0}`;
  if (perModel.has(cacheKey)) return perModel.get(cacheKey);

  _shapeQBlock.identity();
  if (entry.x || entry.y) {
    _shapeQBlock.setFromEuler(new THREE.Euler(
      THREE.MathUtils.degToRad(-(entry.x || 0)),
      THREE.MathUtils.degToRad(-(entry.y || 0)),
      0, 'XYZ'));
  }
  _shapeHalf.set(0.5, 0.5, 0.5).applyQuaternion(_shapeQBlock);
  _shapeOffset.set(1, 1, 1).sub(_shapeHalf);

  const boxes = [];
  let full = false;
  for (const el of data.elements) {
    if (!el.from || !el.to) continue;
    const box = elementCollisionBox(el, _shapeQBlock, _shapeOffset);
    if (box.maxX - box.minX < 1e-6 || box.maxY - box.minY < 1e-6 || box.maxZ - box.minZ < 1e-6) continue;
    if (box.minX <= 0.5 + 1e-5 && box.minY <= 0.5 + 1e-5 && box.minZ <= 0.5 + 1e-5 &&
        box.maxX >= 1.5 - 1e-5 && box.maxY >= 1.5 - 1e-5 && box.maxZ >= 1.5 - 1e-5) {
      full = true;
      break;
    }
    boxes.push(box);
  }
  const shape = { full, boxes };
  perModel.set(cacheKey, shape);
  return shape;
}

function getBlockCollisionShape(id, entries) {
  const clean = id.replace('minecraft:', '');
  if (FORCE_SOLID_BLOCKS.has(clean)) return { full: true, boxes: [] };
  if (isNonSolidBlock(clean)) return null;

  const boxes = [];
  for (const entry of entries) {
    const shape = getEntryCollisionShape(entry);
    if (!shape) continue;
    if (shape.full) return { full: true, boxes: [] };
    for (const box of shape.boxes) boxes.push(box);
  }
  return { full: false, boxes };
}

function registerBlockCollision(info) {
  const { id, pos, entries } = info;
  if (!entries || entries.length === 0) return;
  const shape = getBlockCollisionShape(id, entries);
  if (!shape) return;
  const key = `${pos.x},${pos.y},${pos.z}`;
  if (shape.full) collisionSolids.add(key);
  else if (shape.boxes.length) collisionPartials.set(key, shape.boxes);
}

function collectElementFaces(el, modelTextures, blockId, q, offset, skipFaces, overrideMaterial, translucent, blockKey) {
  const from = el.from;
  const to = el.to;
  const f = [from[0] / 16, from[1] / 16, from[2] / 16];
  const t = [to[0] / 16, to[1] / 16, to[2] / 16];

  const flat = isFlatElement(el);

  let elQuat = null, elOrigin = null;
  if (el.rotation) {
    elOrigin = new THREE.Vector3(el.rotation.origin[0] / 16, el.rotation.origin[1] / 16, el.rotation.origin[2] / 16);
    const axis = el.rotation.axis;
    const angle = THREE.MathUtils.degToRad(el.rotation.angle || 0);
    elQuat = new THREE.Quaternion().setFromAxisAngle(
      axis === 'x' ? AXIS_X : axis === 'y' ? AXIS_Y : AXIS_Z, angle);
  }

  for (const faceName of FACE_NAMES) {
    if (!el.faces || !el.faces[faceName]) continue;
    if (skipFaces && skipFaces.has(faceName)) continue;

    const face = el.faces[faceName];
    const texPath = resolveTexture(face.texture, modelTextures);
    const material = overrideMaterial || getBlockMaterial(texPath, face.tintindex, translucent, flat);
    const bucket = getBucket(material);

    const rawUv = face.uv ? face.uv : getDefaultUV(faceName, from, to);
    const u1 = rawUv[0] / 16, v1 = 1 - rawUv[1] / 16, u2 = rawUv[2] / 16, v2 = 1 - rawUv[3] / 16;

    let quadUVs;
    if (faceName === 'up') quadUVs = [[u1, v2], [u2, v2], [u2, v1], [u1, v1]];
    else if (faceName === 'down') quadUVs = [[u1, v1], [u2, v1], [u2, v2], [u1, v2]];
    else quadUVs = [[u2, v2], [u2, v1], [u1, v1], [u1, v2]];

    const rot = (face.rotation || 0) % 360;
    for (let i = 0; i < rot / 90; i++) quadUVs.push(quadUVs.shift());

    const def = FACE_DEFS[faceName];
    const c = def.corners(f, t);

    _qn.set(def.normal[0], def.normal[1], def.normal[2]);
    if (elQuat) _qn.applyQuaternion(elQuat);
    _qn.applyQuaternion(q);

    const quad = [_qc0, _qc1, _qc2, _qc3];
    for (let i = 0; i < 4; i++) {
      const v = quad[i];
      v.set(c[i][0], c[i][1], c[i][2]);
      if (elQuat) v.sub(elOrigin).applyQuaternion(elQuat).add(elOrigin);
      v.applyQuaternion(q).add(offset);
    }

    pushQuad(bucket, quad[0], quad[1], quad[2], quad[3], _qn, quadUVs, blockKey);
  }
}

function entriesAreOpaqueCube(entries) {
  if (!entries || entries.length === 0) return false;
  for (const entry of entries) {
    if (entry.x || entry.y) return false;
    const data = entry.data;
    if (!data || !data.elements || data.elements.length !== 1) return false;
    if (!isFullCubeElement(data.elements[0])) return false;
  }
  return true;
}

async function collectBlockFaces(info, opaquePositions) {
  const { id, pos, entries } = info;
  if (!entries || entries.length === 0) return;

  registerBlockCollision(info);

  const shaderConfig = await getShaderConfigForBlock(id);
  let overrideMaterial = null;
  if (shaderConfig) overrideMaterial = await createMCShaderMaterial(shaderConfig);

  const translucent = isTranslucentBlock(id);
  const selfOpaque = !shaderConfig && entriesAreOpaqueCube(entries);
  const blockKey = `${pos.x},${pos.y},${pos.z}`;

  for (const entry of entries) {
    const data = entry.data;
    if (!data || !data.elements) continue;

    const rotX = entry.x || 0, rotY = entry.y || 0;
    const q = new THREE.Quaternion();
    if (rotX || rotY) {
      q.setFromEuler(new THREE.Euler(
        THREE.MathUtils.degToRad(-rotX),
        THREE.MathUtils.degToRad(-rotY),
        0, 'XYZ'));
    }
    const half = new THREE.Vector3(0.5, 0.5, 0.5).applyQuaternion(q);
    const offset = new THREE.Vector3(pos.x + 1, pos.y + 1, pos.z + 1).sub(half);

    for (const el of data.elements) {
      let skipFaces = null;
      if (selfOpaque && isFullCubeElement(el)) {
        for (const fn of FACE_NAMES) {
          const d = FACE_DIRS[fn];
          if (opaquePositions.has(`${pos.x + d[0]},${pos.y + d[1]},${pos.z + d[2]}`)) {
            (skipFaces || (skipFaces = new Set())).add(fn);
          }
        }
      }
      collectElementFaces(el, data.textures || {}, id, q, offset, skipFaces, overrideMaterial, translucent, blockKey);
    }
  }
}

/* ============================= COINCIDENT FACE DEDUPLICATION ============================= */

const _R = (n) => Math.round(n * 4096) / 4096;

function faceCanonicalKey(face, materialId) {
  const corners = [
    [ _R(face.corners[0][0]), _R(face.corners[0][1]), _R(face.corners[0][2]) ],
    [ _R(face.corners[1][0]), _R(face.corners[1][1]), _R(face.corners[1][2]) ],
    [ _R(face.corners[2][0]), _R(face.corners[2][1]), _R(face.corners[2][2]) ],
    [ _R(face.corners[3][0]), _R(face.corners[3][1]), _R(face.corners[3][2]) ],
  ];
  corners.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);

  const uvs = [
    [ _R(face.uvs[0][0]), _R(face.uvs[0][1]) ],
    [ _R(face.uvs[1][0]), _R(face.uvs[1][1]) ],
    [ _R(face.uvs[2][0]), _R(face.uvs[2][1]) ],
    [ _R(face.uvs[3][0]), _R(face.uvs[3][1]) ],
  ];
  uvs.sort((a, b) => a[0] - b[0] || a[1] - b[1]);

  return materialId + '|' +
    corners.map(c => c.join(',')).join(';') + '|' +
    uvs.map(u => u.join(',')).join(';');
}

function dedupeCoincidentFaces() {
  if (!CONFIG.render.dedupeCoincidentFaces) return 0;
  const groups = new Map();
  for (const bucket of materialBuckets.values()) {
    const matId = bucket.material.uuid;
    for (const face of bucket.faces) {
      if (face.removed) continue;
      const key = faceCanonicalKey(face, matId);
      let arr = groups.get(key);
      if (!arr) { arr = []; groups.set(key, arr); }
      arr.push(face);
    }
  }
  let removed = 0;
  for (const arr of groups.values()) {
    if (arr.length < 2) continue;

    const blockKeys = new Set();
    for (const f of arr) blockKeys.add(f.blockKey);

    if (blockKeys.size >= 2) {
      for (const f of arr) {
        if (!f.removed) { f.removed = true; removed++; }
      }
    } else {
      let kept = false;
      for (const f of arr) {
        if (!kept) { kept = true; continue; }
        if (!f.removed) { f.removed = true; removed++; }
      }
    }
  }
  return removed;
}

/* ============================= FLUSH ============================= */

function flushBuckets() {
  const culled = dedupeCoincidentFaces();
  if (culled > 0) console.log(`Deduplicated ${culled} coincident faces`);

  let meshCount = 0, totalFaces = 0;
  for (const bucket of materialBuckets.values()) {
    const positions = [], normals = [], uvs = [], faceScales = [], tangents = [], bitangents = [], indices = [];
    let vCount = 0;
    for (const face of bucket.faces) {
      if (face.removed) continue;
      const c = face.corners, u = face.uvs, n = face.normal;
      for (let i = 0; i < 4; i++) {
        positions.push(c[i][0], c[i][1], c[i][2]);
        normals.push(n[0], n[1], n[2]);
        uvs.push(u[i][0], u[i][1]);
        faceScales.push(face.faceScale[0], face.faceScale[1]);
        tangents.push(face.tangent[0], face.tangent[1], face.tangent[2]);
        bitangents.push(face.bitangent[0], face.bitangent[1], face.bitangent[2]);
      }
      indices.push(vCount, vCount + 1, vCount + 2, vCount, vCount + 2, vCount + 3);
      vCount += 4;
      totalFaces++;
    }
    if (vCount === 0) continue;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.setAttribute('faceScale', new THREE.Float32BufferAttribute(faceScales, 2));
    g.setAttribute('faceTangent', new THREE.Float32BufferAttribute(tangents, 3));
    g.setAttribute('faceBitangent', new THREE.Float32BufferAttribute(bitangents, 3));
    g.setIndex(indices);
    g.computeBoundingSphere();
    const mesh = new THREE.Mesh(g, bucket.material);
    worldGroup.add(mesh);
    meshCount++;
  }
  materialBuckets.clear();
  console.log(`Flushed ${meshCount} merged meshes (${totalFaces} faces)`);
}

function clearWorld() {
  for (const c of [...worldGroup.children]) {
    worldGroup.remove(c);
    if (c.geometry) c.geometry.dispose();
  }
  materialBuckets.clear();
  collisionSolids.clear();
  collisionPartials.clear();
  worldBounds = null;
}

/* ============================= MODEL SELECTION ============================= */

async function getBlockModels(blockId, properties, pos) {
  const stateData = await loadBlockstate(blockId);
  const defaults = getDefaultProperties(stateData, blockId.replace('minecraft:', ''));
  const filledProps = { ...defaults, ...properties };
  const modelApps = [];

  if (stateData.variants) {
    let best = null, bestScore = -1;
    for (const vk of Object.keys(stateData.variants)) {
      const vProps = {};
      for (const pair of vk.split(',')) { if (!pair) continue; const [k, v] = pair.split('='); if (k) vProps[k.trim()] = v.trim(); }
      let ok = true;
      for (const k in vProps) if (String(filledProps[k]) !== vProps[k]) { ok = false; break; }
      if (ok) { const score = Object.keys(vProps).length; if (score > bestScore) { bestScore = score; best = stateData.variants[vk]; } }
    }
    if (!best) best = stateData.variants[Object.keys(stateData.variants)[0]];
    if (best) {
      let chosen;
      if (Array.isArray(best)) {
        if (best.length === 1) chosen = best[0];
        else if (pos) { const hash = (((pos.x * 73856093) ^ (pos.y * 19349663) ^ (pos.z * 83492791)) >>> 0); chosen = best[hash % best.length]; }
        else chosen = best[0];
      } else chosen = best;
      modelApps.push({ model: chosen.model, x: chosen.x || 0, y: chosen.y || 0 });
    }
  } else if (stateData.multipart) {
    for (const part of stateData.multipart) {
      let match = true;
      if (part.when) {
        match = false;
        if (part.when.OR) match = part.when.OR.some(c => matchesCondition(c, filledProps));
        else match = matchesCondition(part.when, filledProps);
      }
      if (match && part.apply) {
        const apps = Array.isArray(part.apply) ? part.apply : [part.apply];
        for (const app of apps) modelApps.push({ model: app.model, x: app.x || 0, y: app.y || 0 });
      }
    }
  }

  const result = [];
  for (const app of modelApps) {
    const data = await loadModel(app.model);
    if (data) result.push({ data, x: app.x, y: app.y });
  }
  return result;
}

function matchesCondition(cond, props) {
  for (const k in cond) {
    const val = cond[k];
    if (typeof val === 'string') { if (String(props[k]) !== val) return false; }
    else if (Array.isArray(val)) { if (!val.includes(String(props[k]))) return false; }
  }
  return true;
}

/* ============================= COMMANDS ============================= */

function loadCommandsFromStorage() {
  const saved = localStorage.getItem('voxelBuilderCommandsJava');
  document.getElementById('commands').value = saved || "/setblock 0 0 0 end_portal\n/setblock 1 0 0 stone\n/fill 2 0 0 4 2 2 stone";
}
function saveCommandsToStorage() {
  localStorage.setItem('voxelBuilderCommandsJava', document.getElementById('commands').value);
}
function parseBlockSpec(spec) {
  let id = spec, props = {};
  const bracket = spec.indexOf('[');
  if (bracket !== -1) {
    id = spec.substring(0, bracket);
    const propStr = spec.substring(bracket + 1, spec.length - 1);
    for (const pair of propStr.split(',')) { const [k, v] = pair.split('='); if (k && v) props[k.trim()] = v.trim(); }
  }
  return [id, props];
}

function growWorldBounds(x, y, z) {
  const b = worldBounds;
  if (!b) return;
  if (x < b.minX) b.minX = x;
  if (y < b.minY) b.minY = y;
  if (z < b.minZ) b.minZ = z;
  if (x > b.maxX) b.maxX = x;
  if (y > b.maxY) b.maxY = y;
  if (z > b.maxZ) b.maxZ = z;
}

async function build() {
  clearWorld();
  errorOverlay.textContent = ''; errorOverlay.style.display = 'none';
  await loadColormaps();

  const placementMap = new Map();
  worldBounds = { minX: Infinity, minY: Infinity, minZ: Infinity, maxX: -Infinity, maxY: -Infinity, maxZ: -Infinity };
  for (const rawLine of document.getElementById('commands').value.split('\n')) {
    const line = rawLine.trim(); if (!line) continue;
    const parts = line.match(/\S+/g) || []; if (parts.length === 0) continue;
    const cmd = parts[0].toLowerCase();
    if (cmd === '/setblock' && parts.length >= 5) {
      const bx = parseFloat(parts[1]), by = parseFloat(parts[2]), bz = parseFloat(parts[3]);
      growWorldBounds(bx, by, bz);
      placementMap.set(`${bx},${by},${bz}`, parts[4].toLowerCase().replace('minecraft:', ''));
    } else if (cmd === '/fill' && parts.length >= 8) {
      const x1 = Math.min(parseFloat(parts[1]), parseFloat(parts[4]));
      const x2 = Math.max(parseFloat(parts[1]), parseFloat(parts[4]));
      const y1 = Math.min(parseFloat(parts[2]), parseFloat(parts[5]));
      const y2 = Math.max(parseFloat(parts[2]), parseFloat(parts[5]));
      const z1 = Math.min(parseFloat(parts[3]), parseFloat(parts[6]));
      const z2 = Math.max(parseFloat(parts[3]), parseFloat(parts[6]));
      const spec = parts[7].toLowerCase().replace('minecraft:', '');
      growWorldBounds(x1, y1, z1); growWorldBounds(x2, y2, z2);
      for (let x = x1; x <= x2; x++) for (let y = y1; y <= y2; y++) for (let z = z1; z <= z2; z++) {
        placementMap.set(`${x},${y},${z}`, spec);
      }
    }
  }
  if (!placementMap.size) worldBounds = null;

  const concurrency = Math.max(1, CONFIG.render.concurrency || 12);
  const entries = Array.from(placementMap.entries());
  const t0 = performance.now();

  /* ---- pass 1: resolve models in parallel ---- */
  const blockInfo = new Map();
  const opaquePositions = new Set();

  const { errors: resolveErrors } = await mapWithConcurrency(entries, concurrency, async ([key, spec]) => {
    const [id, props] = parseBlockSpec(spec);
    const [xStr, yStr, zStr] = key.split(',');
    const pos = { x: parseInt(xStr, 10), y: parseInt(yStr, 10), z: parseInt(zStr, 10) };
    const modelEntries = await getBlockModels(id, props, pos);
    blockInfo.set(key, { id, pos, entries: modelEntries });
    if (!SHADER_BLOCK_IDS.has(id) && !isTranslucentBlock(id) && entriesAreOpaqueCube(modelEntries)) {
      opaquePositions.add(key);
    }
  });
  const t1 = performance.now();
  for (const e of resolveErrors) showError(`Failed to resolve: ${e.error.message}`);
  console.log(`Pass 1 (resolve): ${blockInfo.size}/${entries.length} blocks in ${(t1 - t0).toFixed(0)} ms`);

  /* ---- pass 2: emit geometry in parallel ---- */
  const infos = Array.from(blockInfo.values());
  const { errors: emitErrors } = await mapWithConcurrency(infos, concurrency, async (info) => {
    await collectBlockFaces(info, opaquePositions);
  });
  const t2 = performance.now();
  for (const e of emitErrors) showError(`Failed to place ${e.item.id}: ${e.error.message}`);
  console.log(`Pass 2 (emit): ${infos.length} blocks in ${(t2 - t1).toFixed(0)} ms`);

  flushBuckets();
  reflectionDirty = true;
  updatePlayerSpawnFromWorld();
  unstuckPlayer();
  const t3 = performance.now();
  console.log(`Build complete: ${placementMap.size} blocks in ${(t3 - t0).toFixed(0)} ms total`);
}

/* ============================= CREATIVE PLAYER ============================= */

/*
 * Tick-accurate recreation of Java Edition creative movement:
 *  - walk accel 0.098, sprint x1.3, sneak x0.3, ground drag 0.546
 *  - air accel 0.02 / sprint 0.026, air drag 0.91
 *  - jump 0.42, gravity 0.08, vertical drag 0.98 (terminal -3.92)
 *  - flight accel 0.05 (x2 sprinting), drag 0.91, vertical impulse 0.15 with 0.6 drag
 *  - double-tap jump toggles flight, landing while flying disables it
 *  - 0.6 step height, 0.6x1.8 hitbox (1.5 sneaking), 1.62 eye (1.27 sneaking)
 * All simulation runs at 20 ticks/second with render interpolation.
 */

const TICK_SECONDS = 0.05;
const PLAYER_HALF_WIDTH = 0.3;
const PLAYER_HEIGHT = 1.8;
const PLAYER_SNEAK_HEIGHT = 1.5;
const EYE_HEIGHT = 1.62;
const EYE_HEIGHT_SNEAK = 1.27;
const STEP_HEIGHT = 0.6;
const GRAVITY = 0.08;
const AIR_DRAG = 0.91;
const GROUND_DRAG = 0.6 * 0.91;
const GROUND_ACCEL_FACTOR = 0.16277136 / (GROUND_DRAG * GROUND_DRAG * GROUND_DRAG);
const WALK_ACCEL = 0.1;
const SPRINT_ACCEL_MULT = 1.3;
const SNEAK_ACCEL_MULT = 0.3;
const FLY_ACCEL = 0.05;
const FLY_VERTICAL_ACCEL = FLY_ACCEL * 3;
const FLY_VERTICAL_DRAG = 0.6;
const JUMP_VELOCITY = 0.42;
