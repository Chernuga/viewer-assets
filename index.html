const SPRINT_JUMP_BOOST = 0.2;
const JUMP_COOLDOWN_TICKS = 10;
const DOUBLE_TAP_TICKS = 7;
const EYE_SMOOTH_RATE = 18;
const COLLISION_EPS = 1e-7;
const PLAYER_MODE_KEY = 'voxelBuilderViewMode';
const FOV_STORAGE_KEY = 'voxelBuilderFov';

const player = {
  pos: new THREE.Vector3(camera.position.x, camera.position.y - EYE_HEIGHT, camera.position.z),
  prevPos: new THREE.Vector3(camera.position.x, camera.position.y - EYE_HEIGHT, camera.position.z),
  spawn: new THREE.Vector3(camera.position.x, camera.position.y - EYE_HEIGHT, camera.position.z),
  vel: new THREE.Vector3(),
  yaw: Math.PI / 4,
  pitch: -Math.PI / 6,
  height: PLAYER_HEIGHT,
  eyeHeight: EYE_HEIGHT,
  onGround: false,
  yCollided: false,
  collidedHorizontally: false,
  flying: true,
  sprinting: false,
  sprintLatch: false,
  sneaking: false,
  jumpCooldown: 0,
  flyToggleTimer: 0,
  sprintToggleTimer: 0,
  fov: 70,
};

const playerInput = {
  forward: false, back: false, left: false, right: false,
  jump: false, sneak: false, sprint: false,
  forwardEdge: false, jumpEdge: false,
};

let cameraMode = 'creative';
let pointerLocked = false;
let keyboardLockActive = false;
let physicsAccumulator = 0;
let hudRefreshTimer = 0;

const _camPos = new THREE.Vector3();
const _lookDir = new THREE.Vector3();

/* ---------------------------- collision queries ---------------------------- */

function playerCollidesAt(x, y, z, height = player.height) {
  const minX = x - PLAYER_HALF_WIDTH, maxX = x + PLAYER_HALF_WIDTH;
  const minY = y, maxY = y + height;
  const minZ = z - PLAYER_HALF_WIDTH, maxZ = z + PLAYER_HALF_WIDTH;
  // Geometry places a block at integer p in the cell [p+0.5, p+1.5].
  const x0 = Math.floor(minX - 0.5), x1 = Math.floor(maxX - 0.5 - COLLISION_EPS);
  const y0 = Math.floor(minY - 0.5), y1 = Math.floor(maxY - 0.5 - COLLISION_EPS);
  const z0 = Math.floor(minZ - 0.5), z1 = Math.floor(maxZ - 0.5 - COLLISION_EPS);

  for (let bx = x0; bx <= x1; bx++) {
    for (let by = y0; by <= y1; by++) {
      for (let bz = z0; bz <= z1; bz++) {
        const key = bx + ',' + by + ',' + bz;
        if (collisionSolids.has(key)) return true;
        const boxes = collisionPartials.get(key);
        if (!boxes) continue;
        for (const b of boxes) {
          if (maxX > bx + b.minX + COLLISION_EPS && minX < bx + b.maxX - COLLISION_EPS &&
              maxY > by + b.minY + COLLISION_EPS && minY < by + b.maxY - COLLISION_EPS &&
              maxZ > bz + b.minZ + COLLISION_EPS && minZ < bz + b.maxZ - COLLISION_EPS) {
            return true;
          }
        }
      }
    }
  }
  return false;
}

function playerHasSupport(x, y, z) {
  return playerCollidesAt(x, y - 0.02, z);
}

/* Move along one axis in <=0.2 block sweeps so terminal velocity cannot tunnel
 * through a floor, then bisect the last step to rest exactly on the surface. */
function sweepPlayerAxis(axis, delta) {
  if (!delta) return false;
  const steps = Math.max(1, Math.ceil(Math.abs(delta) / 0.2));
  const step = delta / steps;
  for (let i = 0; i < steps; i++) {
    const before = player.pos[axis];
    player.pos[axis] = before + step;
    if (!playerCollidesAt(player.pos.x, player.pos.y, player.pos.z)) continue;
    let lo = 0, hi = step;
    for (let j = 0; j < 12; j++) {
      const mid = (lo + hi) * 0.5;
      player.pos[axis] = before + mid;
      if (playerCollidesAt(player.pos.x, player.pos.y, player.pos.z)) hi = mid;
      else lo = mid;
    }
    player.pos[axis] = before + lo;
    return true;
  }
  return false;
}

function movePlayerHorizontal(axis) {
  const delta = player.vel[axis];
  if (!delta) return;

  const startAxis = player.pos[axis];
  const startY = player.pos.y;
  const hit = sweepPlayerAxis(axis, delta);
  if (!hit) {
    // Sneaking backs off ledges instead of walking off them.
    if (player.sneaking && !player.flying && player.onGround &&
        !playerHasSupport(player.pos.x, player.pos.y, player.pos.z)) {
      player.pos[axis] = startAxis;
      player.vel[axis] = 0;
    }
    return;
  }

  player.collidedHorizontally = true;

  // Auto-step (0.6) onto slabs, stairs, etc. Only while walking on the ground.
  if (!player.flying && player.onGround) {
    player.pos[axis] = startAxis;
    player.pos.y = startY;
    const raisedY = startY + STEP_HEIGHT;
    if (!playerCollidesAt(player.pos.x, raisedY, player.pos.z)) {
      player.pos.y = raisedY;
      if (!sweepPlayerAxis(axis, delta)) {
        const landed = sweepPlayerAxis('y', -STEP_HEIGHT);
        if (landed && player.pos.y >= startY - 1e-6) {
          player.collidedHorizontally = false;
          player.onGround = true;
          return;
        }
      }
    }
    player.pos[axis] = startAxis;
    player.pos.y = startY;
  }

  player.vel[axis] = 0;
}

function movePlayer() {
  player.yCollided = false;

  if (player.vel.y !== 0) {
    if (sweepPlayerAxis('y', player.vel.y)) {
      player.yCollided = true;
      player.vel.y = 0;
      player.onGround = playerHasSupport(player.pos.x, player.pos.y, player.pos.z);
    } else {
      player.onGround = false;
    }
  } else {
    player.onGround = playerHasSupport(player.pos.x, player.pos.y, player.pos.z);
  }

  movePlayerHorizontal('x');
  movePlayerHorizontal('z');

  if (!player.onGround) {
    player.onGround = playerHasSupport(player.pos.x, player.pos.y, player.pos.z);
  }
}

/* ------------------------------- spawning ------------------------------- */

function findNearestFreePosition(x, y, z, height, requireSupport = false) {
  const maxRadius = 16;
  const step = 0.5;
  const isFree = (px, py, pz) =>
    !playerCollidesAt(px, py, pz, height) &&
    (!requireSupport || playerCollidesAt(px, py - 0.02, pz, height));

  if (isFree(x, y, z)) return new THREE.Vector3(x, y, z);

  let best = null;
  let bestDist = Infinity;
  for (let dy = -maxRadius; dy <= maxRadius; dy += step) {
    for (let dx = -maxRadius; dx <= maxRadius; dx += step) {
      for (let dz = -maxRadius; dz <= maxRadius; dz += step) {
        const dist = dx * dx + dy * dy + dz * dz;
        if (dist >= bestDist) continue;
        const px = x + dx, py = y + dy, pz = z + dz;
        if (!isFree(px, py, pz)) continue;
        bestDist = dist;
        best = new THREE.Vector3(px, py, pz);
      }
    }
  }
  return best;
}

function computeSpawnPoint() {
  if (!worldBounds || !isFinite(worldBounds.minX)) {
    return new THREE.Vector3(0.5, 4.0, 0.5);
  }
  const b = worldBounds;
  const cx = (b.minX + b.maxX) * 0.5 + 1;
  const cz = (b.minZ + b.maxZ) * 0.5 + 1;
  const flying = CONFIG.player?.startFlying !== false;
  // Flying spawns above the build; grounded spawns stand on the top surface.
  const candidate = new THREE.Vector3(cx, flying ? b.maxY + 2.5 : b.maxY + 1.5, cz);
  const safe = findNearestFreePosition(candidate.x, candidate.y, candidate.z, PLAYER_HEIGHT, !flying);
  return safe || candidate;
}

function updatePlayerSpawnFromWorld() {
  player.spawn.copy(computeSpawnPoint());
}

function respawnPlayer() {
  player.pos.copy(player.spawn);
  player.prevPos.copy(player.spawn);
  player.vel.set(0, 0, 0);
  player.onGround = false;
  player.collidedHorizontally = false;
  player.sprinting = false;
  player.sneaking = false;
  player.height = PLAYER_HEIGHT;
  player.eyeHeight = EYE_HEIGHT;
  player.flying = CONFIG.player?.startFlying !== false;
  player.jumpCooldown = 0;
  player.flyToggleTimer = 0;
  player.sprintToggleTimer = 0;
  clearPlayerInput();
  updateHud();
}

function unstuckPlayer() {
  const safe = findNearestFreePosition(player.pos.x, player.pos.y, player.pos.z, player.height, false);
  if (!safe) return;
  player.pos.copy(safe);
  player.prevPos.copy(player.pos);
  player.vel.set(0, 0, 0);
}

/* ------------------------------- simulation ------------------------------- */

function physicsTick() {
  if (player.jumpCooldown > 0) player.jumpCooldown--;
  if (player.flyToggleTimer > 0) player.flyToggleTimer--;
  if (player.sprintToggleTimer > 0) player.sprintToggleTimer--;

  player.prevPos.copy(player.pos);

  const rawFwd = (playerInput.forward ? 1 : 0) - (playerInput.back ? 1 : 0);
  const rawStrafe = (playerInput.right ? 1 : 0) - (playerInput.left ? 1 : 0);
  const jumpHeld = playerInput.jump;
  const sneakHeld = playerInput.sneak;

  if (playerInput.jumpEdge && playerInput.jump) {
    playerInput.jumpEdge = false;
    if (player.flyToggleTimer <= 0) {
      player.flyToggleTimer = DOUBLE_TAP_TICKS;
    } else {
      player.flying = !player.flying;
      player.flyToggleTimer = 0;
      player.vel.y = 0;
    }
  }

  // Sprint start: hold Ctrl (or Cmd) or double-tap forward. The double-tap
  // latches sprint until forward is released; Ctrl stops when released.
  if (playerInput.forwardEdge && playerInput.forward && rawFwd > 0.8) {
    if (player.sprintToggleTimer <= 0) player.sprintToggleTimer = DOUBLE_TAP_TICKS;
    else { player.sprinting = true; player.sprintLatch = true; player.sprintToggleTimer = 0; }
  }
  playerInput.forwardEdge = false;
  if (playerInput.sprint && rawFwd > 0.8 && !player.sneaking) player.sprinting = true;
  if (player.sprinting && rawFwd < 0.8) { player.sprinting = false; player.sprintLatch = false; }

  const wantSneak = sneakHeld && !player.flying;
  if (wantSneak && !player.sneaking) {
    player.sneaking = true;
    player.height = PLAYER_SNEAK_HEIGHT;
  } else if (!wantSneak && player.sneaking) {
    if (!playerCollidesAt(player.pos.x, player.pos.y, player.pos.z, PLAYER_HEIGHT)) {
      player.sneaking = false;
      player.height = PLAYER_HEIGHT;
    }
  }
  if (player.sneaking) { player.sprinting = false; player.sprintLatch = false; }

  // Input smoothing: Minecraft multiplies the raw input by 0.98 per tick.
  let fwd = rawFwd * 0.98;
  let strafe = rawStrafe * 0.98;

  let accel, horizontalDrag;
  if (player.flying) {
    horizontalDrag = AIR_DRAG;
    accel = FLY_ACCEL * (player.sprinting ? 2 : 1);
  } else if (player.onGround) {
    horizontalDrag = GROUND_DRAG;
    accel = WALK_ACCEL * (player.sprinting ? SPRINT_ACCEL_MULT : 1) *
      (player.sneaking ? SNEAK_ACCEL_MULT : 1) * GROUND_ACCEL_FACTOR;
  } else {
    horizontalDrag = AIR_DRAG;
    accel = player.sprinting ? 0.026 : 0.02;
  }

  if (fwd || strafe) {
    const inputLength = Math.max(1, Math.hypot(fwd, strafe));
    const scale = accel / inputLength;
    const sinYaw = Math.sin(player.yaw), cosYaw = Math.cos(player.yaw);
    player.vel.x += (-sinYaw * fwd + cosYaw * strafe) * scale;
    player.vel.z += (-cosYaw * fwd - sinYaw * strafe) * scale;
  }

  if (!jumpHeld) player.jumpCooldown = 0;

  if (player.flying) {
    if (jumpHeld) player.vel.y += FLY_VERTICAL_ACCEL;
    if (sneakHeld) player.vel.y -= FLY_VERTICAL_ACCEL;
  } else if (jumpHeld && player.onGround && player.jumpCooldown === 0) {
    player.vel.y = JUMP_VELOCITY;
    if (player.sprinting) {
      player.vel.x += -Math.sin(player.yaw) * SPRINT_JUMP_BOOST;
      player.vel.z += -Math.cos(player.yaw) * SPRINT_JUMP_BOOST;
    }
    player.jumpCooldown = JUMP_COOLDOWN_TICKS;
  }

  const wasFlying = player.flying;
  const wasOnGround = player.onGround;
  const preMoveVy = player.vel.y;

  movePlayer();

  if (player.flying) {
    // The vertical impulse is preserved but heavily damped; gravity does not apply.
    player.vel.y = player.yCollided ? 0 : preMoveVy * FLY_VERTICAL_DRAG;
  } else {
    player.vel.y = (player.vel.y - GRAVITY) * 0.98;
  }
  player.vel.x *= horizontalDrag;
  player.vel.z *= horizontalDrag;

  if (Math.abs(player.vel.x) < 0.005) player.vel.x = 0;
  if (Math.abs(player.vel.y) < 0.005) player.vel.y = 0;
  if (Math.abs(player.vel.z) < 0.005) player.vel.z = 0;

  // Creative flight is cancelled when the player descends onto a surface.
  if (wasFlying && player.flying && !wasOnGround && player.onGround && preMoveVy < 0) {
    player.flying = false;
    player.vel.y = 0;
  }

  // Horizontal collisions must not cancel sprint: sliding along a wall keeps
  // the sprint state (and FOV) until forward is released or sneak is held.
}

function updatePlayer(delta) {
  physicsAccumulator += Math.min(delta, 0.25);
  let steps = 0;
  while (physicsAccumulator >= TICK_SECONDS && steps < 10) {
    physicsTick();
    physicsAccumulator -= TICK_SECONDS;
    steps++;
  }
  if (steps === 10) physicsAccumulator = 0;

  const alpha = Math.min(1, physicsAccumulator / TICK_SECONDS);
  // Smooth the crouch transition at render rate; doing it per tick made the
  // camera drop in visible 20 Hz steps.
  const targetEye = player.sneaking ? EYE_HEIGHT_SNEAK : EYE_HEIGHT;
  player.eyeHeight += (targetEye - player.eyeHeight) * (1 - Math.exp(-EYE_SMOOTH_RATE * delta));
  _camPos.lerpVectors(player.prevPos, player.pos, alpha);
  camera.position.set(_camPos.x, _camPos.y + player.eyeHeight, _camPos.z);
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

  const baseFov = CONFIG.player?.fov ?? 70;
  const targetFov = baseFov * (player.flying ? 1.1 : 1) * (player.sprinting ? 1.15 : 1);
  player.fov += (targetFov - player.fov) * Math.min(1, delta * 12);
  if (Math.abs(camera.fov - player.fov) > 0.01) {
    camera.fov = player.fov;
    camera.updateProjectionMatrix();
  }

  hudRefreshTimer += delta;
  if (hudRefreshTimer > 0.1) {
    hudRefreshTimer = 0;
    updateHud();
  }
}

/* -------------------------------- controls -------------------------------- */

function clearPlayerInput() {
  playerInput.forward = playerInput.back = playerInput.left = playerInput.right = false;
  playerInput.jump = playerInput.sneak = playerInput.sprint = false;
  playerInput.forwardEdge = playerInput.jumpEdge = false;
}

function requestPointerLock() {
  if (cameraMode !== 'creative' || pointerLocked) return;
  try {
    const p = canvas.requestPointerLock();
    if (p && typeof p.catch === 'function') p.catch(() => {});
  } catch (err) { /* pointer lock is optional */ }
}

/* Ctrl+W is a browser shortcut. The Keyboard Lock API can hand it to the page,
 * but Chrome only enables it in JS-initiated fullscreen. Both requests are made
 * synchronously in the click gesture; the key lock follows fullscreen. */
function disableKeyboardLock() {
  keyboardLockActive = false;
  try { navigator.keyboard?.unlock?.(); } catch (err) { /* ignore */ }
}

function enterImmersiveCapture() {
  let fullscreenRequest = null;
  if (navigator.keyboard && typeof navigator.keyboard.lock === 'function' && !document.fullscreenElement) {
    try { fullscreenRequest = document.documentElement.requestFullscreen(); } catch (err) { /* ignore */ }
  }
  requestPointerLock();

  if (!navigator.keyboard || typeof navigator.keyboard.lock !== 'function') return;
  Promise.resolve(fullscreenRequest)
    .then(() => navigator.keyboard.lock(['KeyW', 'KeyD', 'ControlLeft', 'ControlRight', 'MetaLeft', 'MetaRight']))
    .then(() => { keyboardLockActive = true; })
    .catch(() => { keyboardLockActive = false; });
}

function setCameraMode(mode, requestLock = true) {
  if (mode === 'creative' && cameraMode !== 'creative') {
    camera.getWorldDirection(_lookDir);
    player.pitch = Math.asin(Math.max(-1, Math.min(1, _lookDir.y)));
    player.yaw = Math.atan2(-_lookDir.x, -_lookDir.z);
    player.pos.set(camera.position.x, camera.position.y - EYE_HEIGHT, camera.position.z);
    player.prevPos.copy(player.pos);
    player.vel.set(0, 0, 0);
    player.onGround = false;
    player.sneaking = false;
    player.height = PLAYER_HEIGHT;
    player.eyeHeight = EYE_HEIGHT;
    player.flying = CONFIG.player?.startFlying !== false;
    unstuckPlayer();
  }

  cameraMode = mode;
  localStorage.setItem(PLAYER_MODE_KEY, mode);
  clearPlayerInput();
  physicsAccumulator = 0;

  const btn = document.getElementById('cameraBtn');
  const crosshair = document.getElementById('crosshair');

  if (mode === 'creative') {
    controls.enabled = false;
    document.body.classList.add('play');
    if (crosshair) crosshair.style.display = 'block';
    if (btn) {
      btn.textContent = 'Camera: Creative';
      btn.classList.add('on'); btn.classList.remove('off');
      btn.setAttribute('aria-pressed', 'true');
    }
    if (requestLock) enterImmersiveCapture();
  } else {
    document.exitPointerLock?.();
    controls.enabled = true;
    controls.target.copy(player.pos).add(_lookDir.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw)).multiplyScalar(6));
    controls.update();
    document.body.classList.remove('play');
    if (crosshair) crosshair.style.display = 'none';
    if (btn) {
      btn.textContent = 'Camera: Orbit';
      btn.classList.remove('on'); btn.classList.add('off');
      btn.setAttribute('aria-pressed', 'false');
    }
    const baseFov = CONFIG.player?.fov ?? 70;
    player.fov = baseFov;
    camera.fov = baseFov;
    camera.updateProjectionMatrix();
  }
  updateLockHint();
  updateHud();
}

function updateLockHint() {
  const hint = document.getElementById('lockHint');
  if (!hint) return;
  hint.style.display = (cameraMode === 'creative' && !pointerLocked) ? 'block' : 'none';
}

function updateHud() {
  const hud = document.getElementById('hud');
  if (!hud) return;
  if (cameraMode !== 'creative') {
    hud.textContent = 'Build with: /setblock x y z block_id[prop=val,...] • /fill x1 y1 z1 x2 y2 z2 block_id[prop=val,...] • H toggles heightmaps';
    return;
  }
  const state = player.flying ? 'Flying' : (player.sneaking ? 'Sneaking' : (player.sprinting ? 'Sprinting' : (player.onGround ? 'Walking' : 'Falling')));
  const pos = `${player.pos.x.toFixed(2)} / ${player.pos.y.toFixed(2)} / ${player.pos.z.toFixed(2)}`;
  hud.textContent =
    `Creative — ${state} — XYZ ${pos}\n` +
    `WASD move • Space ${player.flying ? 'fly up' : 'jump'} • Shift ${player.flying ? 'fly down' : 'sneak'}\n` +
    `${keyboardLockActive ? 'Ctrl sprint' : 'Ctrl sprint (needs fullscreen)'} • double-W sprint • double-Space flight\n` +
    `R respawn • Esc release mouse`;
}

function updateFovUi(fov) {
  const slider = document.getElementById('fovSlider');
  if (slider && Number(slider.value) !== fov) slider.value = String(fov);
  const value = document.getElementById('fovValue');
  if (value) value.textContent = fov + '°';
}

function setBaseFov(value, persist = true) {
  const fov = Math.max(30, Math.min(110, Math.round(Number(value) || 70)));
  if (!CONFIG.player) CONFIG.player = {};
  CONFIG.player.fov = fov;
  updateFovUi(fov);
  if (persist) localStorage.setItem(FOV_STORAGE_KEY, String(fov));
  if (cameraMode !== 'creative') {
    player.fov = fov;
    camera.fov = fov;
    camera.updateProjectionMatrix();
  }
}

function initPlayerController() {
  const cfg = CONFIG.player || {};
  const savedFov = parseFloat(localStorage.getItem(FOV_STORAGE_KEY));
  const fov = Number.isFinite(savedFov) ? savedFov : (cfg.fov ?? 70);
  player.fov = fov;
  setBaseFov(fov, false);
  camera.fov = player.fov;
  camera.updateProjectionMatrix();

  // Orient the camera at the build before taking the first-person pose from it.
  controls.target.set(0, 0, 0);
  controls.update();

  const saved = localStorage.getItem(PLAYER_MODE_KEY);
  const mode = saved === 'orbit' ? 'orbit' : 'creative';
  cameraMode = mode === 'creative' ? 'orbit' : 'creative'; // force the switch path
  setCameraMode(mode, false);
}

window.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;

  if (e.code === 'KeyH' && !e.repeat) setHeightMapsEnabled(!heightMapsEnabled);

  if (cameraMode !== 'creative') return;

  // With Keyboard Lock active this arrives after the shortcut was captured;
  // preventDefault is the last line of defence in browsers that deliver it.
  if ((e.ctrlKey || e.metaKey) && (e.code === 'KeyW' || e.code === 'KeyD')) e.preventDefault();

  switch (e.code) {
    case 'KeyW':
      if (!playerInput.forward && !e.repeat) playerInput.forwardEdge = true;
      playerInput.forward = true; break;
    case 'KeyS': playerInput.back = true; break;
    case 'KeyA': playerInput.left = true; break;
    case 'KeyD': playerInput.right = true; break;
    case 'Space':
      e.preventDefault();
      if (!playerInput.jump && !e.repeat) playerInput.jumpEdge = true;
      playerInput.jump = true; break;
    case 'ShiftLeft': case 'ShiftRight':
      playerInput.sneak = true; break;
    case 'ControlLeft': case 'ControlRight': case 'MetaLeft': case 'MetaRight':
      e.preventDefault();
      playerInput.sprint = true; break;
    case 'KeyR':
      if (!e.repeat) respawnPlayer();
      break;
  }
});

window.addEventListener('keyup', (e) => {
  switch (e.code) {
    case 'KeyW': playerInput.forward = false; break;
    case 'KeyS': playerInput.back = false; break;
    case 'KeyA': playerInput.left = false; break;
    case 'KeyD': playerInput.right = false; break;
    case 'Space': playerInput.jump = false; break;
    case 'ShiftLeft': case 'ShiftRight': playerInput.sneak = false; break;
    case 'ControlLeft': case 'ControlRight': case 'MetaLeft': case 'MetaRight': playerInput.sprint = false; break;
  }
});

window.addEventListener('blur', () => clearPlayerInput());

document.addEventListener('mousemove', (e) => {
  if (!pointerLocked || cameraMode !== 'creative') return;
  const sensitivity = CONFIG.player?.mouseSensitivity ?? 0.5;
  const f = sensitivity * 0.6 + 0.2;
  const degreesPerPixel = f * f * f * 8 * 0.15;
  player.yaw -= THREE.MathUtils.degToRad(e.movementX * degreesPerPixel);
  player.pitch -= THREE.MathUtils.degToRad(e.movementY * degreesPerPixel);
  const limit = Math.PI / 2 - 0.001;
  player.pitch = Math.max(-limit, Math.min(limit, player.pitch));
});

document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === canvas;
  if (!pointerLocked) {
    clearPlayerInput();
    disableKeyboardLock();
  }
  updateLockHint();
});

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) disableKeyboardLock();
});

canvas.addEventListener('click', () => {
  if (cameraMode === 'creative') enterImmersiveCapture();
});

const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');

function setSettingsOpen(open) {
  settingsPanel.classList.toggle('open', open);
  settingsPanel.setAttribute('aria-hidden', String(!open));
  settingsBtn.setAttribute('aria-expanded', String(open));
  settingsBtn.classList.toggle('open', open);
}

settingsBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  setSettingsOpen(!settingsPanel.classList.contains('open'));
});

document.addEventListener('click', (e) => {
  if (!settingsPanel.classList.contains('open')) return;
  if (settingsPanel.contains(e.target) || settingsBtn.contains(e.target)) return;
  setSettingsOpen(false);
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Escape' && !pointerLocked) setSettingsOpen(false);
});

document.getElementById('fovSlider').addEventListener('input', (e) => {
  setBaseFov(e.target.value, true);
});

document.getElementById('reflectionStrengthSlider').addEventListener('input', (e) => {
  setReflectionStrengthPercent(e.target.value, true);
});

document.getElementById('cameraBtn').addEventListener('click', () => {
  setSettingsOpen(false);
  if (cameraMode === 'creative') setCameraMode('orbit');
  else setCameraMode('creative');
});

function captureReflections() {
  const gridWasVisible = gridHelper.visible;
  const worldWasVisible = worldGroup.visible;
  const starWasVisible = starContainer ? starContainer.visible : false;
  const sunWasVisible = sunMesh ? sunMesh.visible : false;
  const moonWasVisible = moonMesh ? moonMesh.visible : false;
  gridHelper.visible = false;
  worldGroup.visible = false;
  if (starContainer) starContainer.visible = false;
  if (sunMesh) sunMesh.visible = false;
  if (moonMesh) moonMesh.visible = false;

  reflectionCamera.renderTarget = reflectionWriteTarget;
  reflectionCamera.position.copy(camera.position);
  reflectionCamera.updateMatrixWorld(true);
  reflectionCamera.update(renderer, scene);

  gridHelper.visible = gridWasVisible;
  worldGroup.visible = worldWasVisible;
  if (starContainer) starContainer.visible = starWasVisible;
  if (sunMesh) sunMesh.visible = sunWasVisible;
  if (moonMesh) moonMesh.visible = moonWasVisible;

  reflectionTexture = reflectionWriteTarget.texture;
  reflectionWriteTarget = reflectionWriteTarget === reflectionTargetA ? reflectionTargetB : reflectionTargetA;
  for (const material of blockMaterialCache.values()) {
    if (material.userData.reflective) material.envMap = reflectionTexture;
  }
}

function captureCelestialReflections() {
  const gridWasVisible = gridHelper.visible;
  const worldWasVisible = worldGroup.visible;
  const starWasVisible = starContainer ? starContainer.visible : false;
  const skyWasVisible = skyMesh ? skyMesh.visible : false;
  const background = scene.background;
  const clearColor = renderer.getClearColor(new THREE.Color());
  const clearAlpha = renderer.getClearAlpha();

  gridHelper.visible = false;
  worldGroup.visible = false;
  if (starContainer) starContainer.visible = false;
  if (skyMesh) skyMesh.visible = false;
  scene.background = null;
  renderer.setClearColor(0x000000, 1);

  celestialCamera.renderTarget = celestialWriteTarget;
  celestialCamera.position.copy(camera.position);
  celestialCamera.updateMatrixWorld(true);
  celestialCamera.update(renderer, scene);

  gridHelper.visible = gridWasVisible;
  worldGroup.visible = worldWasVisible;
  if (starContainer) starContainer.visible = starWasVisible;
  if (skyMesh) skyMesh.visible = skyWasVisible;
  scene.background = background;
  renderer.setClearColor(clearColor, clearAlpha);

  celestialTexture = celestialWriteTarget.texture;
  celestialWriteTarget = celestialWriteTarget === celestialTargetA ? celestialTargetB : celestialTargetA;
  for (const material of blockMaterialCache.values()) {
    if (!material.userData.reflective) continue;
    const u = material.userData.heightUniforms;
    if (u) u.uCelestialMap.value = celestialTexture;
  }
}

function updateReflections(delta) {
  if (!reflectionsEnabled) return;
  reflectionTimer += delta;
  if (reflectionDirty || reflectionTimer >= REFLECTION_INTERVAL) {
    reflectionTimer = 0;
    reflectionDirty = false;
    captureReflections();
  }
  celestialTimer += delta;
  if (celestialDirty || celestialTimer >= CELESTIAL_INTERVAL) {
    celestialTimer = 0;
    celestialDirty = false;
    captureCelestialReflections();
  }
}

/* ============================= ANIMATION ============================= */

const clock = new THREE.Clock();
let gameTime = 0;

function updateSky(delta) {
  if (!skyMaterial) return;
  skyElapsed += delta;
  const totalProgress = skyElapsed / CONFIG.sky.stateDuration;
  const stateIndex = Math.floor(totalProgress) % CONFIG.sky.stateCount;
  const nextIndex = (stateIndex + 1) % CONFIG.sky.stateCount;
  const localProgress = totalProgress - Math.floor(totalProgress);
  let blend = 0;
  if (localProgress >= CONFIG.sky.holdFraction) {
    blend = (localProgress - CONFIG.sky.holdFraction) / (1 - CONFIG.sky.holdFraction);
  }
  skyMaterial.uniforms.currentState.value = stateIndex;
  skyMaterial.uniforms.nextState.value = nextIndex;
  skyMaterial.uniforms.blend.value = blend;
  skyMesh.position.copy(camera.position);
}

const _orientMat = new THREE.Matrix4();
const _orientX = new THREE.Vector3();
const _orientY = new THREE.Vector3();
const _orientZ = new THREE.Vector3();

function orientCelestial(mesh, angle) {
  const c = Math.cos(angle);
  const s = Math.sin(angle);
  const nx = -c, ny = -s, nz = 0;
  const ux = -s, uy = c, uz = 0;
  const rx = uy * nz - uz * ny;
  const ry = uz * nx - ux * nz;
  const rz = ux * ny - uy * nx;
  _orientX.set(rx, ry, rz);
  _orientY.set(ux, uy, uz);
  _orientZ.set(nx, ny, nz);
  _orientMat.makeBasis(_orientX, _orientY, _orientZ);
  mesh.quaternion.setFromRotationMatrix(_orientMat);
}

function updateCelestialBodies(delta) {
  if (!sunMesh && !moonMesh && !starMesh) return;
  dayElapsed += delta;
  const angle = CONFIG.dayCycle.startAngleRadians + (dayElapsed / CONFIG.dayCycle.cycleSeconds) * Math.PI * 2;
  const sinAngle = Math.sin(angle);

  if (sunMesh) {
    const sunX = Math.cos(angle) * CONFIG.sun.distance;
    const sunY = Math.sin(angle) * CONFIG.sun.distance;
    sunMesh.position.set(camera.position.x + sunX, camera.position.y + sunY, camera.position.z);
    orientCelestial(sunMesh, angle);
    sunMesh.visible = true;
  }
  if (moonMesh) {
    const moonAngle = angle + Math.PI;
    const moonX = Math.cos(moonAngle) * CONFIG.moon.distance;
    const moonY = Math.sin(moonAngle) * CONFIG.moon.distance;
    moonMesh.position.set(camera.position.x + moonX, camera.position.y + moonY, camera.position.z);
    orientCelestial(moonMesh, moonAngle);
    moonMesh.visible = true;
    const dayCount = Math.floor(dayElapsed / CONFIG.dayCycle.cycleSeconds);
    const phaseIndex = ((CONFIG.moon.startingPhase + dayCount) % CONFIG.moon.phaseFiles.length + CONFIG.moon.phaseFiles.length) % CONFIG.moon.phaseFiles.length;
    if (phaseIndex !== currentMoonPhaseIndex && moonTextures[phaseIndex]) {
      moonMesh.material.uniforms.tex.value = moonTextures[phaseIndex];
      currentMoonPhaseIndex = phaseIndex;
    }
  }
  if (starContainer && starMesh) {
    starContainer.position.copy(camera.position);
    starContainer.rotation.z = angle - CONFIG.dayCycle.startAngleRadians;
    let night = 0;
    if (sinAngle < -0.05) night = Math.min(1, (-sinAngle - 0.05) / 0.35);
    if (starMesh.material.uniforms) {
      starMesh.material.uniforms.uNight.value = night;
      starMesh.material.uniforms.uTime.value = dayElapsed;
    }
    starMesh.visible = night > 0.001;
  }
}

function updateLighting() {
  const angle = CONFIG.dayCycle.startAngleRadians + (dayElapsed / CONFIG.dayCycle.cycleSeconds) * Math.PI * 2;
  const sinAngle = Math.sin(angle);
  const sunUp = Math.max(0, sinAngle);
  const moonUp = Math.max(0, -sinAngle);
  const totalUp = sunUp + moonUp;
  const dayness = totalUp > 0 ? sunUp / totalUp : 0.5;
  const fade = Math.min(1, totalUp / CONFIG.lighting.horizonFadeAngle);

  const ambientBase = CONFIG.lighting.ambientNight + (CONFIG.lighting.ambientDay - CONFIG.lighting.ambientNight) * dayness;
  ambientLight.intensity = ambientBase * (0.6 + 0.4 * fade);

  const activeAngle = sinAngle >= 0 ? angle : angle + Math.PI;
  const lx = Math.cos(activeAngle);
  const ly = Math.sin(activeAngle);
  heightSunDir.value.set(lx, ly, 0);
  const ld = 100;
  sunLight.position.set(camera.position.x + lx * ld, camera.position.y + ly * ld, camera.position.z);
  sunLight.target.position.copy(camera.position);
  sunLight.target.updateMatrixWorld();

  const dirIntensity = CONFIG.lighting.moonIntensity + (CONFIG.lighting.sunIntensity - CONFIG.lighting.moonIntensity) * dayness;
  sunLight.intensity = dirIntensity * fade;

  const sc = CONFIG.lighting.sunColorObj;
  const mc = CONFIG.lighting.moonColorObj;
  sunLight.color.setRGB(
    mc.r + (sc.r - mc.r) * dayness,
    mc.g + (sc.g - mc.g) * dayness,
    mc.b + (sc.b - mc.b) * dayness
  );
}

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1);
  gameTime += delta * 20 * CONFIG.animation.shaderSpeed;
  for (const { uniformRef } of timeUniforms) uniformRef.value = gameTime;
  for (const tex of animatedTextures) {
    const data = tex.userData; if (!data) continue;
    data.timer += delta;
    if (data.timer >= data.frameDuration) {
      data.timer = 0;
      data.currentFrame = (data.currentFrame + 1) % data.frameCount;
      tex.offset.y = 1 - ((data.currentFrame + 1) / data.frameCount);
      if (data.reflectionMask) data.reflectionMask.offset.y = tex.offset.y;
    }
  }
  if (cameraMode === 'creative') updatePlayer(delta);
  else controls.update();
  updateSky(delta);
  updateCelestialBodies(delta);
  updateLighting();
  updateReflections(delta);
  renderer.render(scene, camera);
}

/* ============================= SHA REFRESH ============================= */

async function forceRefreshSha() {
  localStorage.removeItem(SHA_KEY);
  textureCache.clear(); surfaceMapCache.clear(); surfaceMapPending.clear();
  modelCache.clear(); modelPending.clear();
  blockstateCache.clear(); blockstatePending.clear();
  defaultPropsCache.clear();
  shaderSourceCache.clear(); shaderMaterialCache.clear(); shaderMaterialPending.clear();
  blockMaterialCache.clear();
  materialBuckets.clear();
  tintColorCache.clear();
  grassColormap = null; foliageColormap = null;
  grassColormapData = null; foliageColormapData = null;
  animatedTextures.length = 0; timeUniforms.length = 0;
  clearWorld();

  if (skyMesh) { scene.remove(skyMesh); skyMesh.geometry.dispose(); skyMaterial.dispose(); skyMesh = null; skyMaterial = null; skyTexture = null; }
  if (starContainer) { scene.remove(starContainer); starMesh.geometry.dispose(); starMesh.material.dispose(); starContainer = null; starMesh = null; }
  if (sunMesh) { scene.remove(sunMesh); sunMesh.geometry.dispose(); sunMesh.material.dispose(); sunMesh = null; }
  if (moonMesh) { scene.remove(moonMesh); moonMesh.geometry.dispose(); moonMesh.material.dispose(); moonMesh = null; }
  moonTextures = [];
  currentMoonPhaseIndex = -1;
  skyElapsed = 0; dayElapsed = 0;

  const sha = await fetchLatestCommitSha();
  ASSET_BASE = `https://raw.githubusercontent.com/${REPO}/${sha}/minecraft`;
  REPO_BASE = `https://raw.githubusercontent.com/${REPO}/${sha}`;
  console.log('Refreshed asset base:', ASSET_BASE);
  await loadConfig();
  initHeightmapToggle();
  initReflectionStrength();
  initReflectionToggle();
  initPlayerController();
  await setupSky();
  await setupCelestialBodies();
  await setupStars();
  await build();
}

document.getElementById('renderBtn').addEventListener('click', () => { setSettingsOpen(false); saveCommandsToStorage(); build(); });
document.getElementById('heightmapBtn').addEventListener('click', () => { setHeightMapsEnabled(!heightMapsEnabled); });
document.getElementById('reflectionsBtn').addEventListener('click', () => { cycleReflectionMode(); });
document.getElementById('refreshShaBtn').addEventListener('click', () => { setSettingsOpen(false); forceRefreshSha(); });
window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

(async () => {
  const sha = await fetchLatestCommitSha();
  ASSET_BASE = `https://raw.githubusercontent.com/${REPO}/${sha}/minecraft`;
  REPO_BASE = `https://raw.githubusercontent.com/${REPO}/${sha}`;
  console.log('Asset base:', ASSET_BASE);
  await loadConfig();
  initHeightmapToggle();
  initReflectionStrength();
  initReflectionToggle();
  initPlayerController();
  await setupSky();
  await setupCelestialBodies();
  await setupStars();
  loadCommandsFromStorage();
  build();
  animate();
})();
</script>
